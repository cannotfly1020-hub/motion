<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="動作分析Pro">
<title>投手バイオメカニクス解析 - 動作分析Pro</title>

<!-- MediaPipe Pose -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100dvh; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
    
    #header { width: 100%; background: #1c1c1e; padding-top: calc(6px + env(safe-area-inset-top)); padding-left: calc(8px + env(safe-area-inset-left)); padding-right: calc(8px + env(safe-area-inset-right)); padding-bottom: 6px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #333; z-index: 30; flex-shrink: 0; }
    .header-top-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
    .btn-group-header { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
    
    .hdr-btn { -webkit-appearance: none; appearance: none; background: #007aff; color: white; border: none; padding: 5px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .hdr-btn.secondary { background: #3a3a3c; }
    .hdr-btn.fps-badge { background: #30d158; color: #000; font-size: 10px; }
    .hdr-btn.roi-active { background: #ff9500 !important; color: #000 !important; font-weight: bold; }
    .hdr-btn.rec-active { background: #ff3b30 !important; animation: pulse-red 1s infinite; }
    @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    
    #result-box { width: 100%; background: #262629; border-radius: 6px; padding: 5px 8px; border: 1px solid #3a3a3c; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .result-text-area { flex: 1; min-width: 0; }
    #main-result { color: #00ffcc; font-size: 12px; font-weight: bold; line-height: 1.2; }
    #sub-result { color: #aaa; font-size: 10px; margin-top: 2px; font-weight: 500; line-height: 1.2; }
    #scale-info-text { font-size: 10px; color: #ff9500; font-weight: 600; white-space: nowrap; }

    #stage { width: 100%; position: relative; flex: 1; min-height: 0; display: flex; background: #000; overflow: hidden; }
    .video-pane { position: relative; flex: 1; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .zoom-target { width: 100%; height: 100%; position: relative; transform-origin: center center; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #outputCanvas { z-index: 1; pointer-events: none; }
    #interactionCanvas { z-index: 10; touch-action: none; cursor: crosshair; }

    #controls { width: 100%; background: #1c1c1e; padding-top: 5px; padding-left: calc(8px + env(safe-area-inset-left)); padding-right: calc(8px + env(safe-area-inset-right)); padding-bottom: calc(6px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 5px; border-top: 1px solid #333; z-index: 30; flex-shrink: 0; }
    
    .seek-row { display: flex; align-items: center; gap: 6px; width: 100%; }
    .seek-label { font-size: 10px; font-weight: bold; color: #007aff; width: 14px; flex-shrink: 0; text-align: center; }
    input[type=range] { flex: 1; height: 18px; accent-color: #007aff; }

    .phase-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .phase-btn { background: #2c2c2e; color: #888; border: 1.5px solid #444; padding: 7px 0; border-radius: 6px; font-size: 11px; font-weight: bold; text-align: center; cursor: pointer; transition: all 0.2s; }
    .phase-btn.active-fc { background: #007aff; color: #fff; border-color: #007aff; }
    .phase-btn.active-mer { background: #ff9500; color: #000; border-color: #ff9500; }
    .phase-btn.active-br { background: #ff375f; color: #fff; border-color: #ff375f; }
    .phase-btn.active-ft { background: #30d158; color: #000; border-color: #30d158; }

    .mode-grid { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    button.ctrl-btn { -webkit-appearance: none; appearance: none; width: 100%; padding: 6px 0; background: #2c2c2e; color: white; border: none; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; }
    button.ctrl-btn:active { background: #444; }
    button.mode-active { background: #ff9500; color: #000; font-weight: bold; }
    #btnModeZoom.mode-active { background: #007aff; color: #fff; }

    .dashboard-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .side-box { background: #262629; border-radius: 6px; padding: 4px 6px; border: 1px solid #3a3a3c; }
    .side-box.kinematics { border-top: 2.5px solid #00ffcc; }
    .side-box.release { border-top: 2.5px solid #ff375f; }
    .side-title { font-size: 10px; font-weight: bold; text-align: center; margin-bottom: 2px; }
    .metric-row { display: flex; justify-content: space-between; font-size: 9.5px; padding: 1.5px 0; color: #ccc; }
    .metric-val { font-weight: bold; font-family: monospace; color: #fff; }
    .highlight-val { color: #00ffcc !important; }

    .playback-row { width: 100%; display: grid; grid-template-columns: 1fr 1.3fr 1fr 0.9fr 1fr; gap: 4px; }
    #btnPlayPause { background: #34c759; color: #000; font-weight: bold; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
    .modal-card { background: #2c2c2e; border: 1px solid #444; border-radius: 12px; width: 90%; max-width: 340px; padding: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    .modal-card h3 { font-size: 15px; margin-bottom: 6px; color: #ff9500; }
    .modal-card p { font-size: 12px; color: #ccc; margin-bottom: 12px; }
    .modal-input-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 14px; }
    .modal-input-row input { width: 100px; font-size: 16px; padding: 6px; text-align: center; border-radius: 6px; border: 1px solid #555; background: #1c1c1e; color: #fff; }
    .modal-btn-row { display: flex; gap: 8px; }
    .modal-btn-row button { flex: 1; padding: 8px 0; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; }
    #snapshot-img { max-width: 100%; max-height: 50vh; border-radius: 6px; border: 1px solid #555; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="header">
    <div class="header-top-row">
        <div class="btn-group-header">
            <button class="hdr-btn" onclick="document.getElementById('inputFile').click()">動画選択</button>
            <input type="file" id="inputFile" accept="video/*" style="display:none;">
            <button class="hdr-btn fps-badge" id="btnFps" onclick="toggleFPS()">60fps</button>
            <button class="hdr-btn secondary" id="btnToggleRoi" onclick="toggleRoiMode()">🔲 対象者指定</button>
            <button class="hdr-btn" style="background:#5856d6;" onclick="captureSnapshot()">📸 静止画</button>
            <button class="hdr-btn" id="btnRecord" style="background:#ff3b30;" onclick="toggleRecording()">🎥 録画開始</button>
        </div>
        <span id="scale-info-text">物差し: 未設定</span>
    </div>
    <div id="result-box">
        <div class="result-text-area">
            <div id="main-result">投手バイオメカニクス解析</div>
            <div id="sub-result">「📏 物差し」設定後、FC・MER・BR・FTを記録してください</div>
        </div>
    </div>
</div>

<div id="stage">
    <div class="video-pane" id="viewportArea">
        <div class="zoom-target" id="zoomTarget">
            <video id="videoElement" playsinline webkit-playsinline muted preload="auto" crossorigin="anonymous"></video>
            <canvas id="outputCanvas"></canvas>
            <canvas id="interactionCanvas"></canvas>
        </div>
    </div>
</div>

<div id="controls">
    <div class="seek-row">
        <span class="seek-label">①</span>
        <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.05">
    </div>

    <div class="phase-actions">
        <button class="phase-btn" id="btnFC" onclick="markPhase('fc')">① FC(接地)</button>
        <button class="phase-btn" id="btnMER" onclick="markPhase('mer')">② MER(最大外旋)</button>
        <button class="phase-btn" id="btnBR" onclick="markPhase('br')">③ BR(リリース)</button>
        <button class="phase-btn" id="btnFT" onclick="markPhase('ft')">④ FT(フォロー)</button>
    </div>

    <div class="mode-grid">
        <button class="ctrl-btn" id="btnModeScale" onclick="toggleScaleMode()">📏 物差し</button>
        <button class="ctrl-btn" id="btnModeZoom" onclick="toggleZoomMode()">🔍 ズーム</button>
        <button class="ctrl-btn" onclick="clearPhaseData()">🗑 クリア</button>
        <button class="ctrl-btn" onclick="resetZoom()">1x 表示</button>
    </div>

    <div id="zoom-controls" style="display:none; width:100%; align-items:center; gap:8px;">
        <span style="font-size:11px; font-weight:bold; color:#007aff;">倍率</span>
        <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1">
    </div>

    <!-- ダッシュボード (床反力を削除し、リリース＆フォーム特化に再編) -->
    <div class="dashboard-grid">
        <div class="side-box kinematics">
            <div class="side-title" style="color:#00ffcc;">🎯 投球キネマティクス</div>
            <div class="metric-row"><span>FC歩幅(ステップ幅):</span><span id="res_stride" class="metric-val highlight-val">--- cm</span></div>
            <div class="metric-row"><span>MER 肘屈曲角度:</span><span id="res_mer_elbow" class="metric-val" style="color:#ffd60a;">---°</span></div>
            <div class="metric-row"><span>最大 捻転差:</span><span id="res_max_xfactor" class="metric-val">0.0°</span></div>
        </div>
        <div class="side-box release">
            <div class="side-title" style="color:#ff375f;">⚾️ リリースポイント詳細</div>
            <div class="metric-row"><span>BR リリース高:</span><span id="res_release_h" class="metric-val" style="color:#ff375f;">--- cm</span></div>
            <div class="metric-row"><span>リリース前方伸長:</span><span id="res_release_ext" class="metric-val" style="color:#30d158;">--- cm</span></div>
            <div class="metric-row"><span>リリース時 体幹前傾:</span><span id="res_release_tilt" class="metric-val">---°</span></div>
        </div>
    </div>

    <div class="playback-row">
        <button class="ctrl-btn" id="btnStepBack">◀ -1</button>
        <button class="ctrl-btn" id="btnPlayPause">▶ 再生</button>
        <button class="ctrl-btn" id="btnStepForward">+1 ▶</button>
        <button class="ctrl-btn" id="btnSpeed" onclick="togglePlaybackRate()">1.0x</button>
        <button class="ctrl-btn" style="background:#555;" onclick="fitCanvases()">🔄 更新</button>
    </div>
</div>

<!-- Scale Modal -->
<div id="scale-modal-overlay" class="modal-overlay">
    <div class="modal-card">
        <h3>物差しの長さ設定</h3>
        <p>画面上の長さが分かっている2点を指定</p>
        <div class="modal-input-row">
            <input type="number" id="scale-input-value" inputmode="decimal" placeholder="100" value="100">
            <span style="font-weight:bold; font-size:15px;">cm</span>
        </div>
        <div class="modal-btn-row">
            <button style="background:#444; color:#fff;" onclick="closeScaleModal(true)">キャンセル</button>
            <button style="background:#ff9500; color:#000;" onclick="submitScaleModal()">確定</button>
        </div>
    </div>
</div>

<!-- Snapshot Modal -->
<div id="snapshot-modal-overlay" class="modal-overlay">
    <div class="modal-card" style="max-width:360px;">
        <h3 style="color:#5856d6;">📸 投球バイオメカニクスキャプチャ</h3>
        <p style="font-size:11px; color:#aaa;">画像を長押しして「写真に追加」で保存できます</p>
        <img id="snapshot-img" src="" alt="Screenshot">
        <div class="modal-btn-row">
            <button style="background:#444; color:#fff;" onclick="closeSnapshotModal()">閉じる</button>
        </div>
    </div>
</div>

<script>
const video = document.getElementById('videoElement');
const outputCanvas = document.getElementById('outputCanvas');
const outCtx = outputCanvas.getContext('2d');
const interactionCanvas = document.getElementById('interactionCanvas');
const intCtx = interactionCanvas.getContext('2d');
const zoomTarget = document.getElementById('zoomTarget');
const seekSlider = document.getElementById('seekSlider');
const btnPlayPause = document.getElementById('btnPlayPause');
const mainResult = document.getElementById('main-result');
const subResult = document.getElementById('sub-result');

let currentFPS = 60.0;
const fpsList = [30, 60, 120, 240];
let fpsIdx = 1;
const playbackRates = [1.0, 0.5, 0.25];
let currentRateIdx = 0;

let isProcessing = false;
let animationFrameId = null;
let currentBlobUrl = null;

// Scale & Zoom
let pxPerCm = null;
let isZoomMode = false;
let isScaleMode = false;
let isBrSettingMode = false; // リリースタップ調整モード
let scalePoints = [];
let zoomScale = 1.0;
let panOffsetX = 0, panOffsetY = 0;
let isPanning = false;

// ROI
let isRoiMode = false;
let isRoiDrawing = false;
let isRoiEnabled = false;
let roiStart = { x: 0, y: 0 };
let roiNorm = { x: 0.2, y: 0.1, w: 0.6, h: 0.8 };
const roiCanvas = document.createElement('canvas');
const roiCtx = roiCanvas.getContext('2d');

// Pitching Data & Phases
const phases = { fc: null, mer: null, br: null, ft: null };
let maxRecordedXFactor = 0;
let latestLandmarks = null;

// 録画
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
const recCanvas = document.createElement('canvas');
const recCtx = recCanvas.getContext('2d');

const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
pose.onResults(onResults);

function getVideoRenderBox() {
    const cWidth = outputCanvas.width, cHeight = outputCanvas.height;
    if (!video.videoWidth || !video.videoHeight || cWidth === 0 || cHeight === 0) {
        return { x: 0, y: 0, w: cWidth, h: cHeight };
    }
    const videoRatio = video.videoWidth / video.videoHeight;
    const canvasRatio = cWidth / cHeight;
    let renderW, renderH, offsetX, offsetY;

    if (canvasRatio > videoRatio) {
        renderH = cHeight; renderW = cHeight * videoRatio;
        offsetX = (cWidth - renderW) / 2; offsetY = 0;
    } else {
        renderW = cWidth; renderH = cWidth / videoRatio;
        offsetX = 0; offsetY = (cHeight - renderH) / 2;
    }
    return { x: offsetX, y: offsetY, w: renderW, h: renderH };
}

function fitCanvases() {
    const rect = video.parentElement.getBoundingClientRect();
    if (rect.width > 0 && rect.height > 0) {
        [outputCanvas, interactionCanvas].forEach(c => { c.width = rect.width; c.height = rect.height; });
    }
    redrawOverlay();
    if (latestLandmarks) drawPitchingBiomechanics(latestLandmarks);
}
window.addEventListener('resize', fitCanvases);

function toggleFPS() {
    fpsIdx = (fpsIdx + 1) % fpsList.length;
    currentFPS = fpsList[fpsIdx];
    document.getElementById('btnFps').innerText = `${currentFPS}fps`;
}

function togglePlaybackRate() {
    currentRateIdx = (currentRateIdx + 1) % playbackRates.length;
    video.playbackRate = playbackRates[currentRateIdx];
    document.getElementById('btnSpeed').innerText = `${video.playbackRate}x`;
}

function toggleZoomMode() {
    isZoomMode = !isZoomMode;
    const btn = document.getElementById('btnModeZoom');
    const controls = document.getElementById('zoom-controls');
    if (isZoomMode) {
        isRoiMode = isScaleMode = false;
        btn.classList.add('mode-active');
        controls.style.display = 'flex';
    } else {
        btn.classList.remove('mode-active');
        controls.style.display = 'none';
    }
    updateButtons();
}

function applyZoom() { zoomTarget.style.transform = `translate(${panOffsetX}px, ${panOffsetY}px) scale(${zoomScale})`; }
function resetZoom() { zoomScale = 1.0; panOffsetX = 0; panOffsetY = 0; document.getElementById('zoom-slider').value = 1.0; applyZoom(); }
document.getElementById('zoom-slider').addEventListener('input', (e) => { zoomScale = parseFloat(e.target.value); applyZoom(); });

function toggleScaleMode() {
    isScaleMode = !isScaleMode;
    if (isScaleMode) {
        isZoomMode = isRoiMode = false;
        scalePoints = [];
        mainResult.innerText = "📏 物差し：基準の長さを2点タップ";
        subResult.innerText = "画面上で長さが分かるものの両端をタップしてください";
    } else {
        mainResult.innerText = "投手バイオメカニクス解析";
    }
    updateButtons();
    redrawOverlay();
}

function toggleRoiMode() {
    isRoiMode = !isRoiMode;
    if (isRoiMode) {
        isZoomMode = isScaleMode = false;
        mainResult.innerText = "🔲 対象者を画面ドラッグで囲んでください";
    } else {
        mainResult.innerText = "投手バイオメカニクス解析";
    }
    updateButtons();
    redrawOverlay();
}

function updateButtons() {
    document.getElementById('btnModeZoom').classList.toggle('mode-active', isZoomMode);
    document.getElementById('btnModeScale').classList.toggle('mode-active', isScaleMode);
    document.getElementById('btnToggleRoi').classList.toggle('roi-active', isRoiMode);
}

function getCanvasPoint(e) {
    const rect = interactionCanvas.getBoundingClientRect();
    const cvsX = (e.clientX - rect.left) * (interactionCanvas.width / rect.width);
    const cvsY = (e.clientY - rect.top) * (interactionCanvas.height / rect.height);
    return { x: cvsX, y: cvsY };
}

interactionCanvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const pt = getCanvasPoint(e);

    // 物差し設定
    if (isScaleMode) {
        scalePoints.push(pt);
        if (scalePoints.length === 2) {
            document.getElementById('scale-modal-overlay').style.display = 'flex';
            document.getElementById('scale-input-value').focus();
        }
        redrawOverlay();
        return;
    }

    // リリース点の手動ピンポイント配置
    if (isBrSettingMode) {
        phases.br = {
            wristPos: { ...pt },
            time: video.currentTime,
            frame: Math.round(video.currentTime * currentFPS)
        };
        isBrSettingMode = false;
        updatePhaseBtnStyles();
        recalcPitchMetrics();
        if (latestLandmarks) drawPitchingBiomechanics(latestLandmarks);
        mainResult.innerHTML = "<span style='color:#ff375f;'>⚾️ リリース点を配置しました</span>";
        subResult.innerText = "位置を再変更する場合は「③ BR」を押して再度画面をタップしてください";
        return;
    }

    if (isRoiMode) {
        const box = getVideoRenderBox();
        isRoiDrawing = true;
        roiStart = {
            x: Math.max(0, Math.min(1.0, (pt.x - box.x) / box.w)),
            y: Math.max(0, Math.min(1.0, (pt.y - box.y) / box.h))
        };
        roiNorm = { x: roiStart.x, y: roiStart.y, w: 0, h: 0 };
        isRoiEnabled = true;
        try { interactionCanvas.setPointerCapture(e.pointerId); } catch(err){}
        return;
    }

    if (isZoomMode || zoomScale > 1.0) {
        isPanning = true; panStartX = e.clientX - panOffsetX; panStartY = e.clientY - panOffsetY;
        try { interactionCanvas.setPointerCapture(e.pointerId); } catch(err){}
    }
});

interactionCanvas.addEventListener('pointermove', (e) => {
    if (isRoiDrawing && isRoiMode) {
        const pt = getCanvasPoint(e);
        const box = getVideoRenderBox();
        const currentNorm = {
            x: Math.max(0, Math.min(1.0, (pt.x - box.x) / box.w)),
            y: Math.max(0, Math.min(1.0, (pt.y - box.y) / box.h))
        };
        roiNorm.x = Math.min(roiStart.x, currentNorm.x);
        roiNorm.y = Math.min(roiStart.y, currentNorm.y);
        roiNorm.w = Math.abs(currentNorm.x - roiStart.x);
        roiNorm.h = Math.abs(currentNorm.y - roiStart.y);
        redrawOverlay();
        return;
    }
    if (isPanning) { panOffsetX = e.clientX - panStartX; panOffsetY = e.clientY - panStartY; applyZoom(); }
});

interactionCanvas.addEventListener('pointerup', (e) => {
    if (isRoiDrawing) {
        isRoiDrawing = false;
        try { interactionCanvas.releasePointerCapture(e.pointerId); } catch(err){}
        toggleRoiMode();
        renderCurrentFrame();
    }
    if (isPanning) { isPanning = false; try { interactionCanvas.releasePointerCapture(e.pointerId); } catch(err){} }
});

function closeScaleModal(isCancel = true) {
    document.getElementById('scale-modal-overlay').style.display = 'none';
    if (isCancel) scalePoints = [];
    isScaleMode = false;
    updateButtons();
    redrawOverlay();
}

function submitScaleModal() {
    const realCm = parseFloat(document.getElementById('scale-input-value').value);
    if (realCm && realCm > 0 && scalePoints.length === 2) {
        const distPx = Math.hypot(scalePoints[1].x - scalePoints[0].x, scalePoints[1].y - scalePoints[0].y);
        pxPerCm = distPx / realCm;
        document.getElementById('scale-info-text').innerText = `物差し: ${(pxPerCm).toFixed(1)}px/cm`;
        closeScaleModal(false); 
        mainResult.innerHTML = "<span style='color:#30d158;'>✅ 物差し設定完了</span>";
        subResult.innerText = "投球の各キーフェーズ（FC・MER・BR・FT）を記録してください";
        recalcPitchMetrics();
    } else {
        alert("有効な数値を入力してください");
    }
}

function redrawOverlay() {
    intCtx.clearRect(0, 0, interactionCanvas.width, interactionCanvas.height);
    const box = getVideoRenderBox();

    if (isRoiEnabled && roiNorm.w > 0.05) {
        const rx = box.x + roiNorm.x * box.w, ry = box.y + roiNorm.y * box.h;
        const rw = roiNorm.w * box.w, rh = roiNorm.h * box.h;
        intCtx.save();
        intCtx.fillStyle = 'rgba(0, 0, 0, 0.35)'; intCtx.fillRect(0, 0, interactionCanvas.width, interactionCanvas.height);
        intCtx.clearRect(rx, ry, rw, rh);
        intCtx.strokeStyle = '#ff9500'; intCtx.lineWidth = 2.5 / zoomScale; intCtx.setLineDash([6 / zoomScale, 4 / zoomScale]);
        intCtx.strokeRect(rx, ry, rw, rh);
        intCtx.restore();
    }

    if (scalePoints.length > 0) {
        intCtx.save();
        intCtx.fillStyle = '#ff9500'; intCtx.strokeStyle = isScaleMode ? '#ff9500' : 'rgba(255, 149, 0, 0.4)';
        intCtx.lineWidth = 3 / zoomScale; if (!isScaleMode) intCtx.setLineDash([4/zoomScale, 4/zoomScale]);
        intCtx.beginPath(); intCtx.arc(scalePoints[0].x, scalePoints[0].y, 6 / zoomScale, 0, Math.PI*2); intCtx.fill();
        if (scalePoints.length === 2) {
            intCtx.beginPath(); intCtx.arc(scalePoints[1].x, scalePoints[1].y, 6 / zoomScale, 0, Math.PI*2); intCtx.fill();
            intCtx.beginPath(); intCtx.moveTo(scalePoints[0].x, scalePoints[0].y); intCtx.lineTo(scalePoints[1].x, scalePoints[1].y); intCtx.stroke();
        }
        intCtx.restore();
    }
}

function updatePhaseBtnStyles() {
    document.getElementById('btnFC').className = `phase-btn ${phases.fc ? 'active-fc' : ''}`;
    document.getElementById('btnMER').className = `phase-btn ${phases.mer ? 'active-mer' : ''}`;
    document.getElementById('btnBR').className = `phase-btn ${phases.br ? 'active-br' : ''}`;
    document.getElementById('btnFT').className = `phase-btn ${phases.ft ? 'active-ft' : ''}`;
}

function calcAngle(p1, p2, p3) {
    const v1 = { x: p1.x - p2.x, y: p1.y - p2.y };
    const v2 = { x: p3.x - p2.x, y: p3.y - p2.y };
    const dot = v1.x * v2.x + v1.y * v2.y;
    const mag1 = Math.hypot(v1.x, v1.y), mag2 = Math.hypot(v2.x, v2.y);
    if (mag1 === 0 || mag2 === 0) return 0;
    return Math.acos(Math.max(-1, Math.min(1, dot / (mag1 * mag2)))) * (180 / Math.PI);
}

function onResults(results) {
    if (!results.poseLandmarks) {
        outCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
        return;
    }

    const rawLm = results.poseLandmarks;
    latestLandmarks = rawLm.map(p => {
        if (isRoiEnabled && roiNorm.w > 0.05) { 
            return { x: roiNorm.x + p.x * roiNorm.w, y: roiNorm.y + p.y * roiNorm.h, z: p.z, visibility: p.visibility }; 
        }
        return p;
    });

    drawPitchingBiomechanics(latestLandmarks);
}

function drawPitchingBiomechanics(lm) {
    outCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
    outCtx.save();
    outCtx.lineWidth = 3 / zoomScale;

    const box = getVideoRenderBox();
    const toPx = (p) => ({ x: box.x + p.x * box.w, y: box.y + p.y * box.h });

    const shL = lm[11], shR = lm[12], hipL = lm[23], hipR = lm[24];

    // 捻転差
    if (shL && shR && hipL && hipR) {
        const pShL = toPx(shL), pShR = toPx(shR), pHipL = toPx(hipL), pHipR = toPx(hipR);
        const shAngle = Math.atan2((shR.z || 0) - (shL.z || 0), (shR.x - shL.x)) * (180 / Math.PI);
        const hipAngle = Math.atan2((hipR.z || 0) - (hipL.z || 0), (hipR.x - hipL.x)) * (180 / Math.PI);
        let xFactor = Math.abs(shAngle - hipAngle);
        if (xFactor > 90) xFactor = 180 - xFactor;
        if (xFactor > maxRecordedXFactor && !video.paused) {
            maxRecordedXFactor = xFactor;
            document.getElementById('res_max_xfactor').innerText = `${maxRecordedXFactor.toFixed(1)}°`;
        }

        outCtx.strokeStyle = '#00ffcc'; outCtx.beginPath(); outCtx.moveTo(pShL.x, pShL.y); outCtx.lineTo(pShR.x, pShR.y); outCtx.stroke();
        outCtx.strokeStyle = '#ffd60a'; outCtx.beginPath(); outCtx.moveTo(pHipL.x, pHipL.y); outCtx.lineTo(pHipR.x, pHipR.y); outCtx.stroke();
    }

    const drawL = (p1, p2, color) => {
        if (lm[p1] && lm[p2] && (lm[p1].visibility === undefined || lm[p1].visibility > 0.2) && (lm[p2].visibility === undefined || lm[p2].visibility > 0.2)) {
            const pt1 = toPx(lm[p1]), pt2 = toPx(lm[p2]);
            outCtx.strokeStyle = color; outCtx.beginPath(); outCtx.moveTo(pt1.x, pt1.y); outCtx.lineTo(pt2.x, pt2.y); outCtx.stroke();
        }
    };
    drawL(12, 14, '#ff9500'); drawL(14, 16, '#ff9500'); // 右腕
    drawL(11, 13, '#00ffcc'); drawL(13, 15, '#00ffcc'); // 左腕
    drawL(24, 26, '#ffd60a'); drawL(26, 28, '#ffd60a'); // 右脚
    drawL(23, 25, '#ffd60a'); drawL(25, 27, '#ffd60a'); // 左脚

    // リリースポイントの描画（ターゲットマーカー）
    if (phases.br && phases.br.wristPos) {
        outCtx.save();
        outCtx.strokeStyle = '#ff375f'; outCtx.fillStyle = '#ff375f'; outCtx.lineWidth = 2.5 / zoomScale;
        outCtx.beginPath(); outCtx.arc(phases.br.wristPos.x, phases.br.wristPos.y, 9 / zoomScale, 0, Math.PI * 2); outCtx.stroke();
        outCtx.beginPath(); outCtx.arc(phases.br.wristPos.x, phases.br.wristPos.y, 3 / zoomScale, 0, Math.PI * 2); outCtx.fill();
        outCtx.fillStyle = '#fff'; outCtx.font = `bold ${Math.max(11, 12/zoomScale)}px sans-serif`;
        outCtx.fillText("⚾️ BRリリース点", phases.br.wristPos.x + 12/zoomScale, phases.br.wristPos.y - 6/zoomScale);
        outCtx.restore();
    }

    outCtx.restore();
}

// 4大フェーズ記録
function markPhase(key) {
    if (!video.videoWidth || !latestLandmarks) return;
    const frame = Math.round(video.currentTime * currentFPS);
    const box = getVideoRenderBox();
    const toPx = (p) => ({ x: box.x + p.x * box.w, y: box.y + p.y * box.h });

    const lm = latestLandmarks;
    const shL = lm[11], shR = lm[12], elR = lm[14], wrR = lm[16], idxR = lm[20], elL = lm[13], wrL = lm[15], idxL = lm[19];
    const hipL = lm[23], hipR = lm[24], ankL = lm[27], ankR = lm[28];

    phases[key] = { time: frame / currentFPS, frame: frame };

    if (key === 'fc' && ankL && ankR) {
        const pL = toPx(ankL), pR = toPx(ankR);
        phases.fc.stridePx = Math.abs(pL.x - pR.x);
    }
    if (key === 'mer' && shR && elR && wrR) {
        const pSh = toPx(shR), pEl = toPx(elR), pWr = toPx(wrR);
        phases.mer.elbowAngle = calcAngle(pSh, pEl, pWr);
    }
    
    // ③ BR記録時: 前腕-手首-指先ベクトルから高精度推定し、タップ直接修正モードをONにする
    if (key === 'br') {
        const isRight = (wrR && wrR.visibility > 0.3) || (wrR && !wrL);
        const wr = isRight ? wrR : wrL;
        const el = isRight ? elR : elL;
        const idx = isRight ? idxR : idxL;

        let autoPos = null;
        if (wr) {
            const pWr = toPx(wr);
            if (idx && idx.visibility > 0.3) {
                // 指先（人差し指）が取れている場合は指先先端をボール位置とする
                autoPos = toPx(idx);
            } else if (el) {
                // 肘→手首の延長線上（手首から約10〜15cm先）にボールを推定配置
                const pEl = toPx(el);
                const dx = pWr.x - pEl.x, dy = pWr.y - pEl.y;
                const len = Math.hypot(dx, dy);
                if (len > 0) {
                    const extDist = (pxPerCm ? pxPerCm * 12 : 25);
                    autoPos = { x: pWr.x + (dx / len) * extDist, y: pWr.y + (dy / len) * extDist };
                } else {
                    autoPos = pWr;
                }
            } else {
                autoPos = pWr;
            }
        }

        if (autoPos) phases.br.wristPos = autoPos;
        isBrSettingMode = true; // タップでピンポイント微調整可能に
        mainResult.innerHTML = "<span style='color:#ff375f;'>③ BR記録中：画面のボール位置をタップして微調整</span>";
        subResult.innerText = "自動推定位置にマーカーを表示中。ボールをタップすれば位置を修正できます";
    }

    // 体幹前傾角の算出 (BR時)
    if (key === 'br' && shL && shR && hipL && hipR) {
        const pSh = { x: (shL.x + shR.x) * 0.5, y: (shL.y + shR.y) * 0.5 };
        const pHip = { x: (hipL.x + hipR.x) * 0.5, y: (hipL.y + hipR.y) * 0.5 };
        phases.br.tiltAngle = Math.abs(Math.atan2(pSh.x - pHip.x, pHip.y - pSh.y) * (180 / Math.PI));
    }

    updatePhaseBtnStyles();
    recalcPitchMetrics();

    if (key !== 'br') {
        const names = { fc: "① 接地(FC)", mer: "② 最大外旋(MER)", ft: "④ フォロー(FT)" };
        mainResult.innerHTML = `<span style='color:#00ffcc;'>${names[key]} を記録しました</span>`;
    }
}

function recalcPitchMetrics() {
    // 1. 歩幅
    if (phases.fc && phases.fc.stridePx && pxPerCm) {
        document.getElementById('res_stride').innerText = `${(phases.fc.stridePx / pxPerCm).toFixed(1)} cm`;
    } else {
        document.getElementById('res_stride').innerText = "--- cm";
    }

    // 2. 肘屈曲角度
    if (phases.mer && phases.mer.elbowAngle) {
        document.getElementById('res_mer_elbow').innerText = `${phases.mer.elbowAngle.toFixed(1)}°`;
    } else {
        document.getElementById('res_mer_elbow').innerText = "---°";
    }

    // 3. リリース高 & 前方伸長幅（エクステンション）
    if (phases.br && phases.br.wristPos && pxPerCm) {
        const box = getVideoRenderBox();
        const releaseHCm = (box.y + box.h - phases.br.wristPos.y) / pxPerCm;
        document.getElementById('res_release_h').innerText = `${Math.max(0, releaseHCm).toFixed(1)} cm`;

        // 支持脚（前足）からの前方エクステンション
        if (latestLandmarks) {
            const ankL = latestLandmarks[27], ankR = latestLandmarks[28];
            if (ankL && ankR) {
                const leadAnkX = Math.max(box.x + ankL.x * box.w, box.x + ankR.x * box.w);
                const extCm = Math.abs(phases.br.wristPos.x - leadAnkX) / pxPerCm;
                document.getElementById('res_release_ext').innerText = `${extCm.toFixed(1)} cm`;
            }
        }
    } else {
        document.getElementById('res_release_h').innerText = "--- cm";
        document.getElementById('res_release_ext').innerText = "--- cm";
    }

    // 4. 体幹前傾角
    if (phases.br && phases.br.tiltAngle !== undefined) {
        document.getElementById('res_release_tilt').innerText = `${phases.br.tiltAngle.toFixed(1)}°`;
    } else {
        document.getElementById('res_release_tilt').innerText = "---°";
    }
}

function clearPhaseData() {
    phases.fc = phases.mer = phases.br = phases.ft = null;
    maxRecordedXFactor = 0;
    isBrSettingMode = false;
    document.getElementById('res_max_xfactor').innerText = "0.0°";
    document.getElementById('res_stride').innerText = "--- cm";
    document.getElementById('res_mer_elbow').innerText = "---°";
    document.getElementById('res_release_h').innerText = "--- cm";
    document.getElementById('res_release_ext').innerText = "--- cm";
    document.getElementById('res_release_tilt').innerText = "---°";
    updatePhaseBtnStyles();
    mainResult.innerText = "投手バイオメカニクス解析";
    subResult.innerText = "各フェーズを記録してください";
    if (latestLandmarks) drawPitchingBiomechanics(latestLandmarks);
}

async function renderCurrentFrame() {
    if (isProcessing || video.readyState < 2) return;
    isProcessing = true;
    try {
        let inputSource = video;
        if (isRoiEnabled && roiNorm.w > 0.05) {
            const sx = roiNorm.x * video.videoWidth, sy = roiNorm.y * video.videoHeight;
            const sw = roiNorm.w * video.videoWidth, sh = roiNorm.h * video.videoHeight;
            if (sw > 10 && sh > 10) { roiCanvas.width = sw; roiCanvas.height = sh; roiCtx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh); inputSource = roiCanvas; }
        }
        await pose.send({ image: inputSource });
    } catch(e) {} finally { isProcessing = false; }
}

async function loop() {
    if (!video.paused && !video.ended) { 
        await renderCurrentFrame(); 
        updateSeekBar(); 
    }
    
    if (isRecording) {
        recCanvas.width = outputCanvas.width;
        recCanvas.height = outputCanvas.height + 70;
        recCtx.fillStyle = '#000';
        recCtx.fillRect(0, 0, recCanvas.width, recCanvas.height);
        recCtx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);
        recCtx.drawImage(outputCanvas, 0, 0);
        recCtx.drawImage(interactionCanvas, 0, 0);

        recCtx.fillStyle = '#1c1c1e';
        recCtx.fillRect(0, outputCanvas.height, recCanvas.width, 70);
        recCtx.fillStyle = '#00ffcc';
        recCtx.font = 'bold 13px sans-serif';
        recCtx.fillText(`歩幅: ${document.getElementById('res_stride').innerText} ｜ MER肘角: ${document.getElementById('res_mer_elbow').innerText}`, 15, outputCanvas.height + 26);
        recCtx.fillStyle = '#ff375f';
        recCtx.font = 'bold 12px sans-serif';
        recCtx.fillText(`BR高: ${document.getElementById('res_release_h').innerText} ｜ 前方伸長: ${document.getElementById('res_release_ext').innerText}`, 15, outputCanvas.height + 50);
    }

    animationFrameId = requestAnimationFrame(loop);
}

function updateSeekBar() { if (video.duration) seekSlider.value = (video.currentTime / video.duration) * 100; }
seekSlider.addEventListener('input', () => { if (video.duration) { video.pause(); btnPlayPause.innerText = '▶ 再生'; video.currentTime = (seekSlider.value / 100) * video.duration; } });
video.addEventListener('seeked', () => { if (video.paused) { updateSeekBar(); renderCurrentFrame(); } });

btnPlayPause.addEventListener('click', async () => {
    if (video.paused) { 
        try { 
            await video.play(); 
            btnPlayPause.innerText = '⏸ 停止'; 
            btnPlayPause.style.background = '#ff9500'; 
        } catch (e) {} 
    } else { 
        video.pause(); 
        btnPlayPause.innerText = '▶ 再生'; 
        btnPlayPause.style.background = '#34c759'; 
    }
});

btnStepForward.addEventListener('click', () => { video.pause(); btnPlayPause.innerText = '▶ 再生'; btnPlayPause.style.background = '#34c759'; video.currentTime = Math.min(video.duration, video.currentTime + (1 / currentFPS)); });
btnStepBack.addEventListener('click', () => { video.pause(); btnPlayPause.innerText = '▶ 再生'; btnPlayPause.style.background = '#34c759'; video.currentTime = Math.max(0, video.currentTime - (1 / currentFPS)); });

function captureSnapshot() {
    if (!video.videoWidth) { alert("動画が読み込まれていません"); return; }
    const snapCanvas = document.createElement('canvas'), snapCtx = snapCanvas.getContext('2d');
    snapCanvas.width = outputCanvas.width; snapCanvas.height = outputCanvas.height + 70;
    snapCtx.fillStyle = '#000'; snapCtx.fillRect(0, 0, snapCanvas.width, snapCanvas.height);
    snapCtx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);
    snapCtx.drawImage(outputCanvas, 0, 0);
    snapCtx.drawImage(interactionCanvas, 0, 0);
    snapCtx.fillStyle = '#1c1c1e'; snapCtx.fillRect(0, outputCanvas.height, snapCanvas.width, 70);
    snapCtx.fillStyle = '#00ffcc'; snapCtx.font = 'bold 13px sans-serif';
    snapCtx.fillText(`歩幅: ${document.getElementById('res_stride').innerText} ｜ MER肘角: ${document.getElementById('res_mer_elbow').innerText}`, 15, outputCanvas.height + 26);
    snapCtx.fillStyle = '#ff375f'; snapCtx.font = 'bold 12px sans-serif';
    snapCtx.fillText(`BR高: ${document.getElementById('res_release_h').innerText} ｜ 前方伸長: ${document.getElementById('res_release_ext').innerText}`, 15, outputCanvas.height + 50);
    document.getElementById('snapshot-img').src = snapCanvas.toDataURL('image/png'); document.getElementById('snapshot-modal-overlay').style.display = 'flex';
}
function closeSnapshotModal() { document.getElementById('snapshot-modal-overlay').style.display = 'none'; }

function toggleRecording() {
    if (!video.videoWidth) { alert("動画が読み込まれていません"); return; }
    const btn = document.getElementById('btnRecord');
    
    if (!isRecording) {
        recordedChunks = [];
        const stream = recCanvas.captureStream(30);
        let mimeType = 'video/webm;codecs=vp9';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
            mimeType = 'video/webm';
            if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/mp4';
        }
        try { mediaRecorder = new MediaRecorder(stream, { mimeType }); } catch (e) { mediaRecorder = new MediaRecorder(stream); }
        
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.style.display = 'none'; a.href = url;
            a.download = `Pitching_Analysis_${Date.now()}.mp4`;
            document.body.appendChild(a); a.click();
            setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
        };
        
        mediaRecorder.start();
        isRecording = true;
        btn.innerText = "⏹ 録画停止";
        btn.classList.add('rec-active');
        
        if (video.paused) {
            video.play();
            btnPlayPause.innerText = '⏸ 停止';
            btnPlayPause.style.background = '#ff9500';
        }
    } else {
        mediaRecorder.stop();
        isRecording = false;
        btn.innerText = "🎥 録画開始";
        btn.classList.remove('rec-active');
    }
}

document.getElementById('inputFile').addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return;
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
    video.pause(); resetZoom(); clearPhaseData();
    currentBlobUrl = URL.createObjectURL(file); video.src = currentBlobUrl; video.load();
    const onCanPlay = () => { video.removeEventListener('canplay', onCanPlay); fitCanvases(); btnPlayPause.innerText = '▶ 再生'; video.currentTime = 0.001; loop(); };
    video.addEventListener('canplay', onCanPlay); e.target.value = '';
});
