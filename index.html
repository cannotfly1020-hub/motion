<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="apple-touch-icon" href="icon.png.JPG">
<link rel="icon" type="image/jpeg" href="icon.png.JPG">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="動作分析Pro">
<title>動作分析 Pro - ポータル</title>

<style>
 * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
 html, body { 
   width: 100%; 
   height: 100dvh; 
   background: #000; 
   color: #fff; 
   font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
   display: flex; 
   flex-direction: column; 
   justify-content: space-between;
   padding: calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)) 16px;
   overflow: hidden;
 }

 .header-area {
   text-align: center;
   margin-top: 10px;
 }
 .app-badge {
   display: inline-block;
   background: rgba(0, 255, 204, 0.15);
   color: #00ffcc;
   border: 1px solid #00ffcc;
   font-size: 11px;
   font-weight: bold;
   padding: 3px 10px;
   border-radius: 20px;
   margin-bottom: 8px;
 }
 h1 {
   font-size: 24px;
   font-weight: 800;
   letter-spacing: 0.5px;
   background: linear-gradient(135deg, #fff 40%, #aaa 100%);
   -webkit-background-clip: text;
   -webkit-text-fill-color: transparent;
 }
 .subtitle {
   font-size: 12px;
   color: #888;
   margin-top: 4px;
 }

 .menu-grid {
   display: flex;
   flex-direction: column;
   gap: 14px;
   max-width: 420px;
   width: 100%;
   margin: 0 auto;
 }

 .menu-card {
   background: #1c1c1e;
   border: 1px solid #333;
   border-radius: 16px;
   padding: 18px 16px;
   display: flex;
   align-items: center;
   justify-content: space-between;
   text-decoration: none;
   color: #fff;
   box-shadow: 0 4px 20px rgba(0,0,0,0.5);
   transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
 }
 .menu-card:active {
   transform: scale(0.97);
   background: #262629;
 }
 .menu-card.card-rotation {
   border-left: 5px solid #00ffcc;
 }
 .menu-card.card-bio {
   border-left: 5px solid #ffd60a;
 }

 .card-content {
   display: flex;
   flex-direction: column;
   gap: 4px;
 }
 .card-tag {
   font-size: 10px;
   font-weight: bold;
   letter-spacing: 0.5px;
 }
 .tag-rotation { color: #00ffcc; }
 .tag-bio { color: #ffd60a; }

 .card-title {
   font-size: 16px;
   font-weight: bold;
 }
 .card-desc {
   font-size: 11px;
   color: #999;
   line-height: 1.3;
 }

 .card-arrow {
   font-size: 18px;
   color: #555;
   padding-left: 8px;
 }

 .footer-area {
   text-align: center;
   font-size: 10px;
   color: #555;
 }
</style>
</head>
<body>

 <div class="header-area">
   <div class="app-badge">AI MOTION ANALYSIS</div>
   <h1>動作分析 Pro</h1>
   <p class="subtitle">解析対象の動作モジュールを選択してください</p>
 </div>

 <div class="menu-grid">
   <!-- モジュール1: 体幹・捻転差解析 (index2.html) -->
   <a href="index2.html" class="menu-card card-rotation">
     <div class="card-content">
       <span class="card-tag tag-rotation">MODULE 01 ｜ ROTATION & TORSION</span>
       <div class="card-title">⚾️ 体幹傾斜 & 捻転差解析</div>
       <div class="card-desc">胸郭・骨盤の回旋角度（X-Factor）、体幹軸の傾き、手動キーフレーム補正</div>
     </div>
     <div class="card-arrow">❯</div>
   </a>

   <!-- モジュール2: 下肢バイオメカニクス (index3.html) -->
   <a href="index3.html" class="menu-card card-bio">
     <div class="card-content">
       <span class="card-tag tag-bio">MODULE 02 ｜ STS & LOWER LIMBS</span>
       <div class="card-title">🦵 下肢関節モーメント & 床反力</div>
       <div class="card-desc">立ち上がり動作の床反力ベクトル、股・膝・足関節トルク、介助者除外ROI</div>
     </div>
     <div class="card-arrow">❯</div>
   </a>
 </div>

 <div class="footer-area">
   動作分析 Pro v2.0 ｜ Clinical & Sports Biomechanics
 </div>

</body>
</html>
