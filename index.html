# motion
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="動作分析">
<title>動作分析ツール</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
        background: #000; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
    }
    
    #header {
        background: #1c1c1e; padding: 8px 12px;
        display: flex; flex-direction: column; gap: 6px;
        border-bottom: 1px solid #333; z-index: 10;
    }
    .header-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #btn-pick { background: #007aff; color: white; border: none; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 13px; flex-shrink: 0; }
    #scale-info-text { font-size: 12px; color: #ff9500; font-weight: 600; text-align: right; }
    #file-input { display: none; }

    #result-box { background: #262629; border-radius: 8px; padding: 8px 12px; border: 1px solid #3a3a3c; }
    #main-result { color: #00ffcc; font-size: 15px; font-weight: bold; line-height: 1.3; }
    #sub-result { color: #aaa; font-size: 12px; margin-top: 4px; font-weight: 500; line-height: 1.4; }
    .highlight-acc { color: #ff375f; font-weight: bold; }
    .highlight-speed { color: #ffcc00; font-weight: bold; }

    #stage { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
    video { max-width: 100%; max-height: 100%; object-fit: contain; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }

    #controls { background: #1c1c1e; padding: 10px 12px 15px 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #333; }
    .slider-box { display: flex; align-items: center; gap: 10px; }
    input[type=range] { flex: 1; height: 24px; accent-color: #007aff; }
    
    .mode-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    button.ctrl-btn { padding: 9px 0; background: #2c2c2e; color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; }
    button.ctrl-btn:active { background: #444; }
    button.mode-active { background: #30d158; color: black; }
    #btn-mode-acc.mode-active { background: #ff375f; color: white; }
    #btn-mode-scale.mode-active { background: #ff9500; color: black; }
    
    .btn-row { display: flex; gap: 6px; }
    #btn-clear { background: #ff3b30; }

    #scale-modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center;
        z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal-card {
        background: #2c2c2e; border: 1px solid #444; border-radius: 14px; width: 85%; max-width: 320px;
        padding: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-card h3 { font-size: 16px; margin-bottom: 8px; color: #ff9500; }
    .modal-card p { font-size: 13px; color: #ccc; margin-bottom: 15px; }
    .modal-input-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 18px; }
    .modal-input-row input {
        width: 120px; font-size: 18px; padding: 8px; text-align: center;
        border-radius: 8px; border: 1px solid #555; background: #1c1c1e; color: #fff;
        user-select: auto; -webkit-user-select: auto;
    }
    .modal-input-row span { font-size: 16px; font-weight: bold; }
    .modal-btn-row { display: flex; gap: 10px; }
    .modal-btn-row button { flex: 1; padding: 10px 0; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; }
    #btn-modal-cancel { background: #444; color: #fff; }
    #btn-modal-ok { background: #ff9500; color: #000; }
</style>
</head>
<body>

<div id="header">
    <div class="header-top-row">
        <button id="btn-pick" onclick="document.getElementById('file-input').click()">動画選択</button>
        <span id="scale-info-text">スケール: 未設定</span>
        <input type="file" id="file-input" accept="video/*">
    </div>
    <div id="result-box">
        <div id="main-result">動画を選択してください</div>
        <div id="sub-result"></div>
    </div>
</div>

<div id="stage">
    <video id="video" playsinline webkit-playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<div id="controls">
    <div class="slider-box">
        <input type="range" id="seekbar" min="0" max="100" value="0" step="0.001">
    </div>
    <div class="mode-grid">
        <button class="ctrl-btn mode-active" id="btn-mode-angle" onclick="setMode('angle')">角度 (3点)</button>
        <button class="ctrl-btn" id="btn-mode-dist" onclick="setMode('distance')">速度 (2点)</button>
        <button class="ctrl-btn" id="btn-mode-acc" onclick="setMode('accel')">加速度 (3点)</button>
        <button class="ctrl-btn" id="btn-mode-scale" onclick="setMode('scale')">物差し</button>
    </div>
    <div class="btn-row">
        <button class="ctrl-btn" onclick="stepFrame(-1)">◀ -1コマ</button>
        <button class="ctrl-btn" onclick="stepFrame(1)">+1コマ ▶</button>
        <button class="ctrl-btn" id="btn-clear" onclick="clearCurrentPoints()">点クリア</button>
    </div>
</div>

<div id="scale-modal-overlay">
    <div class="modal-card">
        <h3>基準物の長さ設定</h3>
        <p>指定した2点間の実際の長さを入力してください</p>
        <div class="modal-input-row">
            <input type="number" id="scale-input-value" inputmode="decimal" placeholder="100" value="100">
            <span>cm</span>
        </div>
        <div class="modal-btn-row">
            <button id="btn-modal-cancel" onclick="cancelScaleModal()">キャンセル</button>
            <button id="btn-modal-ok" onclick="submitScaleModal()">確定</button>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const seekbar = document.getElementById('seekbar');
    const mainResult = document.getElementById('main-result');
    const subResult = document.getElementById('sub-result');
    const scaleInfoText = document.getElementById('scale-info-text');
    const fileInput = document.getElementById('file-input');

    const btnModeAngle = document.getElementById('btn-mode-angle');
    const btnModeDist = document.getElementById('btn-mode-dist');
    const btnModeAcc = document.getElementById('btn-mode-acc');
    const btnModeScale = document.getElementById('btn-mode-scale');
    const scaleModalOverlay = document.getElementById('scale-modal-overlay');
    const scaleInputValue = document.getElementById('scale-input-value');

    let points = [];
    let scalePoints = [];
    let pxPerCm = null;
    let currentMode = 'angle';
    let tempDistPx = 0;
    const FPS = 30.0;

    function fitCanvas() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        redraw();
    }
    window.addEventListener('resize', fitCanvas);

    function setMode(mode) {
        currentMode = mode;
        points = [];
        [btnModeAngle, btnModeDist, btnModeAcc, btnModeScale].forEach(b => b.classList.remove('mode-active'));

        if (mode === 'angle') {
            btnModeAngle.classList.add('mode-active');
            mainResult.innerText = "角度モード: 3点をタップ";
            subResult.innerHTML = "1点目と3点目を結ぶ、2点目を中心とした角度";
        } else if (mode === 'distance') {
            btnModeDist.classList.add('mode-active');
            mainResult.innerText = "距離・速度モード: 始点→終点をタップ";
            subResult.innerHTML = "1点目タップ後、コマ送りして2点目をタップ";
        } else if (mode === 'accel') {
            btnModeAcc.classList.add('mode-active');
            mainResult.innerText = "加速度モード: 3点をタップ (始点→中間→終点)";
            subResult.innerHTML = "各点でコマ送りしながら連続する3点をタップ";
        } else if (mode === 'scale') {
            btnModeScale.classList.add('mode-active');
            scalePoints = [];
            mainResult.innerText = "物差し設定: 基準物の両端（2点）をタップ";
            subResult.innerHTML = "既知の長さ(バットや身長など)の端を2箇所タップ";
        }
        redraw();
    }

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            video.src = URL.createObjectURL(file);
            video.load();
            setMode(currentMode);
        }
    });

    video.addEventListener('loadedmetadata', function() {
        fitCanvas();
        seekbar.max = video.duration;
        seekbar.value = 0;
    });

    video.addEventListener('timeupdate', function() {
        if (!seeking) seekbar.value = video.currentTime;
    });

    let seeking = false;
    seekbar.addEventListener('input', function() {
        seeking = true;
        video.currentTime = seekbar.value;
    });
    seekbar.addEventListener('change', function() {
        seeking = false;
    });

    function stepFrame(dir) {
        if (video.duration) {
            video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + (dir / FPS)));
        }
    }

    function clearCurrentPoints() {
        points = [];
        setMode(currentMode);
    }

    function formatDistance(px) {
        if (!pxPerCm) return `${px.toFixed(1)} px`;
        const cm = px / pxPerCm;
        if (cm >= 100) return `${(cm / 100).toFixed(2)} m (${cm.toFixed(1)} cm)`;
        return `${cm.toFixed(1)} cm`;
    }

    function formatDelta(px) {
        if (!pxPerCm) return `${px > 0 ? '+' : ''}${px.toFixed(1)}px`;
        const cm = px / pxPerCm;
        return `${cm > 0 ? '+' : ''}${cm.toFixed(1)} cm`;
    }

    canvas.addEventListener('pointerdown', function(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const currentTime = video.currentTime;

        if (currentMode === 'scale') {
            scalePoints.push({x, y});
            if (scalePoints.length === 2) {
                const p1 = scalePoints[0];
                const p2 = scalePoints[1];
                tempDistPx = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                scaleModalOverlay.style.display = 'flex';
                scaleInputValue.focus();
                scaleInputValue.select();
            } else {
                mainResult.innerText = "物差し設定: 2点目をタップ";
                subResult.innerHTML = "基準物のもう片方の端をタップしてください";
            }
            redraw();
            return;
        }

        const maxPoints = currentMode === 'distance' ? 2 : 3;
        if (points.length >= maxPoints) points = [];
        points.push({x, y, time: currentTime});

        if (currentMode === 'angle') {
            if (points.length === 3) {
                const p1 = points[0], p2 = points[1], p3 = points[2];
                const v1 = {x: p1.x - p2.x, y: p1.y - p2.y};
                const v2 = {x: p3.x - p2.x, y: p3.y - p2.y};
                const dot = v1.x * v2.x + v1.y * v2.y;
                const mag1 = Math.hypot(v1.x, v1.y), mag2 = Math.hypot(v2.x, v2.y);

                if (mag1 * mag2 !== 0) {
                    let cosVal = Math.max(-1.0, Math.min(1.0, dot / (mag1 * mag2)));
                    let angle = Math.acos(cosVal) * (180 / Math.PI);
                    mainResult.innerText = `関節角度: ${angle.toFixed(1)}°`;
                    subResult.innerHTML = `頂点(2点目)を中心とした角度`;
                }
            } else {
                mainResult.innerText = `点 ${points.length}/3 をタップ中`;
                subResult.innerHTML = points.length === 1 ? "2点目（関節の頂点）をタップ" : "3点目をタップ";
            }
        } else if (currentMode === 'distance') {
            if (points.length === 2) {
                const p1 = points[0], p2 = points[1];
                const dx = p2.x - p1.x, dy = -(p2.y - p1.y);
                const dist = Math.hypot(dx, dy);
                const dt = Math.abs(p2.time - p1.time);

                mainResult.innerText = `移動距離: ${formatDistance(dist)}`;
                let speedText = "";
                if (dt > 0) {
                    if (pxPerCm) {
                        const distM = (dist / pxPerCm) / 100;
                        const speedMS = distM / dt;
                        const speedKMH = speedMS * 3.6;
                        speedText = `<span class="highlight-speed">速度: ${speedMS.toFixed(2)} m/s (${speedKMH.toFixed(1)} km/h)</span>`;
                    } else {
                        const speedPx = dist / dt;
                        speedText = `<span class="highlight-speed">速度: ${speedPx.toFixed(1)} px/s</span>`;
                    }
                } else {
                    speedText = `<span class="highlight-speed">速度: 測定不能(時間差0秒)</span>`;
                }
                subResult.innerHTML = `水平(dX): ${formatDelta(dx)} | 垂直(dY): ${formatDelta(dy)}<br>時間差: ${dt.toFixed(3)}秒 | ${speedText}`;
            } else {
                mainResult.innerText = "始点を記録しました";
                subResult.innerHTML = "コマ送りボタンで動画を進め、移動先(終点)をタップ";
            }
        } else if (currentMode === 'accel') {
            if (points.length === 1) {
                mainResult.innerText = "点1(始点)を記録しました";
                subResult.innerHTML = "コマ送りして「中間点(点2)」をタップしてください";
            } else if (points.length === 2) {
                mainResult.innerText = "点2(中間)を記録しました";
                subResult.innerHTML = "さらにコマ送りして「終点(点3)」をタップしてください";
            } else if (points.length === 3) {
                const p1 = points[0], p2 = points[1], p3 = points[2];
                const dt1 = Math.abs(p2.time - p1.time), dt2 = Math.abs(p3.time - p2.time);
                const totalDt = dt1 + dt2;
                const dist1 = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                const dist2 = Math.hypot(p3.x - p2.x, p3.y - p2.y);

                if (dt1 > 0 && dt2 > 0 && pxPerCm) {
                    const dist1M = (dist1 / pxPerCm) / 100, dist2M = (dist2 / pxPerCm) / 100;
                    const v1 = dist1M / dt1, v2 = dist2M / dt2;
                    const dv = v2 - v1;
                    const avgDt = (dt1 + dt2) / 2;
                    const accel = dv / avgDt;
                    const gForce = accel / 9.80665;

                    mainResult.innerHTML = `<span class="highlight-acc">加速度: ${accel > 0 ? '+' : ''}${accel.toFixed(2)} m/s² (${gForce > 0 ? '+' : ''}${gForce.toFixed(2)} G)</span>`;
                    subResult.innerHTML = `区間①: ${(v1 * 3.6).toFixed(1)} km/h → 区間②: ${(v2 * 3.6).toFixed(1)} km/h<br>速度差: ${(dv * 3.6 > 0 ? '+' : '')}${(dv * 3.6).toFixed(1)} km/h (経過時間: ${totalDt.toFixed(3)}s)`;
                } else if (!pxPerCm) {
                    mainResult.innerText = "物差しが未設定です";
                    subResult.innerHTML = "加速度の算出には「物差し」による実寸設定が必要です";
                } else {
                    mainResult.innerText = "測定不能";
                    subResult.innerHTML = "各点の間でコマ送りして時間を進めてください";
                }
            }
        }
        redraw();
    });

    function submitScaleModal() {
        const realCm = parseFloat(scaleInputValue.value);
        if (realCm && realCm > 0) {
            pxPerCm = tempDistPx / realCm;
            scaleInfoText.innerText = `基準: ${realCm}cm (${pxPerCm.toFixed(1)}px/cm)`;
            scaleModalOverlay.style.display = 'none';
            setMode('distance');
            mainResult.innerText = "スケール設定完了！";
            subResult.innerHTML = "始点をタップしてください";
        } else {
            alert("有効な数値を入力してください");
        }
    }

    function cancelScaleModal() {
        scalePoints = [];
        scaleModalOverlay.style.display = 'none';
        setMode('scale');
        mainResult.innerText = "スケール設定をキャンセルしました";
        subResult.innerHTML = "再度設定する場合は2点をタップしてください";
        redraw();
    }

    function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (scalePoints.length === 2 && currentMode !== 'scale') {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 149, 0, 0.5)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(scalePoints[0].x, scalePoints[0].y);
            ctx.lineTo(scalePoints[1].x, scalePoints[1].y);
            ctx.stroke();
            ctx.restore();
        }

        if (currentMode === 'scale') {
            ctx.strokeStyle = '#ff9500'; ctx.fillStyle = '#ff9500'; ctx.lineWidth = 3;
            drawPointList(scalePoints, "基準");
            return;
        }

        if (points.length === 0) return;

        if (currentMode === 'angle') ctx.strokeStyle = ctx.fillStyle = '#00ffcc';
        else if (currentMode === 'distance') ctx.strokeStyle = ctx.fillStyle = '#ffcc00';
        else if (currentMode === 'accel') ctx.strokeStyle = ctx.fillStyle = '#ff375f';
        ctx.lineWidth = 3;

        let labels = null;
        if (currentMode === 'distance') labels = ["始点", "終点"];
        if (currentMode === 'accel') labels = ["点1(始)", "点2(中)", "点3(終)"];
        drawPointList(points, labels);
    }

    function drawPointList(ptList, labels) {
        if (ptList.length === 0) return;
        ctx.beginPath();
        for (let i = 0; i < ptList.length; i++) {
            if (i === 0) ctx.moveTo(ptList[i].x, ptList[i].y);
            else ctx.lineTo(ptList[i].x, ptList[i].y);
        }
        ctx.stroke();

        for (let i = 0; i < ptList.length; i++) {
            ctx.beginPath();
            ctx.arc(ptList[i].x, ptList[i].y, 6, 0, Math.PI * 2);
            ctx.fill();

            if (labels) {
                const text = Array.isArray(labels) ? labels[i] : `${labels}${i + 1}`;
                if (text) {
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif';
                    ctx.fillText(text, ptList[i].x + 8, ptList[i].y - 6);
                    ctx.fillStyle = ctx.strokeStyle;
                }
            }
        }
    }
</script>
</body>
</html>
