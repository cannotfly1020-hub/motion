<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="動作分析Pro">
<title>連続ジャンプ・リバウンド解析 - 動作分析Pro</title>

<!-- MediaPipe Pose -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100dvh; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
    
    #header { width: 100%; background: #1c1c1e; padding-top: calc(6px + env(safe-area-inset-top)); padding-left: calc(8px + env(safe-area-inset-left)); padding-right: calc(8px + env(safe-area-inset-right)); padding-bottom: 6px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #333; z-index: 30; flex-shrink: 0; }
    .header-top-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
    .btn-group-header { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
    
    .hdr-btn { -webkit-appearance: none; appearance: none; background: #007aff; color: white; border: none; padding: 5px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .hdr-btn.secondary { background: #3a3a3c; }
    .hdr-btn.fps-badge { background: #30d158; color: #000; font-size: 10px; }
    .hdr-btn.roi-active { background: #ff9500 !important; color: #000 !important; font-weight: bold; }
    
    #result-box { width: 100%; background: #262629; border-radius: 6px; padding: 5px 8px; border: 1px solid #3a3a3c; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .result-text-area { flex: 1; min-width: 0; }
    #main-result { color: #00ffcc; font-size: 12px; font-weight: bold; line-height: 1.2; }
    #sub-result { color: #aaa; font-size: 10px; margin-top: 2px; font-weight: 500; line-height: 1.2; }
    #scale-info-text { font-size: 10px; color: #ff9500; font-weight: 600; white-space: nowrap; }

    #stage { width: 100%; position: relative; flex: 1; min-height: 0; display: flex; background: #000; overflow: hidden; }
    .video-pane { position: relative; flex: 1; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .zoom-target { width: 100%; height: 100%; position: relative; transform-origin: center center; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #outputCanvas { z-index: 1; pointer-events: none; }
    #interactionCanvas { z-index: 10; touch-action: none; cursor: crosshair; }

    #controls { width: 100%; background: #1c1c1e; padding-top: 5px; padding-left: calc(8px + env(safe-area-inset-left)); padding-right: calc(8px + env(safe-area-inset-right)); padding-bottom: calc(6px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 5px; border-top: 1px solid #333; z-index: 30; flex-shrink: 0; }
    
    .seek-row { display: flex; align-items: center; gap: 6px; width: 100%; }
    .seek-label { font-size: 10px; font-weight: bold; color: #007aff; width: 14px; flex-shrink: 0; text-align: center; }
    input[type=range] { flex: 1; height: 18px; accent-color: #007aff; }

    /* 連続ジャンプ用ステップボタン */
    .jump-actions-container { display: flex; flex-direction: column; gap: 3px; width: 100%; }
    .jump-actions-row { display: grid; grid-template-columns: 0.7fr repeat(3, 1fr); gap: 3px; align-items: center; }
    .row-label { font-size: 10px; font-weight: bold; text-align: center; color: #aaa; }
    
    .jump-btn { background: #2c2c2e; color: #888; border: 1.5px solid #444; padding: 6px 0; border-radius: 6px; font-size: 11px; font-weight: bold; text-align: center; cursor: pointer; transition: all 0.2s; }
    .jump-btn.active-takeoff { background: #ff375f; color: #fff; border-color: #ff375f; }
    .jump-btn.active-peak { background: #007aff; color: #fff; border-color: #007aff; }
    .jump-btn.active-landing { background: #30d158; color: #000; border-color: #30d158; }

    .mode-grid { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    button.ctrl-btn { -webkit-appearance: none; appearance: none; width: 100%; padding: 6px 0; background: #2c2c2e; color: white; border: none; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; }
    button.ctrl-btn:active { background: #444; }
    button.mode-active { background: #ff9500; color: #000; font-weight: bold; }
    button.mode-floor-active { background: #00ffcc; color: #000; font-weight: bold; }
    #btnModeZoom.mode-active { background: #007aff; color: #fff; }

    /* 1回目と2回目の比較ダッシュボード */
    .dashboard-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .side-box { background: #262629; border-radius: 6px; padding: 4px 5px; border: 1px solid #3a3a3c; }
    .side-box.j1 { border-top: 2.5px solid #00ffcc; }
    .side-box.j2 { border-top: 2.5px solid #ffd60a; }
    .side-box.rj { border-top: 2.5px solid #ff375f; }
    .side-title { font-size: 9.5pt; font-weight: bold; text-align: center; margin-bottom: 2px; }
    .metric-row { display: flex; justify-content: space-between; font-size: 9pt; padding: 1px 0; color: #ccc; }
    .metric-val { font-weight: bold; font-family: monospace; color: #fff; }
    .highlight-val { color: #00ffcc !important; }

    .playback-row { width: 100%; display: grid; grid-template-columns: 1fr 1.3fr 1fr 0.9fr 1fr; gap: 4px; }
    #btnPlayPause { background: #34c759; color: #000; font-weight: bold; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
    .modal-card { background: #2c2c2e; border: 1px solid #444; border-radius: 12px; width: 90%; max-width: 340px; padding: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    .modal-card h3 { font-size: 15px; margin-bottom: 6px; color: #ff9500; }
    .modal-card p { font-size: 12px; color: #ccc; margin-bottom: 12px; }
    .modal-input-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 14px; }
    .modal-input-row input { width: 100px; font-size: 16px; padding: 6px; text-align: center; border-radius: 6px; border: 1px solid #555; background: #1c1c1e; color: #fff; }
    .modal-btn-row { display: flex; gap: 8px; }
    .modal-btn-row button { flex: 1; padding: 8px 0; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; }
    #snapshot-img { max-width: 100%; max-height: 50vh; border-radius: 6px; border: 1px solid #555; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="header">
    <div class="header-top-row">
        <div class="btn-group-header">
            <button class="hdr-btn" onclick="document.getElementById('inputFile').click()">動画選択</button>
            <input type="file" id="inputFile" accept="video/*" style="display:none;">
            <button class="hdr-btn fps-badge" id="btnFps" onclick="toggleFPS()">60fps</button>
            <button class="hdr-btn secondary" id="btnToggleRoi" onclick="toggleRoiMode()">🔲 対象者指定</button>
            <button class="hdr-btn" style="background:#5856d6;" onclick="captureSnapshot()">📸 静止画</button>
        </div>
        <span id="scale-info-text">物差し: 未設定</span>
    </div>
    <div id="result-box">
        <div class="result-text-area">
            <div id="main-result">連続ジャンプ・リバウンド解析</div>
            <div id="sub-result">1回目と2回目の「離地」「頂点」「着地」をコマ送りで記録してください</div>
        </div>
    </div>
</div>

<div id="stage">
    <div class="video-pane" id="viewportArea">
        <div class="zoom-target" id="zoomTarget">
            <video id="videoElement" playsinline webkit-playsinline muted preload="auto" crossorigin="anonymous"></video>
            <canvas id="outputCanvas"></canvas>
            <canvas id="interactionCanvas"></canvas>
        </div>
    </div>
</div>

<div id="controls">
    <div class="seek-row">
        <span class="seek-label">①</span>
        <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.05">
    </div>

    <!-- 1回目＆2回目 記録ボタン群 -->
    <div class="jump-actions-container">
        <!-- 1回目 -->
        <div class="jump-actions-row">
            <span class="row-label" style="color:#00ffcc;">1回目</span>
            <button class="jump-btn" id="btnJ1Takeoff" onclick="markJumpPhase('j1_takeoff')">🛫 離地</button>
            <button class="jump-btn" id="btnJ1Peak" onclick="markJumpPhase('j1_peak')">⛰️ 頂点</button>
            <button class="jump-btn" id="btnJ1Landing" onclick="markJumpPhase('j1_landing')">🛬 着地(接地)</button>
        </div>
        <!-- 2回目 -->
        <div class="jump-actions-row">
            <span class="row-label" style="color:#ffd60a;">2回目</span>
            <button class="jump-btn" id="btnJ2Takeoff" onclick="markJumpPhase('j2_takeoff')">🛫 離地(再跳躍)</button>
            <button class="jump-btn" id="btnJ2Peak" onclick="markJumpPhase('j2_peak')">⛰️ 頂点</button>
            <button class="jump-btn" id="btnJ2Landing" onclick="markJumpPhase('j2_landing')">🛬 着地</button>
        </div>
    </div>

    <div class="mode-grid">
        <button class="ctrl-btn" id="btnModeScale" onclick="toggleScaleMode()">📏 物差し</button>
        <button class="ctrl-btn" id="btnModeFloor" onclick="toggleFloorMode()">🟦 地面</button>
        <button class="ctrl-btn" id="btnModeZoom" onclick="toggleZoomMode()">🔍 ズーム</button>
        <button class="ctrl-btn" onclick="resetZoom()">1x 表示</button>
    </div>

    <div id="zoom-controls" style="display:none; width:100%; align-items:center; gap:8px;">
        <span style="font-size:11px; font-weight:bold; color:#007aff;">倍率</span>
        <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1">
    </div>

    <!-- 3列比較ダッシュボード -->
    <div class="dashboard-grid">
        <div class="side-box j1">
            <div class="side-title" style="color:#00ffcc;">1回目ジャンプ</div>
            <div class="metric-row"><span>高さ:</span><span id="res_j1_h" class="metric-val highlight-val">--- cm</span></div>
            <div class="metric-row"><span>滞空:</span><span id="res_j1_t" class="metric-val">--- s</span></div>
        </div>
        <div class="side-box j2">
            <div class="side-title" style="color:#ffd60a;">2回目ジャンプ</div>
            <div class="metric-row"><span>高さ:</span><span id="res_j2_h" class="metric-val" style="color:#ffd60a;">--- cm</span></div>
            <div class="metric-row"><span>滞空:</span><span id="res_j2_t" class="metric-val">--- s</span></div>
        </div>
        <div class="side-box rj">
            <div class="side-title" style="color:#ff375f;">🔄 バネ能力(RJ)</div>
            <div class="metric-row"><span>接地時間:</span><span id="res_contact_t" class="metric-val" style="color:#ff9500;">--- s</span></div>
            <div class="metric-row"><span>RSI(バネ):</span><span id="res_rsi" class="metric-val" style="color:#ff375f;">---</span></div>
        </div>
    </div>

    <div class="playback-row">
        <button class="ctrl-btn" id="btnStepBack">◀ -1</button>
        <button class="ctrl-btn" id="btnPlayPause">▶ 再生</button>
        <button class="ctrl-btn" id="btnStepForward">+1 ▶</button>
        <button class="ctrl-btn" id="btnSpeed" onclick="togglePlaybackRate()">1.0x</button>
        <button class="ctrl-btn" style="background:#555;" onclick="fitCanvases()">🔄 更新</button>
    </div>
</div>

<!-- Scale Modal -->
<div id="scale-modal-overlay" class="modal-overlay">
    <div class="modal-card">
        <h3>物差しの長さ設定</h3>
        <p>指定した2点間の実際の長さを入力</p>
        <div class="modal-input-row">
            <input type="number" id="scale-input-value" inputmode="decimal" placeholder="100" value="100">
            <span style="font-weight:bold; font-size:15px;">cm</span>
        </div>
        <div class="modal-btn-row">
            <button style="background:#444; color:#fff;" onclick="closeScaleModal(true)">キャンセル</button>
            <button style="background:#ff9500; color:#000;" onclick="submitScaleModal()">確定</button>
        </div>
    </div>
</div>

<!-- Snapshot Modal -->
<div id="snapshot-modal-overlay" class="modal-overlay">
    <div class="modal-card" style="max-width:360px;">
        <h3 style="color:#5856d6;">📸 連続ジャンプ解析キャプチャ</h3>
        <p style="font-size:11px; color:#aaa;">画像を長押しして「写真に追加」で保存できます</p>
        <img id="snapshot-img" src="" alt="Screenshot">
        <div class="modal-btn-row">
            <button style="background:#444; color:#fff;" onclick="closeSnapshotModal()">閉じる</button>
        </div>
    </div>
</div>

<script>
const video = document.getElementById('videoElement');
const outputCanvas = document.getElementById('outputCanvas');
const outCtx = outputCanvas.getContext('2d');
const interactionCanvas = document.getElementById('interactionCanvas');
const intCtx = interactionCanvas.getContext('2d');
const zoomTarget = document.getElementById('zoomTarget');
const seekSlider = document.getElementById('seekSlider');
const btnPlayPause = document.getElementById('btnPlayPause');
const mainResult = document.getElementById('main-result');
const subResult = document.getElementById('sub-result');

let currentFPS = 60.0;
const fpsList = [30, 60, 120, 240];
let fpsIdx = 1;
const playbackRates = [1.0, 0.5, 0.25];
let currentRateIdx = 0;

let isProcessing = false;
let animationFrameId = null;
let currentBlobUrl = null;

// Scale, Floor & Zoom
let pxPerCm = null;
let isZoomMode = false;
let isScaleMode = false;
let isFloorMode = false;
let isFloorDragging = false;
let userFloorY = null;
let scalePoints = [];
let zoomScale = 1.0;
let panOffsetX = 0, panOffsetY = 0;
let isPanning = false;

// ROI
let isRoiMode = false;
let isRoiDrawing = false;
let isRoiEnabled = false;
let roiStart = { x: 0, y: 0 };
let roiNorm = { x: 0.2, y: 0.1, w: 0.6, h: 0.8 };
const roiCanvas = document.createElement('canvas');
const roiCtx = roiCanvas.getContext('2d');

// Jump Data (1回目 & 2回目)
const jumps = {
    j1: { takeoff: null, peak: null, landing: null },
    j2: { takeoff: null, peak: null, landing: null }
};

let currentLandmarks = null;
let currentCoM = null;
let currentFeetCenter = null;

const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
pose.onResults(onResults);

function fitCanvases() {
    const rect = video.parentElement.getBoundingClientRect();
    if (rect.width > 0 && rect.height > 0) {
        [outputCanvas, interactionCanvas].forEach(c => { c.width = rect.width; c.height = rect.height; });
    }
    redrawOverlay();
    redrawJumpVisuals();
}
window.addEventListener('resize', fitCanvases);

function toggleFPS() {
    fpsIdx = (fpsIdx + 1) % fpsList.length;
    currentFPS = fpsList[fpsIdx];
    document.getElementById('btnFps').innerText = `${currentFPS}fps`;
    calculateMetrics();
}

function togglePlaybackRate() {
    currentRateIdx = (currentRateIdx + 1) % playbackRates.length;
    video.playbackRate = playbackRates[currentRateIdx];
    document.getElementById('btnSpeed').innerText = `${video.playbackRate}x`;
}

function toggleZoomMode() {
    isZoomMode = !isZoomMode;
    const btn = document.getElementById('btnModeZoom');
    const controls = document.getElementById('zoom-controls');
    if (isZoomMode) {
        isScaleMode = isRoiMode = isFloorMode = false;
        btn.classList.add('mode-active');
        controls.style.display = 'flex';
    } else {
        btn.classList.remove('mode-active');
        controls.style.display = 'none';
    }
    updateButtons();
}

function applyZoom() { zoomTarget.style.transform = `translate(${panOffsetX}px, ${panOffsetY}px) scale(${zoomScale})`; }
function resetZoom() { zoomScale = 1.0; panOffsetX = 0; panOffsetY = 0; document.getElementById('zoom-slider').value = 1.0; applyZoom(); }
document.getElementById('zoom-slider').addEventListener('input', (e) => { zoomScale = parseFloat(e.target.value); applyZoom(); });

function toggleScaleMode() {
    isScaleMode = !isScaleMode;
    if (isScaleMode) {
        isZoomMode = isRoiMode = isFloorMode = false;
        scalePoints = [];
        mainResult.innerText = "📏 物差し：基準の長さを2点タップ";
        subResult.innerText = "動画内で長さが分かるものの両端をタップしてください";
    } else {
        mainResult.innerText = "連続ジャンプ・リバウンド解析";
    }
    updateButtons();
    redrawOverlay();
}

function toggleFloorMode() {
    isFloorMode = !isFloorMode;
    if (isFloorMode) {
        isZoomMode = isRoiMode = isScaleMode = false;
        mainResult.innerHTML = "<span style='color:#00ffcc;'>🟦 地面ライン設定 (ドラッグ可能)</span>";
        subResult.innerText = "ラインを上下にドラッグして地面に合わせ、「🟦 地面」を再タップで確定";
    } else {
        mainResult.innerText = "連続ジャンプ・リバウンド解析";
    }
    updateButtons();
    redrawOverlay();
}

function toggleRoiMode() {
    isRoiMode = !isRoiMode;
    if (isRoiMode) {
        isZoomMode = isScaleMode = isFloorMode = false;
        mainResult.innerText = "🔲 対象者を画面ドラッグで囲んでください";
    } else {
        mainResult.innerText = "連続ジャンプ・リバウンド解析";
    }
    updateButtons();
    redrawOverlay();
}

function updateButtons() {
    document.getElementById('btnModeZoom').classList.toggle('mode-active', isZoomMode);
    document.getElementById('btnModeScale').classList.toggle('mode-active', isScaleMode);
    document.getElementById('btnModeFloor').classList.toggle('mode-floor-active', isFloorMode);
    document.getElementById('btnToggleRoi').classList.toggle('roi-active', isRoiMode);
}

function getPointerNorm(e) {
    const rect = interactionCanvas.getBoundingClientRect();
    const clickRelX = e.clientX - (rect.left + rect.width / 2), clickRelY = e.clientY - (rect.top + rect.height / 2);
    const cvsX = (clickRelX - panOffsetX) / zoomScale + interactionCanvas.width / 2;
    const cvsY = (clickRelY - panOffsetY) / zoomScale + interactionCanvas.height / 2;
    return { x: Math.max(0, Math.min(1.0, cvsX / interactionCanvas.width)), y: Math.max(0, Math.min(1.0, cvsY / interactionCanvas.height)) };
}

interactionCanvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (isFloorMode) {
        const p = getPointerNorm(e);
        userFloorY = p.y;
        isFloorDragging = true;
        try { interactionCanvas.setPointerCapture(e.pointerId); } catch(err){}
        redrawOverlay();
        return;
    }
    if (isRoiMode) {
        isRoiDrawing = true; roiStart = getPointerNorm(e); roiNorm = { x: roiStart.x, y: roiStart.y, w: 0, h: 0 };
        isRoiEnabled = true; try { interactionCanvas.setPointerCapture(e.pointerId); } catch(err){} return;
    }
    if (isScaleMode) {
        const p = getPointerNorm(e);
        scalePoints.push({ x: p.x * interactionCanvas.width, y: p.y * interactionCanvas.height });
        if (scalePoints.length === 2) {
            document.getElementById('scale-modal-overlay').style.display = 'flex';
            document.getElementById('scale-input-value').focus();
        }
        redrawOverlay(); return;
    }
    if (isZoomMode || zoomScale > 1.0) {
        isPanning = true; panStartX = e.clientX - panOffsetX; panStartY = e.clientY - panOffsetY;
        try { interactionCanvas.setPointerCapture(e.pointerId); } catch(err){}
    }
});

interactionCanvas.addEventListener('pointermove', (e) => {
    if (isFloorMode && isFloorDragging) {
        const p = getPointerNorm(e);
        userFloorY = p.y;
        redrawOverlay();
        return;
    }
    if (isRoiDrawing && isRoiMode) {
        const p = getPointerNorm(e);
        roiNorm.x = Math.min(roiStart.x, p.x); roiNorm.y = Math.min(roiStart.y, p.y);
        roiNorm.w = Math.abs(p.x - roiStart.x); roiNorm.h = Math.abs(p.y - roiStart.y);
        redrawOverlay(); return;
    }
    if (isPanning) { panOffsetX = e.clientX - panStartX; panOffsetY = e.clientY - panStartY; applyZoom(); }
});

interactionCanvas.addEventListener('pointerup', (e) => {
    if (isFloorMode && isFloorDragging) {
        isFloorDragging = false;
        try { interactionCanvas.releasePointerCapture(e.pointerId); } catch(err){}
        mainResult.innerHTML = "<span style='color:#30d158;'>✅ 地面ライン調整完了</span>";
        subResult.innerText = "位置が決まったら「🟦 地面」ボタンを押して確定してください";
        return;
    }
    if (isRoiDrawing) { isRoiDrawing = false; try { interactionCanvas.releasePointerCapture(e.pointerId); } catch(err){} toggleRoiMode(); renderCurrentFrame(); }
    if (isPanning) { isPanning = false; try { interactionCanvas.releasePointerCapture(e.pointerId); } catch(err){} }
});

function closeScaleModal(isCancel = true) {
    document.getElementById('scale-modal-overlay').style.display = 'none';
    if (isCancel) scalePoints = [];
    isScaleMode = false;
    updateButtons();
    redrawOverlay();
}

function submitScaleModal() {
    const realCm = parseFloat(document.getElementById('scale-input-value').value);
    if (realCm && realCm > 0) {
        const distPx = Math.hypot(scalePoints[1].x - scalePoints[0].x, scalePoints[1].y - scalePoints[0].y);
        pxPerCm = distPx / realCm;
        document.getElementById('scale-info-text').innerText = `物差し: ${(pxPerCm).toFixed(1)}px/cm`;
        closeScaleModal(false); 

        mainResult.innerHTML = "<span style='color:#30d158;'>✅ 物差し設定完了</span>";
        subResult.innerText = "コマ送り（<-1, +1>）で1回目と2回目のジャンプを記録してください";
        calculateMetrics();
    } else {
        alert("有効な数値を入力してください");
    }
}

function redrawOverlay() {
    intCtx.clearRect(0, 0, interactionCanvas.width, interactionCanvas.height);
    
    if (userFloorY !== null) {
        const fy = userFloorY * interactionCanvas.height;
        intCtx.save();
        intCtx.strokeStyle = isFloorMode ? '#00ffcc' : 'rgba(0, 255, 204, 0.7)';
        intCtx.lineWidth = (isFloorMode ? 3.5 : 2.5) / zoomScale;
        intCtx.setLineDash(isFloorMode ? [] : [6 / zoomScale, 4 / zoomScale]);
        intCtx.beginPath();
        intCtx.moveTo(0, fy);
        intCtx.lineTo(interactionCanvas.width, fy);
        intCtx.stroke();
        
        if (isFloorMode) {
            intCtx.fillStyle = '#00ffcc';
            intCtx.beginPath();
            intCtx.arc(interactionCanvas.width / 2, fy, 8 / zoomScale, 0, Math.PI * 2);
            intCtx.fill();
        }
        
        intCtx.fillStyle = '#00ffcc';
        intCtx.font = `bold ${Math.max(10, 11/zoomScale)}px sans-serif`;
        intCtx.fillText(isFloorMode ? "↕️ 地面ライン (ドラッグして移動)" : "🟦 地面基準ライン", 10/zoomScale, fy - 8/zoomScale);
        intCtx.restore();
    }

    if (isRoiEnabled && roiNorm.w > 0.05) {
        const rx = roiNorm.x * interactionCanvas.width, ry = roiNorm.y * interactionCanvas.height;
        const rw = roiNorm.w * interactionCanvas.width, rh = roiNorm.h * interactionCanvas.height;
        intCtx.save();
        intCtx.fillStyle = 'rgba(0, 0, 0, 0.35)'; intCtx.fillRect(0, 0, interactionCanvas.width, interactionCanvas.height);
        intCtx.clearRect(rx, ry, rw, rh);
        intCtx.strokeStyle = '#ff9500'; intCtx.lineWidth = 2.5 / zoomScale; intCtx.setLineDash([6 / zoomScale, 4 / zoomScale]);
        intCtx.strokeRect(rx, ry, rw, rh);
        intCtx.restore();
    }

    if (scalePoints.length > 0) {
        intCtx.save();
        intCtx.fillStyle = '#ff9500';
        intCtx.strokeStyle = isScaleMode ? '#ff9500' : 'rgba(255, 149, 0, 0.4)';
        intCtx.lineWidth = 3 / zoomScale;
        if (!isScaleMode) intCtx.setLineDash([4/zoomScale, 4/zoomScale]);
        
        intCtx.beginPath();
        intCtx.arc(scalePoints[0].x, scalePoints[0].y, 6 / zoomScale, 0, Math.PI*2);
        intCtx.fill();
        if (scalePoints.length === 2) {
            intCtx.beginPath();
            intCtx.arc(scalePoints[1].x, scalePoints[1].y, 6 / zoomScale, 0, Math.PI*2);
            intCtx.fill();
            intCtx.beginPath();
            intCtx.moveTo(scalePoints[0].x, scalePoints[0].y);
            intCtx.lineTo(scalePoints[1].x, scalePoints[1].y);
            intCtx.stroke();
        }
        intCtx.restore();
    }
}

function updateJumpBtnStyles() {
    document.getElementById('btnJ1Takeoff').className = `jump-btn ${jumps.j1.takeoff ? 'active-takeoff' : ''}`;
    document.getElementById('btnJ1Peak').className = `jump-btn ${jumps.j1.peak ? 'active-peak' : ''}`;
    document.getElementById('btnJ1Landing').className = `jump-btn ${jumps.j1.landing ? 'active-landing' : ''}`;

    document.getElementById('btnJ2Takeoff').className = `jump-btn ${jumps.j2.takeoff ? 'active-takeoff' : ''}`;
    document.getElementById('btnJ2Peak').className = `jump-btn ${jumps.j2.peak ? 'active-peak' : ''}`;
    document.getElementById('btnJ2Landing').className = `jump-btn ${jumps.j2.landing ? 'active-landing' : ''}`;
}

function onResults(results) {
    if (!results.poseLandmarks) {
        currentLandmarks = null; currentCoM = null; currentFeetCenter = null;
        outCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
        return;
    }

    const rawLm = results.poseLandmarks;
    const lm = rawLm.map(p => {
        if (isRoiEnabled && roiNorm.w > 0.05) { return { x: roiNorm.x + p.x * roiNorm.w, y: roiNorm.y + p.y * roiNorm.h, visibility: p.visibility }; }
        return p;
    });

    currentLandmarks = lm;
    const w = outputCanvas.width, h = outputCanvas.height;
    
    // 4点（両肩・両股関節）中心モデル
    const shL = lm[11], shR = lm[12], hipL = lm[23], hipR = lm[24];
    const ankleL = lm[27], ankleR = lm[28];
    
    if (shL && shR && hipL && hipR) {
        currentCoM = {
            x: (shL.x + shR.x + hipL.x + hipR.x) * 0.25 * w,
            y: (shL.y + shR.y + hipL.y + hipR.y) * 0.25 * h
        };
    } else if (hipL && hipR) {
        currentCoM = { x: (hipL.x + hipR.x) * 0.5 * w, y: (hipL.y + hipR.y) * 0.5 * h };
    }

    if (ankleL && ankleR) currentFeetCenter = { x: (ankleL.x + ankleR.x) * 0.5 * w, y: (ankleL.y + ankleR.y) * 0.5 * h };

    drawSkeleton(lm, w, h);
    redrawJumpVisuals();
}

function drawSkeleton(lm, w, h) {
    outCtx.clearRect(0, 0, w, h);
    outCtx.save();
    outCtx.lineWidth = 3 / zoomScale;
    
    if(lm[11] && lm[12] && lm[23] && lm[24]) {
        outCtx.strokeStyle = 'rgba(0, 255, 204, 0.7)';
        outCtx.beginPath(); outCtx.moveTo(lm[11].x*w, lm[11].y*h); outCtx.lineTo(lm[12].x*w, lm[12].y*h);
        outCtx.lineTo(lm[24].x*w, lm[24].y*h); outCtx.lineTo(lm[23].x*w, lm[23].y*h); outCtx.closePath(); outCtx.stroke();
    }
    const drawLine = (p1, p2, color) => {
        if(lm[p1] && lm[p2]) { outCtx.strokeStyle = color; outCtx.beginPath(); outCtx.moveTo(lm[p1].x*w, lm[p1].y*h); outCtx.lineTo(lm[p2].x*w, lm[p2].y*h); outCtx.stroke(); }
    }
    drawLine(24, 26, '#ffd60a'); drawLine(26, 28, '#ffd60a'); drawLine(28, 32, '#ffd60a');
    drawLine(23, 25, '#00ffcc'); drawLine(25, 27, '#00ffcc'); drawLine(27, 31, '#00ffcc');
    
    if(currentCoM) {
        outCtx.fillStyle = '#ff375f'; outCtx.beginPath(); outCtx.arc(currentCoM.x, currentCoM.y, 6/zoomScale, 0, Math.PI*2); outCtx.fill();
    }
    outCtx.restore();
}

// ジャンプフェーズ記録
function markJumpPhase(key) {
    if (!currentCoM || !currentFeetCenter) {
        alert("人物が検出できていません"); return;
    }
    if (!pxPerCm) {
        alert("先に「📏 物差し」で基準の長さを設定してください"); return;
    }

    const frame = Math.round(video.currentTime * currentFPS);
    const data = { time: frame / currentFPS, frame: frame, com: { ...currentCoM }, feet: { ...currentFeetCenter } };
    
    const [jId, phase] = key.split('_');
    jumps[jId][phase] = data;

    updateJumpBtnStyles();
    calculateMetrics();
    redrawJumpVisuals();
}

function clearJumpData() {
    jumps.j1 = { takeoff: null, peak: null, landing: null };
    jumps.j2 = { takeoff: null, peak: null, landing: null };
    updateJumpBtnStyles();
    calculateMetrics();
    redrawJumpVisuals();
}

function calculateMetrics() {
    // 1回目
    let j1HeightM = 0;
    if (pxPerCm && jumps.j1.takeoff && jumps.j1.peak) {
        const dy = jumps.j1.takeoff.com.y - jumps.j1.peak.com.y;
        const hCm = Math.max(0, dy / pxPerCm);
        j1HeightM = hCm / 100;
        document.getElementById('res_j1_h').innerText = `${hCm.toFixed(1)} cm`;
    } else { document.getElementById('res_j1_h').innerText = "--- cm"; }

    if (jumps.j1.takeoff && jumps.j1.landing) {
        const t = Math.max(0, jumps.j1.landing.time - jumps.j1.takeoff.time);
        document.getElementById('res_j1_t').innerText = `${t.toFixed(3)} s`;
    } else { document.getElementById('res_j1_t').innerText = "--- s"; }

    // 2回目
    let j2HeightM = 0;
    if (pxPerCm && jumps.j2.takeoff && jumps.j2.peak) {
        const dy = jumps.j2.takeoff.com.y - jumps.j2.peak.com.y;
        const hCm = Math.max(0, dy / pxPerCm);
        j2HeightM = hCm / 100;
        document.getElementById('res_j2_h').innerText = `${hCm.toFixed(1)} cm`;
    } else { document.getElementById('res_j2_h').innerText = "--- cm"; }

    if (jumps.j2.takeoff && jumps.j2.landing) {
        const t = Math.max(0, jumps.j2.landing.time - jumps.j2.takeoff.time);
        document.getElementById('res_j2_t').innerText = `${t.toFixed(3)} s`;
    } else { document.getElementById('res_j2_t').innerText = "--- s"; }

    // リバウンド（接地時間 ＆ RSI）
    let contactTimeS = 0;
    if (jumps.j1.landing && jumps.j2.takeoff) {
        contactTimeS = Math.max(0, jumps.j2.takeoff.time - jumps.j1.landing.time);
        document.getElementById('res_contact_t').innerText = `${contactTimeS.toFixed(3)} s`;
    } else { document.getElementById('res_contact_t').innerText = "--- s"; }

    if (j2HeightM > 0 && contactTimeS > 0) {
        const rsi = j2HeightM / contactTimeS;
        document.getElementById('res_rsi').innerText = `${rsi.toFixed(2)}`;
    } else { document.getElementById('res_rsi').innerText = "---"; }
}

function redrawJumpVisuals() {
    const drawMark = (pt, label, color) => {
        if (!pt) return;
        outCtx.save();
        outCtx.fillStyle = color;
        outCtx.beginPath(); outCtx.arc(pt.com.x, pt.com.y, 6/zoomScale, 0, Math.PI*2); outCtx.fill();
        outCtx.fillStyle = '#fff'; outCtx.font = `bold ${10/zoomScale}px sans-serif`;
        outCtx.fillText(label, pt.com.x + 8/zoomScale, pt.com.y - 4/zoomScale);
        outCtx.restore();
    };

    drawMark(jumps.j1.takeoff, "①離地", "#00ffcc");
    drawMark(jumps.j1.peak, "①頂点", "#00ffcc");
    drawMark(jumps.j1.landing, "①着地", "#00ffcc");

    drawMark(jumps.j2.takeoff, "②離地", "#ffd60a");
    drawMark(jumps.j2.peak, "②頂点", "#ffd60a");
    drawMark(jumps.j2.landing, "②着地", "#ffd60a");
}

async function renderCurrentFrame() {
    if (isProcessing || video.readyState < 2) return;
    isProcessing = true;
    try {
        let inputSource = video;
        if (isRoiEnabled && roiNorm.w > 0.05) {
            const sx = roiNorm.x * video.videoWidth, sy = roiNorm.y * video.videoHeight;
            const sw = roiNorm.w * video.videoWidth, sh = roiNorm.h * video.videoHeight;
            if (sw > 10 && sh > 10) { roiCanvas.width = sw; roiCanvas.height = sh; roiCtx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh); inputSource = roiCanvas; }
        }
        await pose.send({ image: inputSource });
    } catch(e) {} finally { isProcessing = false; }
}

async function loop() {
    if (!video.paused && !video.ended) { await renderCurrentFrame(); updateSeekBar(); }
    animationFrameId = requestAnimationFrame(loop);
}

function updateSeekBar() { if (video.duration) seekSlider.value = (video.currentTime / video.duration) * 100; }
seekSlider.addEventListener('input', () => { if (video.duration) { video.pause(); btnPlayPause.innerText = '▶ 再生'; video.currentTime = (seekSlider.value / 100) * video.duration; } });
video.addEventListener('seeked', () => { if (video.paused) { updateSeekBar(); renderCurrentFrame(); } });

btnPlayPause.addEventListener('click', async () => {
    if (video.paused) { 
        try { 
            await video.play(); 
            btnPlayPause.innerText = '⏸ 停止'; 
            btnPlayPause.style.background = '#ff9500'; 
        } catch (e) {} 
    } else { 
        video.pause(); 
        btnPlayPause.innerText = '▶ 再生'; 
        btnPlayPause.style.background = '#34c759'; 
    }
});

btnStepForward.addEventListener('click', () => { video.pause(); btnPlayPause.innerText = '▶ 再生'; btnPlayPause.style.background = '#34c759'; video.currentTime = Math.min(video.duration, video.currentTime + (1 / currentFPS)); });
btnStepBack.addEventListener('click', () => { video.pause(); btnPlayPause.innerText = '▶ 再生'; btnPlayPause.style.background = '#34c759'; video.currentTime = Math.max(0, video.currentTime - (1 / currentFPS)); });

function captureSnapshot() {
    if (!video.videoWidth) { alert("動画が読み込まれていません"); return; }
    const snapCanvas = document.createElement('canvas'), snapCtx = snapCanvas.getContext('2d');
    snapCanvas.width = outputCanvas.width; snapCanvas.height = outputCanvas.height + 70;
    snapCtx.fillStyle = '#000'; snapCtx.fillRect(0, 0, snapCanvas.width, snapCanvas.height);
    snapCtx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height); snapCtx.drawImage(outputCanvas, 0, 0);
    snapCtx.fillStyle = '#1c1c1e'; snapCtx.fillRect(0, outputCanvas.height, snapCanvas.width, 70);
    snapCtx.fillStyle = '#00ffcc'; snapCtx.font = 'bold 13px sans-serif';
    snapCtx.fillText(`1回目高: ${document.getElementById('res_j1_h').innerText} ｜ 2回目高: ${document.getElementById('res_j2_h').innerText}`, 15, outputCanvas.height + 26);
    snapCtx.fillStyle = '#ff375f'; snapCtx.font = 'bold 12px sans-serif';
    snapCtx.fillText(`接地時間: ${document.getElementById('res_contact_t').innerText} ｜ RSI: ${document.getElementById('res_rsi').innerText}`, 15, outputCanvas.height + 50);
    document.getElementById('snapshot-img').src = snapCanvas.toDataURL('image/png'); document.getElementById('snapshot-modal-overlay').style.display = 'flex';
}
function closeSnapshotModal() { document.getElementById('snapshot-modal-overlay').style.display = 'none'; }

document.getElementById('inputFile').addEventListener('change', (e) => {
    const file = e.target.files[0]; if (!file) return;
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
    video.pause(); resetZoom(); clearJumpData();
    currentBlobUrl = URL.createObjectURL(file); video.src = currentBlobUrl; video.load();
    const onCanPlay = () => { video.removeEventListener('canplay', onCanPlay); fitCanvases(); btnPlayPause.innerText = '▶ 再生'; video.currentTime = 0.001; loop(); };
    video.addEventListener('canplay', onCanPlay); e.target.value = '';
});
</script>
