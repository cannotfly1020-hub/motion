<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="動作分析Pro">
<title>下肢バイオメカニクス分析 - 動作分析Pro</title>

<link rel="stylesheet" href="css/style.css">

<!-- MediaPipe Pose -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="header">
    <div class="header-top-row">
        <div class="btn-group-header">
            <a class="hdr-btn secondary" href="../index.html">← 総合ポータルへ</a>
            <button class="hdr-btn" onclick="document.getElementById('inputFile').click()">動画選択</button>
            <input type="file" id="inputFile" accept="video/*" style="display:none;">
            <button class="hdr-btn fps-badge" id="btnFps" onclick="toggleFPS()">30fps</button>
            <button class="hdr-btn secondary" id="btnToggleRoi" onclick="toggleRoiMode()">🔲 対象者指定</button>
            <button class="hdr-btn" style="background:#5856d6;" onclick="captureSnapshot()">📸 静止画</button>
            <button class="hdr-btn rec-btn" id="btnRecord" onclick="toggleRecording()">🎥 録画開始</button>
        </div>
        <span id="body-info-text" onclick="openBodyModal()">47kg/140cm ⚙️</span>
    </div>
    <div id="result-box">
        <div class="result-text-area">
            <div id="main-result">解析待機中</div>
            <div id="sub-result">下肢関節モーメント &amp; 床反力ベクトルをリアルタイム解析</div>
        </div>
    </div>
</div>

<div id="stage">
    <div class="video-pane" id="viewportArea">
        <div class="zoom-target" id="zoomTarget">
            <video id="videoElement" playsinline webkit-playsinline muted preload="auto" crossorigin="anonymous"></video>
            <canvas id="outputCanvas"></canvas>
            <canvas id="interactionCanvas"></canvas>
        </div>
        <div class="hud-overlay">
            <div class="hud-badge hud-r">右膝 <span id="hud_r_knee">--</span> N·m</div>
            <div class="hud-badge hud-l">左膝 <span id="hud_l_knee">--</span> N·m</div>
        </div>
    </div>
</div>

<div id="controls">
    <div class="seek-row">
        <span class="seek-label">▶</span>
        <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.05">
    </div>

    <div class="mode-grid">
        <button class="ctrl-btn" id="btnModeZoom" onclick="toggleZoomMode()">🔍 ズーム</button>
        <button class="ctrl-btn" onclick="resetZoom()">1x 表示</button>
        <button class="ctrl-btn" onclick="clearRoi()">枠リセット</button>
        <button class="ctrl-btn" onclick="openBodyModal()">体重・身長</button>
    </div>

    <div id="zoom-controls" style="display:none; width:100%; align-items:center; gap:8px;">
        <span style="font-size:11px; font-weight:bold; color:#007aff;">倍率</span>
        <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1">
    </div>

    <div class="dashboard-grid">
        <div class="side-box right">
            <div class="side-title" style="color:#00e5ff;">右下肢</div>
            <div class="metric-row"><span>床反力:</span><span id="r_grf" class="metric-val">--- N</span></div>
            <div class="metric-row"><span>足関節:</span><span id="r_ankle" class="metric-val">--- N·m</span></div>
            <div class="metric-row"><span>膝関節:</span><span id="r_knee" class="metric-val">--- N·m</span></div>
            <div class="metric-row"><span>股関節:</span><span id="r_hip" class="metric-val">--- N·m</span></div>
        </div>
        <div class="side-box left">
            <div class="side-title" style="color:#ffd60a;">左下肢</div>
            <div class="metric-row"><span>床反力:</span><span id="l_grf" class="metric-val">--- N</span></div>
            <div class="metric-row"><span>足関節:</span><span id="l_ankle" class="metric-val">--- N·m</span></div>
            <div class="metric-row"><span>膝関節:</span><span id="l_knee" class="metric-val">--- N·m</span></div>
            <div class="metric-row"><span>股関節:</span><span id="l_hip" class="metric-val">--- N·m</span></div>
        </div>
    </div>

    <div class="playback-row">
        <button class="ctrl-btn" id="btnStepBack">◀ -1</button>
        <button class="ctrl-btn" id="btnPlayPause">▶ 再生</button>
        <button class="ctrl-btn" id="btnStepForward">+1 ▶</button>
        <button class="ctrl-btn" id="btnSpeed" onclick="togglePlaybackRate()">1.0x</button>
        <button class="ctrl-btn" style="background:#555;" onclick="fitCanvases()">🔄 更新</button>
    </div>
</div>

<div id="body-modal-overlay" class="modal-overlay">
    <div class="modal-card">
        <h3>体重・身長の設定</h3>
        <p>床反力・関節モーメントの算出に使います</p>
        <div class="modal-input-row">
            <input type="number" id="inputMass" inputmode="decimal" value="47">
            <span style="font-weight:bold; font-size:15px;">kg</span>
        </div>
        <div class="modal-input-row">
            <input type="number" id="inputHeight" inputmode="decimal" value="140">
            <span style="font-weight:bold; font-size:15px;">cm</span>
        </div>
        <div class="modal-btn-row">
            <button style="background:#ff9500; color:#000;" onclick="closeBodyModal()">確定</button>
        </div>
    </div>
</div>

<div id="snapshot-modal-overlay" class="modal-overlay">
    <div class="modal-card" style="max-width:360px;">
        <h3 style="color:#5856d6;">📸 下肢解析キャプチャ</h3>
        <p style="font-size:11px; color:#aaa;">画像を長押しして「写真に追加」で保存できます</p>
        <img id="snapshot-img" src="" alt="Screenshot">
        <div class="modal-btn-row">
            <button style="background:#444; color:#fff;" onclick="closeSnapshotModal()">閉じる</button>
        </div>
    </div>
</div>

<!-- file:// 対応: ES Modules ではなく通常の script タグ。読み込み順を守ること -->
<script src="js/math.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
<script src="js/mediapipe.js"></script>
</body>
</html>
