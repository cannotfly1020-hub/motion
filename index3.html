<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>下肢動作分析 & ターゲット枠指定</title>
  <!-- MediaPipe Pose CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    .app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 6px;
      gap: 6px;
      max-width: 480px;
      margin: 0 auto;
    }
    .top-bar {
      flex: 0 0 auto;
      background: #1e1e1e;
      padding: 6px 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .top-bar input {
      background: #2a2a2a;
      border: 1px solid #555;
      color: #fff;
      padding: 2px 4px;
      border-radius: 4px;
      width: 42px;
      text-align: center;
      font-size: 11px;
    }
    .btn {
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      border: none;
    }
    .btn-blue { background: #0070f3; color: #fff; }
    .btn-gray { background: #333; color: #fff; border: 1px solid #555; }
    .btn-target { background: #8b5cf6; color: #fff; }
    .btn-target.active { background: #ef4444; }
    
    .viewport {
      flex: 1 1 auto;
      position: relative;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      min-height: 160px;
    }
    canvas#outputCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    /* ターゲット指定枠（リサイズ・移動可能） */
    #roiBox {
      position: absolute;
      border: 2px dashed #a855f7;
      background: rgba(168, 85, 247, 0.12);
      display: none;
      z-index: 15;
      box-sizing: border-box;
      cursor: move;
    }
    #roiBox .roi-title {
      position: absolute;
      top: -20px;
      left: 0;
      background: #a855f7;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px 3px 0 0;
      pointer-events: none;
      white-space: nowrap;
    }
    #roiBox .roi-handle {
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 18px;
      height: 18px;
      background: #a855f7;
      border: 2px solid #fff;
      border-radius: 50%;
      cursor: se-resize;
    }

    .zoom-overlay {
      position: absolute;
      bottom: 8px;
      right: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 10;
    }
    .btn-zoom {
      width: 32px;
      height: 32px;
      background: rgba(30, 30, 30, 0.85);
      border: 1px solid #555;
      color: #fff;
      border-radius: 50%;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .btn-zoom-reset {
      font-size: 10px;
      border-radius: 6px;
      width: 32px;
      height: 24px;
    }

    .hud-overlay {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-badge {
      background: rgba(0, 0, 0, 0.75);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .hud-r { color: #00e5ff; border-left: 3px solid #00e5ff; }
    .hud-l { color: #ff9100; border-left: 3px solid #ff9100; }

    .controller {
      flex: 0 0 auto;
      background: #1e1e1e;
      padding: 4px 8px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .slider-row input[type="range"] {
      flex: 1;
      height: 18px;
      accent-color: #0070f3;
    }
    .time-label {
      font-size: 10px;
      color: #888;
      width: 65px;
      text-align: right;
    }
    .step-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .btn-step {
      padding: 4px 10px;
      font-size: 10px;
      background: #2a2a2a;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 4px;
    }

    .dashboard-grid {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 2px;
    }
    .side-box {
      background: #1e1e1e;
      border-radius: 6px;
      padding: 4px 8px;
    }
    .side-box.right { border-top: 2px solid #00e5ff; }
    .side-box.left { border-top: 2px solid #ff9100; }
    .side-title {
      font-size: 10px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 2px;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      font-size: 9.5px;
      padding: 1px 0;
    }
    .metric-val { font-weight: bold; font-family: monospace; }
  </style>
</head>
<body>

<div class="app-wrapper">
  <!-- 上部バー -->
  <div class="top-bar">
    <div>
      <label>体重:<input type="number" id="inputMass" value="47">kg</label>
      <label style="margin-left:4px;">身長:<input type="number" id="inputHeight" value="140">cm</label>
    </div>
    <div style="display:flex; gap:4px;">
      <button id="btnToggleRoi" class="btn btn-target">🎯 枠で指定</button>
      <button id="btnCamera" class="btn btn-blue">カメラ</button>
      <label class="btn btn-gray" style="display:flex; align-items:center; cursor:pointer;">
        動画
        <input type="file" id="inputFile" accept="video/*" style="display:none;">
      </label>
    </div>
  </div>

  <!-- 映像ビューポート -->
  <div class="viewport" id="viewportArea">
    <video id="videoElement" playsinline webkit-playsinline muted preload="auto" style="display:none;"></video>
    <canvas id="outputCanvas"></canvas>
    
    <!-- ターゲット指定枠 -->
    <div id="roiBox">
      <div class="roi-title">対象者枠 (ドラッグ/拡縮)</div>
      <div class="roi-handle" id="roiHandle"></div>
    </div>

    <div class="hud-overlay">
      <div class="hud-badge hud-r">右膝: <span id="hud_r_knee">0</span> N·m</div>
      <div class="hud-badge hud-l">左膝: <span id="hud_l_knee">0</span> N·m</div>
    </div>

    <div class="zoom-overlay">
      <button id="btnZoomIn" class="btn-zoom">＋</button>
      <button id="btnZoomOut" class="btn-zoom">ー</button>
      <button id="btnZoomReset" class="btn-zoom btn-zoom-reset">1x</button>
    </div>
  </div>

  <!-- シークコントローラー -->
  <div class="controller" id="controllerArea">
    <div class="slider-row">
      <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.05">
      <span class="time-label" id="timeDisplay">0.00 / 0.00</span>
    </div>
    <div class="step-row">
      <button id="btnStepBack" class="btn-step">◀ コマ戻る</button>
      <button id="btnPlayPause" class="btn-step" style="min-width: 50px;">再生</button>
      <button id="btnStepForward" class="btn-step">コマ進む ▶</button>
    </div>
  </div>

  <!-- 数値ダッシュボード -->
  <div class="dashboard-grid">
    <div class="side-box right">
      <div class="side-title" style="color:#00e5ff;">右脚 (Right)</div>
      <div class="metric-row"><span>床反力:</span><span id="r_grf" class="metric-val" style="color:#4ade80;">0 N</span></div>
      <div class="metric-row"><span>足関節:</span><span id="r_ankle" class="metric-val" style="color:#60a5fa;">0.0 N·m</span></div>
      <div class="metric-row"><span>膝関節:</span><span id="r_knee" class="metric-val" style="color:#38bdf8;">0.0 N·m</span></div>
      <div class="metric-row"><span>股関節:</span><span id="r_hip" class="metric-val" style="color:#818cf8;">0.0 N·m</span></div>
    </div>

    <div class="side-box left">
      <div class="side-title" style="color:#ff9100;">左脚 (Left)</div>
      <div class="metric-row"><span>床反力:</span><span id="l_grf" class="metric-val" style="color:#4ade80;">0 N</span></div>
      <div class="metric-row"><span>足関節:</span><span id="l_ankle" class="metric-val" style="color:#fb923c;">0.0 N·m</span></div>
      <div class="metric-row"><span>膝関節:</span><span id="l_knee" class="metric-val" style="color:#f87171;">0.0 N·m</span></div>
      <div class="metric-row"><span>股関節:</span><span id="l_hip" class="metric-val" style="color:#fbbf24;">0.0 N·m</span></div>
    </div>
  </div>
</div>

<script>
const video = document.getElementById('videoElement');
const canvas = document.getElementById('outputCanvas');
const ctx = canvas.getContext('2d');
const viewportArea = document.getElementById('viewportArea');
const controllerArea = document.getElementById('controllerArea');

const btnToggleRoi = document.getElementById('btnToggleRoi');
const roiBox = document.getElementById('roiBox');
const roiHandle = document.getElementById('roiHandle');

const btnCamera = document.getElementById('btnCamera');
const inputFile = document.getElementById('inputFile');
const seekSlider = document.getElementById('seekSlider');
const timeDisplay = document.getElementById('timeDisplay');
const btnPlayPause = document.getElementById('btnPlayPause');
const btnStepBack = document.getElementById('btnStepBack');
const btnStepForward = document.getElementById('btnStepForward');

const btnZoomIn = document.getElementById('btnZoomIn');
const btnZoomOut = document.getElementById('btnZoomOut');
const btnZoomReset = document.getElementById('btnZoomReset');

let isProcessing = false;
let isCameraMode = false;
let isBusy = false;
let animationFrameId = null;
let currentBlobUrl = null;

// ROI（四角枠）の管理
let isRoiEnabled = false;
let roiNorm = { x: 0.25, y: 0.1, w: 0.5, h: 0.8 }; // 画面に対する相対座標 (0.0〜1.0)
const roiCanvas = document.createElement('canvas');
const roiCtx = roiCanvas.getContext('2d');

// ズーム & パン管理
let zoomScale = 1.0;
let panOffsetX = 0, panOffsetY = 0;
let isDraggingViewport = false;
let startX = 0, startY = 0;

const BSIP = { trunk: 0.678, thigh: 0.100, shank: 0.046, foot: 0.014 };
let prevCoM = null, prevVelCoM = null, prevTime = null;
let filteredGRF = { x: 0, y: 0 };
const LPF_ALPHA = 0.35;
const GRAVITY = 9.81;

// MediaPipe Pose
const pose = new Pose({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});
pose.setOptions({
  modelComplexity: 0,
  smoothLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});
pose.onResults(onResults);

function resetState() {
  prevCoM = null;
  prevVelCoM = null;
  prevTime = null;
  filteredGRF = { x: 0, y: 0 };
  zoomScale = 1.0;
  panOffsetX = 0;
  panOffsetY = 0;
}

// ================= ターゲット四角枠のUI操作 =================
function updateRoiBoxDOM() {
  const vpRect = viewportArea.getBoundingClientRect();
  roiBox.style.left = `${roiNorm.x * 100}%`;
  roiBox.style.top = `${roiNorm.y * 100}%`;
  roiBox.style.width = `${roiNorm.w * 100}%`;
  roiBox.style.height = `${roiNorm.h * 100}%`;
}

btnToggleRoi.addEventListener('click', () => {
  isRoiEnabled = !isRoiEnabled;
  if (isRoiEnabled) {
    roiBox.style.display = 'block';
    btnToggleRoi.textContent = '🔒 枠を解除';
    btnToggleRoi.classList.add('active');
    updateRoiBoxDOM();
  } else {
    roiBox.style.display = 'none';
    btnToggleRoi.textContent = '🎯 枠で指定';
    btnToggleRoi.classList.remove('active');
  }
  renderCurrentFrame();
});

// 枠の移動 (ドラッグ)
let isMovingRoi = false;
let roiStartPointer = { x: 0, y: 0 };
let roiStartPos = { x: 0, y: 0 };

roiBox.addEventListener('pointerdown', (e) => {
  if (e.target === roiHandle) return;
  isMovingRoi = true;
  roiStartPointer = { x: e.clientX, y: e.clientY };
  roiStartPos = { x: roiNorm.x, y: roiNorm.y };
  roiBox.setPointerCapture(e.pointerId);
});

roiBox.addEventListener('pointermove', (e) => {
  if (!isMovingRoi) return;
  const vpRect = viewportArea.getBoundingClientRect();
  const dx = (e.clientX - roiStartPointer.x) / vpRect.width;
  const dy = (e.clientY - roiStartPointer.y) / vpRect.height;
  
  roiNorm.x = Math.max(0, Math.min(1.0 - roiNorm.w, roiStartPos.x + dx));
  roiNorm.y = Math.max(0, Math.min(1.0 - roiNorm.h, roiStartPos.y + dy));
  updateRoiBoxDOM();
  if (video.paused) renderCurrentFrame();
});

roiBox.addEventListener('pointerup', () => { isMovingRoi = false; });
roiBox.addEventListener('pointercancel', () => { isMovingRoi = false; });

// 枠のサイズ変更 (ハンドル操作)
let isResizingRoi = false;
let roiStartSize = { w: 0, h: 0 };

roiHandle.addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  isResizingRoi = true;
  roiStartPointer = { x: e.clientX, y: e.clientY };
  roiStartSize = { w: roiNorm.w, h: roiNorm.h };
  roiHandle.setPointerCapture(e.pointerId);
});

roiHandle.addEventListener('pointermove', (e) => {
  if (!isResizingRoi) return;
  const vpRect = viewportArea.getBoundingClientRect();
  const dx = (e.clientX - roiStartPointer.x) / vpRect.width;
  const dy = (e.clientY - roiStartPointer.y) / vpRect.height;

  roiNorm.w = Math.max(0.15, Math.min(1.0 - roiNorm.x, roiStartSize.w + dx));
  roiNorm.h = Math.max(0.2, Math.min(1.0 - roiNorm.y, roiStartSize.h + dy));
  updateRoiBoxDOM();
  if (video.paused) renderCurrentFrame();
});

roiHandle.addEventListener('pointerup', () => { isResizingRoi = false; });
roiHandle.addEventListener('pointercancel', () => { isResizingRoi = false; });

// ================= AI結果描画 & トルク算出 =================
function onResults(results) {
  if (video.videoWidth && canvas.width !== video.videoWidth) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }
  
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.translate(canvas.width / 2 + panOffsetX, canvas.height / 2 + panOffsetY);
  ctx.scale(zoomScale, zoomScale);
  ctx.translate(-canvas.width / 2, -canvas.height / 2);

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  if (!results.poseLandmarks) {
    ctx.restore();
    return;
  }

  // 枠内座標から全画面座標系へマッピング
  const rawLm = results.poseLandmarks;
  const lm = rawLm.map(p => {
    if (isRoiEnabled) {
      return {
        x: roiNorm.x + p.x * roiNorm.w,
        y: roiNorm.y + p.y * roiNorm.h,
        z: p.z
      };
    }
    return p;
  });

  const mass = parseFloat(document.getElementById('inputMass').value) || 47;
  const heightM = (parseFloat(document.getElementById('inputHeight').value) || 140) / 100.0;
  const now = isCameraMode ? performance.now() / 1000.0 : video.currentTime;

  const pxBodyHeight = Math.abs(lm[0].y - (lm[27].y + lm[28].y) / 2) * canvas.height;
  const meterPerPixel = (heightM * 0.85) / (pxBodyHeight || 1);

  const getPoint = (idx) => ({
    x: lm[idx].x * canvas.width * meterPerPixel,
    y: (1.0 - lm[idx].y) * canvas.height * meterPerPixel
  });

  const shoulderR = getPoint(12), shoulderL = getPoint(11);
  const hipR = getPoint(24), hipL = getPoint(23);
  const kneeR = getPoint(26), kneeL = getPoint(25);
  const ankleR = getPoint(28), ankleL = getPoint(27);
  const toeR = getPoint(32), toeL = getPoint(31);

  const comTrunk = { x: (shoulderR.x + hipR.x + shoulderL.x + hipL.x) * 0.25, y: (shoulderR.y + hipR.y + shoulderL.y + hipL.y) * 0.25 };
  const comThighR = { x: hipR.x * 0.433 + kneeR.x * 0.567, y: hipR.y * 0.433 + kneeR.y * 0.567 };
  const comShankR = { x: kneeR.x * 0.433 + ankleR.x * 0.567, y: kneeR.y * 0.433 + ankleR.y * 0.567 };
  const comFootR  = { x: (ankleR.x + toeR.x) * 0.5, y: (ankleR.y + toeR.y) * 0.5 };

  const comThighL = { x: hipL.x * 0.433 + kneeL.x * 0.567, y: hipL.y * 0.433 + kneeL.y * 0.567 };
  const comShankL = { x: kneeL.x * 0.433 + ankleL.x * 0.567, y: kneeL.y * 0.433 + ankleL.y * 0.567 };
  const comFootL  = { x: (ankleL.x + toeL.x) * 0.5, y: (ankleL.y + toeL.y) * 0.5 };

  const currentCoM = {
    x: BSIP.trunk * comTrunk.x + BSIP.thigh * (comThighR.x + comThighL.x) + BSIP.shank * (comShankR.x + comShankL.x) + BSIP.foot * (comFootR.x + comFootL.x),
    y: BSIP.trunk * comTrunk.y + BSIP.thigh * (comThighR.y + comThighL.y) + BSIP.shank * (comShankR.y + comShankL.y) + BSIP.foot * (comFootR.y + comFootL.y)
  };

  let totalGrf = { x: 0, y: mass * GRAVITY };
  if (prevCoM && prevTime && Math.abs(now - prevTime) > 0.0001) {
    const dt = Math.max(Math.abs(now - prevTime), 0.001);
    const velCoM = { x: (currentCoM.x - prevCoM.x) / dt, y: (currentCoM.y - prevCoM.y) / dt };

    if (prevVelCoM) {
      const accCoM = { x: (velCoM.x - prevVelCoM.x) / dt, y: (velCoM.y - prevVelCoM.y) / dt };
      const rawGrfX = mass * accCoM.x;
      const rawGrfY = Math.max(0, mass * (accCoM.y + GRAVITY));

      filteredGRF.x = filteredGRF.x * (1 - LPF_ALPHA) + rawGrfX * LPF_ALPHA;
      filteredGRF.y = filteredGRF.y * (1 - LPF_ALPHA) + rawGrfY * LPF_ALPHA;
      totalGrf = filteredGRF;
    }
    prevVelCoM = velCoM;
  }
  prevCoM = currentCoM;
  prevTime = now;

  const rContact = ankleR.y < ankleL.y + 0.08 ? 1.0 : 0.0;
  const lContact = ankleL.y < ankleR.y + 0.08 ? 1.0 : 0.0;
  const sumContact = (rContact + lContact) || 1.0;

  const grfR = { x: (totalGrf.x * rContact) / sumContact, y: (totalGrf.y * rContact) / sumContact };
  const grfL = { x: (totalGrf.x * lContact) / sumContact, y: (totalGrf.y * lContact) / sumContact };

  const torqueAnkleR = (comFootR.x - ankleR.x) * grfR.y - (comFootR.y - ankleR.y) * grfR.x;
  const torqueKneeR  = (comFootR.x - kneeR.x)  * grfR.y - (comFootR.y - kneeR.y)  * grfR.x;
  const torqueHipR   = (comFootR.x - hipR.x)   * grfR.y - (comFootR.y - hipR.y)   * grfR.x;

  const torqueAnkleL = (comFootL.x - ankleL.x) * grfL.y - (comFootL.y - ankleL.y) * grfL.x;
  const torqueKneeL  = (comFootL.x - kneeL.x)  * grfL.y - (comFootL.y - kneeL.y)  * grfL.x;
  const torqueHipL   = (comFootL.x - hipL.x)   * grfL.y - (comFootL.y - hipL.y)   * grfL.x;

  document.getElementById('hud_r_knee').textContent = torqueKneeR.toFixed(1);
  document.getElementById('hud_l_knee').textContent = torqueKneeL.toFixed(1);

  const magGrfR = Math.hypot(grfR.x, grfR.y);
  const magGrfL = Math.hypot(grfL.x, grfL.y);

  document.getElementById('r_grf').textContent = `${Math.round(magGrfR)} N`;
  document.getElementById('r_ankle').textContent = `${torqueAnkleR.toFixed(1)} N·m`;
  document.getElementById('r_knee').textContent = `${torqueKneeR.toFixed(1)} N·m`;
  document.getElementById('r_hip').textContent = `${torqueHipR.toFixed(1)} N·m`;

  document.getElementById('l_grf').textContent = `${Math.round(magGrfL)} N`;
  document.getElementById('l_ankle').textContent = `${torqueAnkleL.toFixed(1)} N·m`;
  document.getElementById('l_knee').textContent = `${torqueKneeL.toFixed(1)} N·m`;
  document.getElementById('l_hip').textContent = `${torqueHipL.toFixed(1)} N·m`;

  drawVisuals(lm, comFootR, grfR, magGrfR, comFootL, grfL, magGrfL, meterPerPixel);
  ctx.restore();
}

function drawVisuals(lm, copR, grfR, magR, copL, grfL, magL, meterPerPixel) {
  // 右骨格
  ctx.strokeStyle = '#00e5ff';
  ctx.lineWidth = 3 / zoomScale;
  ctx.beginPath();
  ctx.moveTo(lm[24].x * canvas.width, lm[24].y * canvas.height);
  ctx.lineTo(lm[26].x * canvas.width, lm[26].y * canvas.height);
  ctx.lineTo(lm[28].x * canvas.width, lm[28].y * canvas.height);
  ctx.lineTo(lm[32].x * canvas.width, lm[32].y * canvas.height);
  ctx.stroke();

  // 左骨格
  ctx.strokeStyle = '#ff9100';
  ctx.lineWidth = 3 / zoomScale;
  ctx.beginPath();
  ctx.moveTo(lm[23].x * canvas.width, lm[23].y * canvas.height);
  ctx.lineTo(lm[25].x * canvas.width, lm[25].y * canvas.height);
  ctx.lineTo(lm[27].x * canvas.width, lm[27].y * canvas.height);
  ctx.lineTo(lm[31].x * canvas.width, lm[31].y * canvas.height);
  ctx.stroke();

  // 左右床反力矢印
  const rPxX = copR.x / meterPerPixel;
  const rPxY = canvas.height - (copR.y / meterPerPixel);
  if (magR > 25) drawDynamicForceArrow(rPxX, rPxY, grfR.x, grfR.y, magR);

  const lPxX = copL.x / meterPerPixel;
  const lPxY = canvas.height - (copL.y / meterPerPixel);
  if (magL > 25) drawDynamicForceArrow(lPxX, lPxY, grfL.x, grfL.y, magL);
}

function drawDynamicForceArrow(fromX, fromY, fx, fy, mag) {
  const scale = 0.28;
  const toX = fromX + fx * scale;
  const toY = fromY - fy * scale;
  const angle = Math.atan2(toY - fromY, toX - fromX);
  
  const headLen = Math.min(36, Math.max(14, mag * 0.045));
  const lineWidth = Math.min(14, Math.max(4, mag * 0.016)) / zoomScale;
  const glowBlur = Math.min(25, Math.max(6, mag * 0.03));

  let color = '#38bdf8';
  if (mag > 900) color = '#ff1744';
  else if (mag > 600) color = '#ff9100';
  else if (mag > 300) color = '#00e676';

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = glowBlur;
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();
  ctx.moveTo(fromX, fromY);
  ctx.lineTo(toX, toY);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(toX, toY);
  ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI / 5), toY - headLen * Math.sin(angle - Math.PI / 5));
  ctx.lineTo(toX - (headLen * 0.6) * Math.cos(angle), toY - (headLen * 0.6) * Math.sin(angle));
  ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI / 5), toY - headLen * Math.sin(angle + Math.PI / 5));
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;

  const text = `${Math.round(mag)} N`;
  ctx.font = `bold ${Math.round(12 / Math.min(zoomScale, 1.5))}px monospace`;
  const textMetrics = ctx.measureText(text);
  const badgeW = textMetrics.width + 10;
  const badgeH = 18;
  const badgeX = toX + 12 * Math.cos(angle) - badgeW / 2;
  const badgeY = toY + 12 * Math.sin(angle) - badgeH / 2;

  ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5 / zoomScale;
  ctx.beginPath();
  ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 4);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, badgeX + badgeW / 2, badgeY + badgeH / 2);

  ctx.beginPath();
  ctx.arc(fromX, fromY, Math.min(8, Math.max(4, mag * 0.01)), 0, 2 * Math.PI);
  ctx.fillStyle = color;
  ctx.fill();

  ctx.restore();
}

// ================= ズーム & 基本ループ =================
function updateZoom(newScale) {
  zoomScale = Math.max(1.0, Math.min(3.5, newScale));
  if (zoomScale === 1.0) { panOffsetX = 0; panOffsetY = 0; }
  renderCurrentFrame();
}

btnZoomIn.addEventListener('click', (e) => { e.stopPropagation(); updateZoom(zoomScale + 0.3); });
btnZoomOut.addEventListener('click', (e) => { e.stopPropagation(); updateZoom(zoomScale - 0.3); });
btnZoomReset.addEventListener('click', (e) => { e.stopPropagation(); updateZoom(1.0); });

viewportArea.addEventListener('pointerdown', (e) => {
  if (e.target === roiBox || e.target === roiHandle) return;
  if (zoomScale > 1.0) {
    isDraggingViewport = true;
    startX = e.clientX - panOffsetX;
    startY = e.clientY - panOffsetY;
  }
});

window.addEventListener('pointermove', (e) => {
  if (isDraggingViewport && zoomScale > 1.0) {
    panOffsetX = e.clientX - startX;
    panOffsetY = e.clientY - startY;
    const maxPanX = (canvas.width * (zoomScale - 1)) / 2;
    const maxPanY = (canvas.height * (zoomScale - 1)) / 2;
    panOffsetX = Math.max(-maxPanX, Math.min(maxPanX, panOffsetX));
    panOffsetY = Math.max(-maxPanY, Math.min(maxPanY, panOffsetY));
    if (video.paused) renderCurrentFrame();
  }
});

window.addEventListener('pointerup', () => { isDraggingViewport = false; });
window.addEventListener('pointercancel', () => { isDraggingViewport = false; });

async function renderCurrentFrame() {
  if (isBusy || video.readyState < 2) return;
  isBusy = true;
  try {
    let inputSource = video;
    
    // 枠指定が有効な場合、その領域だけを切り出してMediaPipeへ渡す
    if (isRoiEnabled) {
      const sx = roiNorm.x * video.videoWidth;
      const sy = roiNorm.y * video.videoHeight;
      const sw = roiNorm.w * video.videoWidth;
      const sh = roiNorm.h * video.videoHeight;

      roiCanvas.width = sw;
      roiCanvas.height = sh;
      roiCtx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
      inputSource = roiCanvas;
    }

    await pose.send({ image: inputSource });
  } catch(e) {
    console.error("Frame render error:", e);
  } finally {
    isBusy = false;
  }
}

async function loop() {
  if (!isProcessing) return;
  if (!video.paused && !video.ended) {
    await renderCurrentFrame();
    updateSeekBar();
  }
  animationFrameId = requestAnimationFrame(loop);
}

function updateSeekBar() {
  if (video.duration) {
    seekSlider.value = (video.currentTime / video.duration) * 100;
    timeDisplay.textContent = `${video.currentTime.toFixed(2)} / ${video.duration.toFixed(2)}`;
  }
}

seekSlider.addEventListener('input', () => {
  if (video.duration) {
    video.pause();
    btnPlayPause.textContent = '再生';
    video.currentTime = (seekSlider.value / 100) * video.duration;
  }
});

video.addEventListener('seeked', () => {
  if (video.paused) {
    updateSeekBar();
    renderCurrentFrame();
  }
});

btnPlayPause.addEventListener('click', async () => {
  if (video.paused) {
    try {
      await video.play();
      btnPlayPause.textContent = '一時停止';
    } catch (e) {
      console.error(e);
    }
  } else {
    video.pause();
    btnPlayPause.textContent = '再生';
  }
});

btnStepForward.addEventListener('click', () => {
  video.pause();
  btnPlayPause.textContent = '再生';
  video.currentTime = Math.min(video.duration, video.currentTime + 0.033);
});

btnStepBack.addEventListener('click', () => {
  video.pause();
  btnPlayPause.textContent = '再生';
  video.currentTime = Math.max(0, video.currentTime - 0.033);
});

// カメラ起動
btnCamera.addEventListener('click', async () => {
  if (isProcessing && isCameraMode) {
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
      video.srcObject = null;
    }
    isProcessing = false;
    isCameraMode = false;
    btnCamera.textContent = 'カメラ';
    btnCamera.classList.remove('btn-red');
    btnCamera.classList.add('btn-blue');
    return;
  }

  if (animationFrameId) cancelAnimationFrame(animationFrameId);
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  if (currentBlobUrl) {
    URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = null;
  }
  video.src = '';
  resetState();

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    
    isProcessing = true;
    isCameraMode = true;
    btnCamera.textContent = '停止';
    controllerArea.style.opacity = '0.3';
    controllerArea.style.pointerEvents = 'none';
    loop();
  } catch (err) {
    alert('カメラエラー: ' + err.message);
  }
});

// 動画読み込み
inputFile.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (animationFrameId) cancelAnimationFrame(animationFrameId);
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  if (currentBlobUrl) {
    URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = null;
  }
  video.pause();
  resetState();

  isCameraMode = false;
  btnCamera.textContent = 'カメラ';
  controllerArea.style.opacity = '1';
  controllerArea.style.pointerEvents = 'auto';

  currentBlobUrl = URL.createObjectURL(file);
  video.src = currentBlobUrl;
  video.load();

  const onCanPlay = () => {
    video.removeEventListener('canplay', onCanPlay);
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    isProcessing = true;
    btnPlayPause.textContent = '再生';
    video.currentTime = 0.001;
    loop();
  };

  video.addEventListener('canplay', onCanPlay);
  inputFile.value = '';
});
</script>
