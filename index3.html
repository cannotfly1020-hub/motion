<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>単眼カメラ動作分析 & 関節トルク解析</title>
  <!-- MediaPipe Pose CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: #121212;
      color: #e0e0e0;
      box-sizing: border-box;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h3 {
      margin: 4px 0 8px;
      font-size: 18px;
      text-align: center;
    }
    .controls {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 8px;
    }
    .input-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }
    .input-row input {
      background: #2a2a2a;
      border: 1px solid #555;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
      width: 60px;
      text-align: center;
      font-size: 14px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
    }
    .btn-primary { background: #0070f3; color: #fff; }
    .btn-secondary { background: #333; color: #fff; border: 1px solid #555; }
    .viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .card {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .card .title {
      font-size: 11px;
      color: #888;
      margin-bottom: 2px;
    }
    .card .value {
      font-size: 18px;
      font-weight: bold;
    }
    .chart-container {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 8px;
      height: 180px;
    }
  </style>
</head>
<body>

<div class="container">
  <h3>下肢バイオメカニクス解析</h3>
  
  <div class="controls">
    <div class="input-row">
      <label>体重 (kg): <input type="number" id="inputMass" value="70"></label>
      <label>身長 (cm): <input type="number" id="inputHeight" value="175"></label>
    </div>
    <div class="btn-row">
      <button id="btnCamera" class="btn btn-primary">カメラ起動</button>
      <label class="btn btn-secondary" style="display: flex; justify-content: center; align-items: center; margin: 0;">
        動画を選択
        <input type="file" id="inputFile" accept="video/*" style="display: none;">
      </label>
    </div>
  </div>

  <div class="viewport">
    <video id="videoElement" playsinline muted autoplay style="display: none;"></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <div class="dashboard">
    <div class="card">
      <div class="title">垂直床反力 (GRF-Y)</div>
      <div class="value" id="valGrfY" style="color: #4ade80;">0 N</div>
    </div>
    <div class="card">
      <div class="title">足関節トルク</div>
      <div class="value" id="valAnkle" style="color: #60a5fa;">0 N·m</div>
    </div>
    <div class="card">
      <div class="title">膝関節トルク</div>
      <div class="value" id="valKnee" style="color: #f87171;">0 N·m</div>
    </div>
    <div class="card">
      <div class="title">股関節トルク</div>
      <div class="value" id="valHip" style="color: #fbbf24;">0 N·m</div>
    </div>
  </div>

  <div class="chart-container">
    <canvas id="torqueChart"></canvas>
  </div>
</div>

<script>
const video = document.getElementById('videoElement');
const canvas = document.getElementById('outputCanvas');
const ctx = canvas.getContext('2d');
const btnCamera = document.getElementById('btnCamera');
const inputFile = document.getElementById('inputFile');

let isProcessing = false;
let isVideoFileMode = false;
let animationFrameId = null;

// Dempster身体セグメント比率
const BSIP = { trunk: 0.678, thigh: 0.100, shank: 0.046, foot: 0.014 };
let prevCoM = null, prevVelCoM = null, prevTime = null;
let filteredGRF = { x: 0, y: 0 };
const LPF_ALPHA = 0.35;
const GRAVITY = 9.81;

// Chart.js 初期化
const maxPoints = 50;
const torqueChart = new Chart(document.getElementById('torqueChart').getContext('2d'), {
  type: 'line',
  data: {
    labels: Array(maxPoints).fill(''),
    datasets: [
      { label: '足関節', borderColor: '#60a5fa', data: Array(maxPoints).fill(0), borderWidth: 2, pointRadius: 0 },
      { label: '膝関節', borderColor: '#f87171', data: Array(maxPoints).fill(0), borderWidth: 2, pointRadius: 0 },
      { label: '股関節', borderColor: '#fbbf24', data: Array(maxPoints).fill(0), borderWidth: 2, pointRadius: 0 }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    scales: { y: { grid: { color: '#333' } }, x: { display: false } },
    plugins: { legend: { labels: { color: '#ccc', boxWidth: 12 } } }
  }
});

// MediaPipe Pose 初期化
const pose = new Pose({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});
pose.setOptions({
  modelComplexity: 1,
  smoothLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});
pose.onResults(onResults);

function onResults(results) {
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

  if (!results.poseLandmarks) {
    ctx.restore();
    return;
  }

  const lm = results.poseLandmarks;
  const mass = parseFloat(document.getElementById('inputMass').value) || 70;
  const heightM = (parseFloat(document.getElementById('inputHeight').value) || 175) / 100.0;
  const now = performance.now() / 1000.0;

  const pxBodyHeight = Math.abs(lm[0].y - (lm[27].y + lm[28].y) / 2) * canvas.height;
  const meterPerPixel = (heightM * 0.85) / (pxBodyHeight || 1);

  const getPoint = (idx) => ({
    x: lm[idx].x * canvas.width * meterPerPixel,
    y: (1.0 - lm[idx].y) * canvas.height * meterPerPixel
  });

  const shoulder = getPoint(12);
  const hip = getPoint(24);
  const knee = getPoint(26);
  const ankle = getPoint(28);
  const toe = getPoint(32);

  const comTrunk = { x: (shoulder.x + hip.x) * 0.5, y: (shoulder.y + hip.y) * 0.5 };
  const comThigh = { x: hip.x * 0.433 + knee.x * 0.567, y: hip.y * 0.433 + knee.y * 0.567 };
  const comShank = { x: knee.x * 0.433 + ankle.x * 0.567, y: knee.y * 0.433 + ankle.y * 0.567 };
  const comFoot  = { x: (ankle.x + toe.x) * 0.5, y: (ankle.y + toe.y) * 0.5 };

  const currentCoM = {
    x: BSIP.trunk * comTrunk.x + 2 * (BSIP.thigh * comThigh.x + BSIP.shank * comShank.x + BSIP.foot * comFoot.x),
    y: BSIP.trunk * comTrunk.y + 2 * (BSIP.thigh * comThigh.y + BSIP.shank * comShank.y + BSIP.foot * comFoot.y)
  };

  let grf = { x: 0, y: 0 };
  if (prevCoM && prevTime) {
    const dt = Math.max(now - prevTime, 0.001);
    const velCoM = {
      x: (currentCoM.x - prevCoM.x) / dt,
      y: (currentCoM.y - prevCoM.y) / dt
    };

    if (prevVelCoM) {
      const accCoM = {
        x: (velCoM.x - prevVelCoM.x) / dt,
        y: (velCoM.y - prevVelCoM.y) / dt
      };
      const rawGrfX = mass * accCoM.x;
      const rawGrfY = Math.max(0, mass * (accCoM.y + GRAVITY));

      filteredGRF.x = filteredGRF.x * (1 - LPF_ALPHA) + rawGrfX * LPF_ALPHA;
      filteredGRF.y = filteredGRF.y * (1 - LPF_ALPHA) + rawGrfY * LPF_ALPHA;
      grf = filteredGRF;
    }
    prevVelCoM = velCoM;
  }
  prevCoM = currentCoM;
  prevTime = now;

  const cop = comFoot;
  const rAnkle = { x: cop.x - ankle.x, y: cop.y - ankle.y };
  const rKnee  = { x: cop.x - knee.x,  y: cop.y - knee.y };
  const rHip   = { x: cop.x - hip.x,   y: cop.y - hip.y };

  const torqueAnkle = (rAnkle.x * grf.y - rAnkle.y * grf.x);
  const torqueKnee  = (rKnee.x * grf.y - rKnee.y * grf.x);
  const torqueHip   = (rHip.x * grf.y - rHip.y * grf.x);

  document.getElementById('valGrfY').textContent = `${Math.round(grf.y)} N`;
  document.getElementById('valAnkle').textContent = `${torqueAnkle.toFixed(1)} N·m`;
  document.getElementById('valKnee').textContent = `${torqueKnee.toFixed(1)} N·m`;
  document.getElementById('valHip').textContent = `${torqueHip.toFixed(1)} N·m`;

  const d = torqueChart.data.datasets;
  d[0].data.push(torqueAnkle); d[0].data.shift();
  d[1].data.push(torqueKnee);  d[1].data.shift();
  d[2].data.push(torqueHip);   d[2].data.shift();
  torqueChart.update('none');

  drawOverlay(lm, cop, grf, meterPerPixel);
  ctx.restore();
}

function drawOverlay(lm, cop, grf, meterPerPixel) {
  // 骨格
  ctx.strokeStyle = '#00e5ff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(lm[24].x * canvas.width, lm[24].y * canvas.height);
  ctx.lineTo(lm[26].x * canvas.width, lm[26].y * canvas.height);
  ctx.lineTo(lm[28].x * canvas.width, lm[28].y * canvas.height);
  ctx.lineTo(lm[32].x * canvas.width, lm[32].y * canvas.height);
  ctx.stroke();

  // GRFベクトル
  const copPxX = cop.x / meterPerPixel;
  const copPxY = canvas.height - (cop.y / meterPerPixel);
  ctx.strokeStyle = '#4ade80';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(copPxX, copPxY);
  ctx.lineTo(copPxX + grf.x * 0.2, copPxY - grf.y * 0.2);
  ctx.stroke();
}

// 毎フレームのループ処理
async function processLoop() {
  if (video.paused || video.ended) return;
  await pose.send({ image: video });
  animationFrameId = requestAnimationFrame(processLoop);
}

// 1. カメラ起動 (iOS対応)
btnCamera.addEventListener('click', async () => {
  if (isProcessing && !isVideoFileMode) {
    location.reload();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    btnCamera.textContent = '停止';
    btnCamera.style.background = '#dc2626';
    isProcessing = true;
    isVideoFileMode = false;
    processLoop();
  } catch (err) {
    alert('カメラへのアクセスが拒否されたか、対応していません: ' + err.message);
  }
});

// 2. 写真ライブラリ/ファイルからの動画選択
inputFile.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (animationFrameId) cancelAnimationFrame(animationFrameId);
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }

  const url = URL.createObjectURL(file);
  video.src = url;
  video.loop = true;
  video.play().then(() => {
    isProcessing = true;
    isVideoFileMode = true;
    btnCamera.textContent = '停止';
    btnCamera.style.background = '#dc2626';
    processLoop();
  });
});
</script>
</body>
</html>
