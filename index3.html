<!DOCTYPE html>
<html lang="ja">
<head>

<title>下肢バイオメカニクス分析 - 動作分析Pro</title>

<!-- MediaPipe Pose の読み込み -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<style>
 * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
 html, body { width: 100%; height: 100dvh; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
 
 #header { width: 100%; background: #1c1c1e; padding-top: calc(6px + env(safe-area-inset-top)); padding-left: calc(8px + env(safe-area-inset-left)); padding-right: calc(8px + env(safe-area-inset-right)); padding-bottom: 6px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #333; z-index: 30; flex-shrink: 0; }
 .header-top-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
 .btn-group-header { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
 
 .hdr-btn { -webkit-appearance: none; appearance: none; background: #007aff; color: white; border: none; padding: 5px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
 .hdr-btn.secondary { background: #3a3a3c; }
 .hdr-btn.fps-badge { background: #30d158; color: #000; font-size: 10px; }
 .hdr-btn.rec-btn { background: #ff3b30; color: #fff; }
 .hdr-btn.rec-active { background: #ff453a; animation: blink 1s infinite; }
 .hdr-btn.roi-active { background: #ff9500 !important; color: #000 !important; font-weight: bold; }
 @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
 
 #body-info-text { font-size: 10px; color: #ff9500; font-weight: 600; white-space: nowrap; flex-shrink: 0; padding: 4px 6px; background: #262629; border: 1px solid #3a3a3c; border-radius: 6px; cursor: pointer; }
 
 #result-box { width: 100%; background: #262629; border-radius: 6px; padding: 5px 8px; border: 1px solid #3a3a3c; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
 .result-text-area { flex: 1; min-width: 0; }
 #main-result { color: #00ffcc; font-size: 12px; font-weight: bold; line-height: 1.2; }
 #sub-result { color: #aaa; font-size: 10px; margin-top: 2px; font-weight: 500; line-height: 1.2; }

 #stage { width: 100%; position: relative; flex: 1; min-height: 0; display: flex; background: #000; overflow: hidden; }
 .video-pane { position: relative; flex: 1; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
 .zoom-target { width: 100%; height: 100%; position: relative; transform-origin: center center; }
 video { width: 100%; height: 100%; object-fit: contain; display: block; }
 canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
 
 #outputCanvas { z-index: 1; pointer-events: none; }
 #interactionCanvas { z-index: 10; touch-action: none; cursor: crosshair; }

 .hud-overlay { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; pointer-events: none; z-index: 20; }
 .hud-badge { background: rgba(0, 0, 0, 0.75); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; border: 1px solid #444; }
 .hud-r { color: #00e5ff; border-left: 3px solid #00e5ff; }
 .hud-l { color: #ffd60a; border-left: 3px solid #ffd60a; }

 #controls { width: 100%; background: #1c1c1e; padding-top: 5px; padding-left: calc(8px + env(safe-area-inset-left)); padding-right: calc(8px + env(safe-area-inset-right)); padding-bottom: calc(6px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 5px; border-top: 1px solid #333; z-index: 30; flex-shrink: 0; }
 .seek-container { display: flex; flex-direction: column; gap: 3px; width: 100%; }
 .seek-row { display: flex; align-items: center; gap: 6px; width: 100%; }
 .seek-label { font-size: 10px; font-weight: bold; color: #007aff; width: 14px; flex-shrink: 0; text-align: center; }
 input[type=range] { flex: 1; height: 18px; accent-color: #007aff; }

 .mode-grid { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
 button.ctrl-btn { -webkit-appearance: none; appearance: none; width: 100%; padding: 6px 0; background: #2c2c2e; color: white; border: none; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; }
 button.ctrl-btn:active { background: #444; }
 button.mode-active { background: #007aff; color: white; font-weight: bold; }

 .dashboard-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
 .side-box { background: #262629; border-radius: 6px; padding: 4px 6px; border: 1px solid #3a3a3c; }
 .side-box.right { border-top: 2px solid #00e5ff; }
 .side-box.left { border-top: 2px solid #ffd60a; }
 .side-title { font-size: 10px; font-weight: bold; text-align: center; margin-bottom: 2px; }
 .metric-row { display: flex; justify-content: space-between; font-size: 9.5px; padding: 1px 0; color: #ccc; }
 .metric-val { font-weight: bold; font-family: monospace; }

 .playback-row { width: 100%; display: grid; grid-template-columns: 1fr 1.3fr 1fr 0.9fr 1fr; gap: 4px; }
 #btnPlayPause { background: #34c759; color: #000; font-weight: bold; }

 .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
 .modal-card { background: #2c2c2e; border: 1px solid #444; border-radius: 12px; width: 90%; max-width: 340px; padding: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
 .modal-card h3 { font-size: 15px; margin-bottom: 6px; color: #ff9500; }
 .modal-card p { font-size: 12px; color: #ccc; margin-bottom: 12px; }
 .modal-input-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 10px; }
 .modal-input-row input { width: 90px; font-size: 15px; padding: 6px; text-align: center; border-radius: 6px; border: 1px solid #555; background: #1c1c1e; color: #fff; }
 .modal-btn-row { display: flex; gap: 8px; margin-top: 14px; }
 .modal-btn-row button { -webkit-appearance: none; appearance: none; flex: 1; padding: 8px 0; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
 #snapshot-img { max-width: 100%; max-height: 50vh; border-radius: 6px; border: 1px solid #555; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="header">
 <div class="header-top-row">
 <div class="btn-group-header">
 <button class="hdr-btn" onclick="document.getElementById('inputFile').click()">動画選択</button>
 <input type="file" id="inputFile" accept="video/*" style="display:none;">
 <button class="hdr-btn fps-badge" id="btnFps" onclick="toggleFPS()">30fps</button>
 <button class="hdr-btn secondary" id="btnToggleRoi" onclick="toggleRoiMode()">🔲 対象者指定</button>
 <button class="hdr-btn" style="background:#5856d6;" onclick="captureSnapshot()">📸 静止画</button>
 <button class="hdr-btn rec-btn" id="btnRecord" onclick="toggleRecording()">🎥 録画開始</button>
 </div>
 <span id="body-info-text" onclick="openBodyModal()">47kg/140cm ⚙️</span>
 </div>
 <div id="result-box">
 <div class="result-text-area">
 <div id="main-result">動画を選択してください</div>
 <div id="sub-result">下肢関節モーメント & 床反力ベクトルをリアルタイム解析</div>
 </div>
 </div>
</div>

<div id="stage">
 <div class="video-pane" id="viewportArea">
 <div class="zoom-target" id="zoomTarget">
 <video id="videoElement" playsinline webkit-playsinline muted preload="auto" crossorigin="anonymous"></video>
 <canvas id="outputCanvas"></canvas>
 <canvas id="interactionCanvas"></canvas>
 </div>
 <div class="hud-overlay">
 <div class="hud-badge hud-r">右膝: <span id="hud_r_knee">0.0</span> N·m</div>
 <div class="hud-badge hud-l">左膝: <span id="hud_l_knee">0.0</span> N·m</div>
 </div>
 </div>
</div>

<div id="controls">
 <div class="seek-container">
 <div class="seek-row">
 <span class="seek-label">①</span>
 <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.05">
 </div>
 </div>

 <div class="mode-grid">
 <button class="ctrl-btn" id="btnModeZoom" onclick="toggleZoomMode()">🔍 ズーム</button>
 <button class="ctrl-btn" id="btnClearRoi" onclick="clearRoi()">🔲 枠クリア</button>
 </div>

 <!-- ズーム操作バー -->
 <div id="zoom-controls" style="display:none; width:100%; align-items:center; gap:8px;">
 <span style="font-size:11px; font-weight:bold; color:#007aff; white-space:nowrap;">倍率</span>
 <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1">
 <button class="ctrl-btn" style="width:auto; padding:4px 10px; background:#444;" onclick="resetZoom()">リセット</button>
 </div>

 <div class="dashboard-grid">
 <div class="side-box right">
 <div class="side-title" style="color:#00e5ff;">右脚 (Right)</div>
 <div class="metric-row"><span>床反力:</span><span id="r_grf" class="metric-val" style="color:#4ade80;">0 N</span></div>
 <div class="metric-row"><span>足関節:</span><span id="r_ankle" class="metric-val" style="color:#60a5fa;">0.0 N·m</span></div>
 <div class="metric-row"><span>膝関節:</span><span id="r_knee" class="metric-val" style="color:#38bdf8;">0.0 N·m</span></div>
 <div class="metric-row"><span>股関節:</span><span id="r_hip" class="metric-val" style="color:#818cf8;">0.0 N·m</span></div>
 </div>

 <div class="side-box left">
 <div class="side-title" style="color:#ffd60a;">左脚 (Left)</div>
 <div class="metric-row"><span>床反力:</span><span id="l_grf" class="metric-val" style="color:#4ade80;">0 N</span></div>
 <div class="metric-row"><span>足関節:</span><span id="l_ankle" class="metric-val" style="color:#fb923c;">0.0 N·m</span></div>
 <div class="metric-row"><span>膝関節:</span><span id="l_knee" class="metric-val" style="color:#f87171;">0.0 N·m</span></div>
 <div class="metric-row"><span>股関節:</span><span id="l_hip" class="metric-val" style="color:#fbbf24;">0.0 N·m</span></div>
 </div>
 </div>

 <div class="playback-row">
 <button class="ctrl-btn" id="btnStepBack">◀ -1</button>
 <button class="ctrl-btn" id="btnPlayPause">▶ 再生</button>
 <button class="ctrl-btn" id="btnStepForward">+1 ▶</button>
 <button class="ctrl-btn" id="btnSpeed" onclick="togglePlaybackRate()">1.0x</button>
 <button class="ctrl-btn" id="btnResetView" onclick="resetZoom()">1x 表示</button>
 </div>
</div>

<div id="body-modal-overlay" class="modal-overlay">
 <div class="modal-card">
 <h3>身体パラメータ設定</h3>
 <p>モーメントおよび床反力計算の基準値を入力</p>
 <div class="modal-input-row">
 <label style="font-size:12px; width:45px;">体重:</label>
 <input type="number" id="inputMass" value="47">
 <span style="font-size:13px; font-weight:bold; width:30px;">kg</span>
 </div>
 <div class="modal-input-row">
 <label style="font-size:12px; width:45px;">身長:</label>
 <input type="number" id="inputHeight" value="140">
 <span style="font-size:13px; font-weight:bold; width:30px;">cm</span>
 </div>
 <div class="modal-btn-row">
 <button style="background:#444; color:#fff;" onclick="closeBodyModal()">完了</button>
 </div>
 </div>
</div>

<div id="snapshot-modal-overlay" class="modal-overlay">
 <div class="modal-card" style="max-width:360px;">
 <h3 style="color:#5856d6;">📸 静止画キャプチャ</h3>
 <p style="font-size:11px; color:#aaa;">画像を長押しして「写真に追加」で保存できます</p>
 <img id="snapshot-img" src="" alt="Screenshot">
 <div class="modal-btn-row">
 <button style="background:#444; color:#fff;" onclick="closeSnapshotModal()">閉じる</button>
 </div>
 </div>
</div>

<script>
const video = document.getElementById('videoElement');
const outputCanvas = document.getElementById('outputCanvas');
const outCtx = outputCanvas.getContext('2d');
const interactionCanvas = document.getElementById('interactionCanvas');
const intCtx = interactionCanvas.getContext('2d');
const zoomTarget = document.getElementById('zoomTarget');

const btnToggleRoi = document.getElementById('btnToggleRoi');
const inputFile = document.getElementById('inputFile');
const seekSlider = document.getElementById('seekSlider');
const btnPlayPause = document.getElementById('btnPlayPause');
const btnStepBack = document.getElementById('btnStepBack');
const btnStepForward = document.getElementById('btnStepForward');
const btnFps = document.getElementById('btnFps');
const btnRecord = document.getElementById('btnRecord');
const btnSpeed = document.getElementById('btnSpeed');
const bodyInfoText = document.getElementById('body-info-text');

const btnModeZoom = document.getElementById('btnModeZoom');
const zoomControls = document.getElementById('zoom-controls');
const zoomSlider = document.getElementById('zoom-slider');

const inputMass = document.getElementById('inputMass');
const inputHeight = document.getElementById('inputHeight');

let isProcessing = false;
let isBusy = false;
let animationFrameId = null;
let currentBlobUrl = null;

let currentFPS = 30.0;
const fpsList = [30, 60, 120, 240];
let fpsIdx = 0;

const playbackRates = [1.0, 0.5, 0.25];
let currentRateIdx = 0;

// ズーム & パン管理
let isZoomMode = false;
let zoomScale = 1.0;
let panOffsetX = 0, panOffsetY = 0;
let isPanning = false;
let panStartX = 0, panStartY = 0;

// ROI（患者さん枠）
let isRoiMode = false;
let isRoiDrawing = false;
let isRoiEnabled = false;
let roiStart = { x: 0, y: 0 };
let roiNorm = { x: 0.2, y: 0.1, w: 0.6, h: 0.8 };
const roiCanvas = document.createElement('canvas');
const roiCtx = roiCanvas.getContext('2d');

let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
let recordCanvas = null;
let recordCtx = null;
let recordAnimId = null;

// 力学計算用の変数と定数
const BSIP = { trunk: 0.678, thigh: 0.100, shank: 0.046, foot: 0.014 };
let prevCoM = null, prevVelCoM = null;
let filteredGRF = { x: 0, y: 0 };
const LPF_ALPHA = 0.15; // 力の平滑化フィルタ係数
const GRAVITY = 9.81; // 必須の重力加速度
let comHistory = []; // 重心座標の移動平均用

// タイムラインを飛ばした時に物理演算のバグを防ぐリセット関数
function resetPhysics() {
  prevCoM = null;
  prevVelCoM = null;
  filteredGRF = { x: 0, y: 0 };
  comHistory = [];
}

const pose = new Pose({
 locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});
pose.setOptions({
 modelComplexity: 1,
 smoothLandmarks: true,
 minDetectionConfidence: 0.6,
 minTrackingConfidence: 0.6
});
pose.onResults(onResults);

function fitCanvases() {
 const rect = video.parentElement.getBoundingClientRect();
 if (rect.width > 0 && rect.height > 0) {
 [outputCanvas, interactionCanvas].forEach(c => {
 c.width = rect.width;
 c.height = rect.height;
 });
 }
 redrawOverlay();
}
window.addEventListener('resize', fitCanvases);

function toggleFPS() {
 fpsIdx = (fpsIdx + 1) % fpsList.length;
 currentFPS = fpsList[fpsIdx];
 btnFps.innerText = `${currentFPS}fps`;
}

function togglePlaybackRate() {
 currentRateIdx = (currentRateIdx + 1) % playbackRates.length;
 const rate = playbackRates[currentRateIdx];
 video.playbackRate = rate;
 btnSpeed.innerText = `${rate}x`;
}

function openBodyModal() { document.getElementById('body-modal-overlay').style.display = 'flex'; }
function closeBodyModal() {
 document.getElementById('body-modal-overlay').style.display = 'none';
 bodyInfoText.innerText = `${inputMass.value}kg/${inputHeight.value}cm ⚙️`;
}

function toggleZoomMode() {
 isZoomMode = !isZoomMode;
 if (isZoomMode) {
 isRoiMode = false;
 btnToggleRoi.classList.remove('roi-active');
 btnModeZoom.classList.add('mode-active');
 zoomControls.style.display = 'flex';
 document.getElementById('main-result').innerHTML = "🔍 ズーム操作中（スライダーまたは画面ドラッグで移動）";
 } else {
 btnModeZoom.classList.remove('mode-active');
 zoomControls.style.display = 'none';
 document.getElementById('main-result').innerHTML = "解析待機中";
 }
}

function applyZoom() {
 zoomTarget.style.transform = `translate(${panOffsetX}px, ${panOffsetY}px) scale(${zoomScale})`;
 redrawSkeletons();
 redrawOverlay();
}

function resetZoom() {
 zoomScale = 1.0;
 panOffsetX = 0;
 panOffsetY = 0;
 zoomSlider.value = 1.0;
 applyZoom();
}

zoomSlider.addEventListener('input', (e) => {
 zoomScale = parseFloat(e.target.value);
 if (zoomScale === 1.0) { panOffsetX = 0; panOffsetY = 0; }
 applyZoom();
});

function toggleRoiMode() {
 isRoiMode = !isRoiMode;
 if (isRoiMode) {
 isZoomMode = false;
 btnModeZoom.classList.remove('mode-active');
 zoomControls.style.display = 'none';
 btnToggleRoi.classList.add('roi-active');
 document.getElementById('main-result').innerHTML = "🔲 画面をドラッグして対象者を四角く囲んでください";
 document.getElementById('sub-result').innerHTML = "囲んだ枠内のみをAIが追跡します（背景の人物を除外）";
 } else {
 btnToggleRoi.classList.remove('roi-active');
 document.getElementById('main-result').innerHTML = "解析待機中";
 document.getElementById('sub-result').innerHTML = "下肢関節モーメント & 床反力ベクトルをリアルタイム解析";
 }
 redrawOverlay();
}

function clearRoi() {
 isRoiEnabled = false;
 isRoiMode = false;
 btnToggleRoi.classList.remove('roi-active');
 redrawOverlay();
 renderCurrentFrame();
}

function getPointerNorm(e) {
 const rect = interactionCanvas.getBoundingClientRect();
 const clickRelX = e.clientX - (rect.left + rect.width / 2);
 const clickRelY = e.clientY - (rect.top + rect.height / 2);
 const targetRelX = (clickRelX - panOffsetX) / zoomScale;
 const targetRelY = (clickRelY - panOffsetY) / zoomScale;
 const cvsX = targetRelX + interactionCanvas.width / 2;
 const cvsY = targetRelY + interactionCanvas.height / 2;

 return {
 x: Math.max(0, Math.min(1.0, cvsX / interactionCanvas.width)),
 y: Math.max(0, Math.min(1.0, cvsY / interactionCanvas.height))
 };
}

interactionCanvas.addEventListener('pointerdown', (e) => {
 e.preventDefault();
 if (isRoiMode) {
 isRoiDrawing = true;
 const p = getPointerNorm(e);
 roiStart = p;
 roiNorm = { x: p.x, y: p.y, w: 0, h: 0 };
 isRoiEnabled = true;
 try { interactionCanvas.setPointerCapture(e.pointerId); } catch(err){}
 redrawOverlay();
 return;
 }

 if (isZoomMode || zoomScale > 1.0) {
 isPanning = true;
 panStartX = e.clientX - panOffsetX;
 panStartY = e.clientY - panOffsetY;
 try { interactionCanvas.setPointerCapture(e.pointerId); } catch(err){}
 }
});

interactionCanvas.addEventListener('pointermove', (e) => {
 if (isRoiDrawing && isRoiMode) {
 const p = getPointerNorm(e);
 roiNorm.x = Math.min(roiStart.x, p.x);
 roiNorm.y = Math.min(roiStart.y, p.y);
 roiNorm.w = Math.abs(p.x - roiStart.x);
 roiNorm.h = Math.abs(p.y - roiStart.y);
 redrawOverlay();
 return;
 }

 if (isPanning && (isZoomMode || zoomScale > 1.0)) {
 panOffsetX = e.clientX - panStartX;
 panOffsetY = e.clientY - panStartY;
 applyZoom();
 }
});

interactionCanvas.addEventListener('pointerup', (e) => {
 if (isRoiDrawing) {
 isRoiDrawing = false;
 try { interactionCanvas.releasePointerCapture(e.pointerId); } catch(err){}
 toggleRoiMode();
 renderCurrentFrame();
 }
 if (isPanning) {
 isPanning = false;
 try { interactionCanvas.releasePointerCapture(e.pointerId); } catch(err){}
 }
});

function redrawOverlay() {
 intCtx.clearRect(0, 0, interactionCanvas.width, interactionCanvas.height);
 if (!isRoiEnabled) return;

 const rx = roiNorm.x * interactionCanvas.width;
 const ry = roiNorm.y * interactionCanvas.height;
 const rw = roiNorm.w * interactionCanvas.width;
 const rh = roiNorm.h * interactionCanvas.height;

 if (rw < 5 || rh < 5) return;

 intCtx.save();
 intCtx.fillStyle = 'rgba(0, 0, 0, 0.35)';
 intCtx.fillRect(0, 0, interactionCanvas.width, interactionCanvas.height);
 intCtx.clearRect(rx, ry, rw, rh);

 intCtx.strokeStyle = '#ff9500';
 intCtx.lineWidth = 2.5 / zoomScale;
 intCtx.setLineDash([6 / zoomScale, 4 / zoomScale]);
 intCtx.strokeRect(rx, ry, rw, rh);

 const badgeH = 18 / zoomScale;
 const badgeW = 70 / zoomScale;
 intCtx.fillStyle = '#ff9500';
 intCtx.fillRect(rx, Math.max(0, ry - badgeH), badgeW, badgeH);
 intCtx.fillStyle = '#000';
 intCtx.font = `bold ${Math.max(8, 10 / zoomScale)}px sans-serif`;
 intCtx.fillText("🎯 追跡エリア", rx + (4 / zoomScale), Math.max(12 / zoomScale, ry - (5 / zoomScale)));
 intCtx.restore();
}

let lastLandmarks = null;
let lastGrfR = { x: 0, y: 0 }, lastMagR = 0;
let lastGrfL = { x: 0, y: 0 }, lastMagL = 0;

function onResults(results) {
 if (!results.poseLandmarks) {
 lastLandmarks = null;
 outCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
 return;
 }

 const rawLm = results.poseLandmarks;
 const lm = rawLm.map(p => {
 if (isRoiEnabled && roiNorm.w > 0.05 && roiNorm.h > 0.05) {
 return {
 x: roiNorm.x + p.x * roiNorm.w,
 y: roiNorm.y + p.y * roiNorm.h,
 z: p.z
 };
 }
 return p;
 });

 lastLandmarks = lm;

 const mass = parseFloat(inputMass.value) || 47;
 const heightM = (parseFloat(inputHeight.value) || 140) / 100.0;

 const pxBodyHeight = Math.abs(lm[0].y - (lm[27].y + lm[28].y) / 2) * outputCanvas.height;
 const meterPerPixel = (heightM * 0.85) / (pxBodyHeight || 1);

 const getPoint = (idx) => ({
 x: lm[idx].x * outputCanvas.width * meterPerPixel,
 y: (1.0 - lm[idx].y) * outputCanvas.height * meterPerPixel
 });

 const shoulderR = getPoint(12), shoulderL = getPoint(11);
 const hipR = getPoint(24), hipL = getPoint(23);
 const kneeR = getPoint(26), kneeL = getPoint(25);
 const ankleR = getPoint(28), ankleL = getPoint(27);
 const toeR = getPoint(32), toeL = getPoint(31);

 const comTrunk = { x: (shoulderR.x + hipR.x + shoulderL.x + hipL.x) * 0.25, y: (shoulderR.y + hipR.y + shoulderL.y + hipL.y) * 0.25 };
 const comThighR = { x: hipR.x * 0.433 + kneeR.x * 0.567, y: hipR.y * 0.433 + kneeR.y * 0.567 };
 const comShankR = { x: kneeR.x * 0.433 + ankleR.x * 0.567, y: kneeR.y * 0.433 + ankleR.y * 0.567 };
 const comFootR = { x: (ankleR.x + toeR.x) * 0.5, y: (ankleR.y + toeR.y) * 0.5 };

 const comThighL = { x: hipL.x * 0.433 + kneeL.x * 0.567, y: hipL.y * 0.433 + kneeL.y * 0.567 };
 const comShankL = { x: kneeL.x * 0.433 + ankleL.x * 0.567, y: kneeL.y * 0.433 + ankleL.y * 0.567 };
 const comFootL = { x: (ankleL.x + toeL.x) * 0.5, y: (ankleL.y + toeL.y) * 0.5 };

 const currentCoM = {
 x: BSIP.trunk * comTrunk.x + BSIP.thigh * (comThighR.x + comThighL.x) + BSIP.shank * (comShankR.x + comShankL.x) + BSIP.foot * (comFootR.x + comFootL.x),
 y: BSIP.trunk * comTrunk.y + BSIP.thigh * (comThighR.y + comThighL.y) + BSIP.shank * (comShankR.y + comShankL.y) + BSIP.foot * (comFootR.y + comFootL.y)
 };

 // 1. 重心座標の移動平均（ノイズ除去）
 comHistory.push(currentCoM);
 if (comHistory.length > 5) comHistory.shift(); 
 
 const avgCoM = { x: 0, y: 0 };
 for(let p of comHistory) { avgCoM.x += p.x; avgCoM.y += p.y; }
 avgCoM.x /= comHistory.length;
 avgCoM.y /= comHistory.length;

 let totalGrf = { x: 0, y: mass * GRAVITY };
 if (prevCoM) {
   // 2. ブラウザの時間ではなく設定したFPSを基準に固定時間を算出
   const fixedDt = 1.0 / currentFPS; 
   
   const velCoM = { 
     x: (avgCoM.x - prevCoM.x) / fixedDt, 
     y: (avgCoM.y - prevCoM.y) / fixedDt 
   };

   if (prevVelCoM) {
     const accCoM = { 
       x: (velCoM.x - prevVelCoM.x) / fixedDt, 
       y: (velCoM.y - prevVelCoM.y) / fixedDt 
     };
     const rawGrfX = mass * accCoM.x;
     const rawGrfY = Math.max(0, mass * (accCoM.y + GRAVITY));

     // 3. フィルタリングで動きを滑らかに
     filteredGRF.x = filteredGRF.x * (1 - LPF_ALPHA) + rawGrfX * LPF_ALPHA;
     filteredGRF.y = filteredGRF.y * (1 - LPF_ALPHA) + rawGrfY * LPF_ALPHA;
     totalGrf = filteredGRF;
   }
   prevVelCoM = velCoM;
 }
 prevCoM = avgCoM; 

 // 4. 接地判定と重心距離ベースの動的な力分配
 const rContact = ankleR.y < ankleL.y + 0.08 ? 1.0 : 0.0;
 const lContact = ankleL.y < ankleR.y + 0.08 ? 1.0 : 0.0;

 let ratioR = 0;
 let ratioL = 0;

 if (rContact > 0 && lContact > 0) {
   // 両足接地時：重心のX座標の位置で力の割合を計算
   const distTotal = Math.abs(ankleL.x - ankleR.x);
   
   if (distTotal > 0.01) {
     const distToL = Math.abs(avgCoM.x - ankleL.x);
     const distToR = Math.abs(avgCoM.x - ankleR.x);
     
     // 重心が近い方に多くの力を配分（逆比）
     let rawRatioR = distToL / (distToR + distToL);
     let rawRatioL = distToR / (distToR + distToL);
     
     // 重心が足幅の外に出た時のための安全処理
     ratioR = Math.max(0, Math.min(1.0, rawRatioR));
     ratioL = Math.max(0, Math.min(1.0, rawRatioL));
   } else {
     ratioR = 0.5;
     ratioL = 0.5;
   }
 } else {
   // 片足立ち、あるいは両足が浮いちょる時
   const sumContact = (rContact + lContact) || 1.0;
   ratioR = rContact / sumContact;
   ratioL = lContact / sumContact;
 }

 lastGrfR = { x: totalGrf.x * ratioR, y: totalGrf.y * ratioR };
 lastGrfL = { x: totalGrf.x * ratioL, y: totalGrf.y * ratioL };

 const torqueAnkleR = (comFootR.x - ankleR.x) * lastGrfR.y - (comFootR.y - ankleR.y) * lastGrfR.x;
 const torqueKneeR = (comFootR.x - kneeR.x) * lastGrfR.y - (comFootR.y - kneeR.y) * lastGrfR.x;
 const torqueHipR = (comFootR.x - hipR.x) * lastGrfR.y - (comFootR.y - hipR.y) * lastGrfR.x;

 const torqueAnkleL = (comFootL.x - ankleL.x) * lastGrfL.y - (comFootL.y - ankleL.y) * lastGrfL.x;
 const torqueKneeL = (comFootL.x - kneeL.x) * lastGrfL.y - (comFootL.y - kneeL.y) * lastGrfL.x;
 const torqueHipL = (comFootL.x - hipL.x) * lastGrfL.y - (comFootL.y - hipL.y) * lastGrfL.x;

 document.getElementById('hud_r_knee').textContent = torqueKneeR.toFixed(1);
 document.getElementById('hud_l_knee').textContent = torqueKneeL.toFixed(1);

 lastMagR = Math.hypot(lastGrfR.x, lastGrfR.y);
 lastMagL = Math.hypot(lastGrfL.x, lastGrfL.y);

 document.getElementById('r_grf').textContent = `${Math.round(lastMagR)} N`;
 document.getElementById('r_ankle').textContent = `${torqueAnkleR.toFixed(1)} N·m`;
 document.getElementById('r_knee').textContent = `${torqueKneeR.toFixed(1)} N·m`;
 document.getElementById('r_hip').textContent = `${torqueHipR.toFixed(1)} N·m`;

 document.getElementById('l_grf').textContent = `${Math.round(lastMagL)} N`;
 document.getElementById('l_ankle').textContent = `${torqueAnkleL.toFixed(1)} N·m`;
 document.getElementById('l_knee').textContent = `${torqueKneeL.toFixed(1)} N·m`;
 document.getElementById('l_hip').textContent = `${torqueHipL.toFixed(1)} N·m`;

 redrawSkeletons();
}

function redrawSkeletons() {
 outCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
 if (!lastLandmarks) return;
 const lm = lastLandmarks;

 outCtx.save();
 outCtx.strokeStyle = '#00e5ff';
 outCtx.lineWidth = 3.5 / zoomScale;
 outCtx.beginPath();
 outCtx.moveTo(lm[24].x * outputCanvas.width, lm[24].y * outputCanvas.height);
 outCtx.lineTo(lm[26].x * outputCanvas.width, lm[26].y * outputCanvas.height);
 outCtx.lineTo(lm[28].x * outputCanvas.width, lm[28].y * outputCanvas.height);
 outCtx.lineTo(lm[32].x * outputCanvas.width, lm[32].y * outputCanvas.height);
 outCtx.stroke();

 outCtx.strokeStyle = '#ffd60a';
 outCtx.lineWidth = 3.5 / zoomScale;
 outCtx.beginPath();
 outCtx.moveTo(lm[23].x * outputCanvas.width, lm[23].y * outputCanvas.height);
 outCtx.lineTo(lm[25].x * outputCanvas.width, lm[25].y * outputCanvas.height);
 outCtx.lineTo(lm[27].x * outputCanvas.width, lm[27].y * outputCanvas.height);
 outCtx.lineTo(lm[31].x * outputCanvas.width, lm[31].y * outputCanvas.height);
 outCtx.stroke();

 [24, 26, 28, 32].forEach(idx => {
 outCtx.fillStyle = '#00e5ff';
 outCtx.beginPath();
 outCtx.arc(lm[idx].x * outputCanvas.width, lm[idx].y * outputCanvas.height, 4.5 / zoomScale, 0, Math.PI * 2);
 outCtx.fill();
 });
 [23, 25, 27, 31].forEach(idx => {
 outCtx.fillStyle = '#ffd60a';
 outCtx.beginPath();
 outCtx.arc(lm[idx].x * outputCanvas.width, lm[idx].y * outputCanvas.height, 4.5 / zoomScale, 0, Math.PI * 2);
 outCtx.fill();
 });

 const rCopPxX = (lm[28].x + lm[32].x) * 0.5 * outputCanvas.width;
 const rCopPxY = (lm[28].y + lm[32].y) * 0.5 * outputCanvas.height;
 if (lastMagR > 25) drawDynamicForceArrow(rCopPxX, rCopPxY, lastGrfR.x, lastGrfR.y, lastMagR);

 const lCopPxX = (lm[27].x + lm[31].x) * 0.5 * outputCanvas.width;
 const lCopPxY = (lm[27].y + lm[31].y) * 0.5 * outputCanvas.height;
 if (lastMagL > 25) drawDynamicForceArrow(lCopPxX, lCopPxY, lastGrfL.x, lastGrfL.y, lastMagL);

 outCtx.restore();
}

function drawDynamicForceArrow(fromX, fromY, fx, fy, mag) {
 const scale = 0.28;
 const toX = fromX + fx * scale;
 const toY = fromY - fy * scale;
 const angle = Math.atan2(toY - fromY, toX - fromX);
 
 const headLen = Math.min(36, Math.max(14, mag * 0.045)) / zoomScale;
 const lineWidth = Math.min(12, Math.max(3.5, mag * 0.015)) / zoomScale;

 let color = '#38bdf8';
 if (mag > 900) color = '#ff1744';
 else if (mag > 600) color = '#ff9100';
 else if (mag > 300) color = '#00e676';

 outCtx.save();
 outCtx.strokeStyle = color;
 outCtx.fillStyle = color;
 outCtx.lineWidth = lineWidth;
 outCtx.lineCap = 'round';
 outCtx.lineJoin = 'round';

 outCtx.beginPath();
 outCtx.moveTo(fromX, fromY);
 outCtx.lineTo(toX, toY);
 outCtx.stroke();

 outCtx.beginPath();
 outCtx.moveTo(toX, toY);
 outCtx.lineTo(toX - headLen * Math.cos(angle - Math.PI / 5), toY - headLen * Math.sin(angle - Math.PI / 5));
 outCtx.lineTo(toX - (headLen * 0.6) * Math.cos(angle), toY - (headLen * 0.6) * Math.sin(angle));
 outCtx.lineTo(toX - headLen * Math.cos(angle + Math.PI / 5), toY - headLen * Math.sin(angle + Math.PI / 5));
 outCtx.closePath();
 outCtx.fill();

 const text = `${Math.round(mag)} N`;
 outCtx.font = `bold ${Math.max(8, Math.round(11 / zoomScale))}px monospace`;
 const textMetrics = outCtx.measureText(text);
 const badgeW = textMetrics.width + (8 / zoomScale);
 const badgeH = 16 / zoomScale;
 const badgeX = toX + (10 / zoomScale) * Math.cos(angle) - badgeW / 2;
 const badgeY = toY + (10 / zoomScale) * Math.sin(angle) - badgeH / 2;

 outCtx.fillStyle = 'rgba(0, 0, 0, 0.85)';
 outCtx.strokeStyle = color;
 outCtx.lineWidth = 1.2 / zoomScale;
 outCtx.beginPath();
 outCtx.rect(badgeX, badgeY, badgeW, badgeH);
 outCtx.fill();
 outCtx.stroke();

 outCtx.fillStyle = '#ffffff';
 outCtx.textAlign = 'center';
 outCtx.textBaseline = 'middle';
 outCtx.fillText(text, badgeX + badgeW / 2, badgeY + badgeH / 2);

 outCtx.beginPath();
 outCtx.arc(fromX, fromY, Math.min(7, Math.max(3.5, mag * 0.009)) / zoomScale, 0, 2 * Math.PI);
 outCtx.fillStyle = color;
 outCtx.fill();

 outCtx.restore();
}

async function renderCurrentFrame() {
 if (isBusy || video.readyState < 2) return;
 isBusy = true;
 try {
 let inputSource = video;
 
 if (isRoiEnabled && roiNorm.w > 0.05 && roiNorm.h > 0.05) {
 const sx = roiNorm.x * video.videoWidth;
 const sy = roiNorm.y * video.videoHeight;
 const sw = roiNorm.w * video.videoWidth;
 const sh = roiNorm.h * video.videoHeight;

 if (sw > 10 && sh > 10) {
 roiCanvas.width = sw;
 roiCanvas.height = sh;
 roiCtx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
 inputSource = roiCanvas;
 }
 }

 await pose.send({ image: inputSource });
 } catch(e) {
 console.error("Frame render error:", e);
 } finally {
 isBusy = false;
 }
}

async function loop() {
 if (!isProcessing) return;
 if (!video.paused && !video.ended) {
 await renderCurrentFrame();
 updateSeekBar();
 }
 animationFrameId = requestAnimationFrame(loop);
}

function updateSeekBar() {
 if (video.duration) {
 seekSlider.value = (video.currentTime / video.duration) * 100;
 }
}

seekSlider.addEventListener('input', () => {
 if (video.duration) {
 video.pause();
 btnPlayPause.textContent = '▶ 再生';
 video.currentTime = (seekSlider.value / 100) * video.duration;
 }
});

// シーク（飛ばし）操作時に物理演算履歴をリセットして暴れを防ぐ
video.addEventListener('seeked', () => {
 resetPhysics();
 if (video.paused) {
 updateSeekBar();
 renderCurrentFrame();
 }
});

btnPlayPause.addEventListener('click', async () => {
 if (video.paused) {
 try {
 await video.play();
 btnPlayPause.textContent = '⏸ 停止';
 btnPlayPause.style.background = '#ff9500';
 } catch (e) {
 console.error(e);
 }
 } else {
 video.pause();
 btnPlayPause.textContent = '▶ 再生';
 btnPlayPause.style.background = '#34c759';
 }
});

btnStepForward.addEventListener('click', () => {
 video.pause();
 btnPlayPause.textContent = '▶ 再生';
 video.currentTime = Math.min(video.duration, video.currentTime + (1 / currentFPS));
});

btnStepBack.addEventListener('click', () => {
 video.pause();
 btnPlayPause.textContent = '▶ 再生';
 video.currentTime = Math.max(0, video.currentTime - (1 / currentFPS));
});

function captureSnapshot() {
 if (!video.videoWidth) { alert("動画が読み込まれていません"); return; }
 const snapCanvas = document.createElement('canvas');
 const snapCtx = snapCanvas.getContext('2d');
 snapCanvas.width = outputCanvas.width;
 snapCanvas.height = outputCanvas.height + 60;

 snapCtx.fillStyle = '#000';
 snapCtx.fillRect(0, 0, snapCanvas.width, snapCanvas.height);
 snapCtx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);
 snapCtx.drawImage(outputCanvas, 0, 0);

 snapCtx.fillStyle = '#1c1c1e';
 snapCtx.fillRect(0, outputCanvas.height, snapCanvas.width, 60);
 snapCtx.fillStyle = '#00ffcc';
 snapCtx.font = 'bold 13px -apple-system, sans-serif';
 snapCtx.fillText(`右膝トルク: ${document.getElementById('hud_r_knee').textContent} N·m ｜ 左膝トルク: ${document.getElementById('hud_l_knee').textContent} N·m`, 15, outputCanvas.height + 24);
 snapCtx.fillStyle = '#ccc';
 snapCtx.font = '11px -apple-system, sans-serif';
 snapCtx.fillText(`右床反力: ${document.getElementById('r_grf').textContent} ｜ 左床反力: ${document.getElementById('l_grf').textContent}`, 15, outputCanvas.height + 46);

 document.getElementById('snapshot-img').src = snapCanvas.toDataURL('image/png');
 document.getElementById('snapshot-modal-overlay').style.display = 'flex';
}
function closeSnapshotModal() { document.getElementById('snapshot-modal-overlay').style.display = 'none'; }

function toggleRecording() {
 if (isRecording) stopRecording();
 else startRecording();
}

function startRecording() {
 if (!video.duration) { alert("動画が開始されていません"); return; }

 recordedChunks = [];
 recordCanvas = document.createElement('canvas');
 recordCanvas.width = outputCanvas.width;
 recordCanvas.height = outputCanvas.height + 50;
 recordCtx = recordCanvas.getContext('2d');

 function drawRecordFrame() {
 if (!isRecording) return;
 recordCtx.fillStyle = '#000';
 recordCtx.fillRect(0, 0, recordCanvas.width, recordCanvas.height);
 recordCtx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);
 recordCtx.drawImage(outputCanvas, 0, 0);

 recordCtx.fillStyle = '#1c1c1e';
 recordCtx.fillRect(0, outputCanvas.height, recordCanvas.width, 50);
 recordCtx.fillStyle = '#00ffcc';
 recordCtx.font = 'bold 12px -apple-system, sans-serif';
 recordCtx.fillText(`右膝: ${document.getElementById('hud_r_knee').textContent} N·m ｜ 左膝: ${document.getElementById('hud_l_knee').textContent} N·m`, 12, outputCanvas.height + 22);
 recordCtx.fillStyle = '#ccc';
 recordCtx.font = '10px -apple-system, sans-serif';
 recordCtx.fillText(`右床反力: ${document.getElementById('r_grf').textContent} ｜ 左床反力: ${document.getElementById('l_grf').textContent}`, 12, outputCanvas.height + 40);

 recordAnimId = requestAnimationFrame(drawRecordFrame);
 }

 const stream = recordCanvas.captureStream(currentFPS);
 const candidateTypes = [
 'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
 'video/mp4;codecs=avc1',
 'video/mp4',
 'video/webm;codecs=h264',
 'video/webm;codecs=vp9',
 'video/webm'
 ];
 let selectedMimeType = candidateTypes.find(t => MediaRecorder.isTypeSupported(t)) || '';

 try {
 mediaRecorder = selectedMimeType 
 ? new MediaRecorder(stream, { mimeType: selectedMimeType, videoBitsPerSecond: 6000000 })
 : new MediaRecorder(stream);
 } catch (e) {
 mediaRecorder = new MediaRecorder(stream);
 }

 mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
 mediaRecorder.onstop = exportRecordedVideo;

 mediaRecorder.start();
 isRecording = true;
 btnRecord.innerText = '⏹ 録画停止';
 btnRecord.classList.add('rec-active');

 drawRecordFrame();
 if (video.paused) btnPlayPause.click();
}

function stopRecording() {
 if (!isRecording) return;
 isRecording = false;
 if (recordAnimId) cancelAnimationFrame(recordAnimId);
 mediaRecorder.stop();
 btnRecord.innerText = '🎥 録画開始';
 btnRecord.classList.remove('rec-active');
 if (!video.paused) btnPlayPause.click();
}

function exportRecordedVideo() {
 const isMp4 = mediaRecorder.mimeType && mediaRecorder.mimeType.includes('mp4');
 const finalType = isMp4 ? 'video/mp4' : (mediaRecorder.mimeType || 'video/webm');
 const ext = isMp4 ? 'mp4' : 'webm';

 const blob = new Blob(recordedChunks, { type: finalType });
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a');
 a.href = url;
 a.download = `下肢動作分析_${new Date().toISOString().slice(0, 10)}_${Date.now()}.${ext}`;
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
 setTimeout(() => URL.revokeObjectURL(url), 2000);
}

inputFile.addEventListener('change', (e) => {
 const file = e.target.files[0];
 if (!file) return;

 if (animationFrameId) cancelAnimationFrame(animationFrameId);
 if (currentBlobUrl) {
 URL.revokeObjectURL(currentBlobUrl);
 currentBlobUrl = null;
 }
 video.pause();
 resetZoom();
 resetPhysics(); // 新しい動画読み込み時も物理演算をリセット

 currentBlobUrl = URL.createObjectURL(file);
 video.src = currentBlobUrl;
 video.load();

 const onCanPlay = () => {
 video.removeEventListener('canplay', onCanPlay);
 fitCanvases();
 isProcessing = true;
 btnPlayPause.textContent = '▶ 再生';
 video.currentTime = 0.001;
 loop();
 };

 video.addEventListener('canplay', onCanPlay);
 inputFile.value = '';
});
</script>
