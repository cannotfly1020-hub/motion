**Python（Matplotlib / Seaborn など）の場合**
* **描画コマンドの不足:** スクリプトの最後に `plt.show()` を記述しているか確認してください。
* **Jupyter Notebookのインライン設定:** ノートブック上で実行している場合、先頭に `%matplotlib inline` を追加して実行してみてください。
* **データの空・型不一致:** 渡しているリストやデータフレームが空でないか（`len(data) == 0`）、数値列が文字列型（`object`）になっていないか確認してください。
* **軸の範囲（Scale）:** データに対して軸の範囲が外れている場合があります。`plt.autoscale()` を試すか、軸の設定を見直してください。

**Excel / スプレッドシートの場合**
* **データ範囲の指定ミス:** グラフの「データの選択」を開き、参照範囲が空白セルになっていないか確認してください。
* **数字が文字列扱い:** セルの数値の左上に緑の三角が出ている場合、文字列として認識されてプロットされないことがあります。数値に変換してください。
* **非表示のセル:** 元データがフィルター等で非表示になっていると、グラフ側も自動で非表示になる場合があります。
