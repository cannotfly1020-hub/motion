<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="動作分析Pro">
<title>動作分析 Pro</title>

<!-- MediaPipe Pose & Drawing Utils の読み込み -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100dvh; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
    #header { width: 100%; background: #1c1c1e; padding-top: calc(6px + env(safe-area-inset-top)); padding-left: calc(8px + env(safe-area-inset-left)); padding-right: calc(8px + env(safe-area-inset-right)); padding-bottom: 6px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #333; z-index: 10; flex-shrink: 0; }
    .header-top-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .header-top-row::-webkit-scrollbar { display: none; }
    .btn-group-header { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; flex-shrink: 0; }
    .hdr-btn { -webkit-appearance: none; appearance: none; background: #007aff; color: white; border: none; padding: 5px 8px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .hdr-btn.secondary { background: #3a3a3c; }
    .hdr-btn.compare-parallel { background: #af52de; color: #fff; }
    .hdr-btn.compare-overlay { background: #ff2d55; color: #fff; }
    .hdr-btn.fps-badge { background: #30d158; color: #000; font-size: 10px; }
    #scale-info-text { font-size: 10px; color: #ff9500; font-weight: 600; white-space: nowrap; margin-left: auto; flex-shrink: 0; padding-left: 4px; }
    #result-box { width: 100%; background: #262629; border-radius: 6px; padding: 5px 8px; border: 1px solid #3a3a3c; }
    #main-result { color: #00ffcc; font-size: 12px; font-weight: bold; line-height: 1.2; }
    #sub-result { color: #aaa; font-size: 10px; margin-top: 2px; font-weight: 500; line-height: 1.2; }
    .highlight-acc { color: #ff375f; font-weight: bold; }
    .highlight-speed { color: #ffcc00; font-weight: bold; }
    .highlight-sim { color: #30d158; font-weight: bold; }
    .highlight-cog { color: #5e5ce6; font-weight: bold; }
    #stage { width: 100%; position: relative; flex: 1; min-height: 0; display: flex; background: #000; overflow: hidden; }
    .video-pane { position: relative; flex: 1; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
    .zoom-target { width: 100%; height: 100%; position: relative; transform-origin: center center; }
    #pane2 { display: none; border-left: 2px solid #555; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; pointer-events: auto; }
    #controls { width: 100%; background: #1c1c1e; padding-top: 5px; padding-left: calc(8px + env(safe-area-inset-left)); padding-right: calc(8px + env(safe-area-inset-right)); padding-bottom: calc(6px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 5px; border-top: 1px solid #333; flex-shrink: 0; }
    .seek-container { display: flex; flex-direction: column; gap: 3px; width: 100%; }
    .seek-row { display: flex; align-items: center; gap: 6px; width: 100%; }
    .seek-label { font-size: 10px; font-weight: bold; color: #007aff; width: 14px; flex-shrink: 0; text-align: center; }
    .seek-label.v2 { color: #af52de; }
    input[type=range] { flex: 1; height: 18px; accent-color: #007aff; }
    #seekbar2 { accent-color: #af52de; }
    #perp-slider { accent-color: #ff2d55; }
    #sim-slider { accent-color: #30d158; }
    .mode-grid { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    button.ctrl-btn { -webkit-appearance: none; appearance: none; width: 100%; padding: 6px 0; background: #2c2c2e; color: white; border: none; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; }
    button.ctrl-btn:active { background: #444; }
    button.mode-active { background: #30d158; color: black; font-weight: bold; }
    #btn-mode-acc.mode-active { background: #ff375f; color: white; font-weight: bold; }
    #btn-mode-scale.mode-active { background: #ff9500; color: black; font-weight: bold; }
    #btn-mode-zoom.mode-active { background: #007aff; color: white; font-weight: bold; }
    #btn-mode-perp.mode-active { background: #ff2d55; color: white; font-weight: bold; }
    #btn-mode-sim.mode-active { background: #30d158; color: black; font-weight: bold; }
    #btn-mode-cog.mode-active { background: #5e5ce6; color: white; font-weight: bold; }
    #btn-mode-ai.mode-active { background: #00ffcc; color: black; font-weight: bold; }
    .playback-row { width: 100%; display: grid; grid-template-columns: 1fr 1.3fr 1fr 0.9fr 1fr; gap: 4px; }
    #btn-play { background: #34c759; color: #000; font-weight: bold; }
    #btn-clear { background: #ff3b30; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
    .modal-card { background: #2c2c2e; border: 1px solid #444; border-radius: 12px; width: 90%; max-width: 340px; padding: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    .modal-card h3 { font-size: 15px; margin-bottom: 6px; color: #ff9500; }
    .modal-card p { font-size: 12px; color: #ccc; margin-bottom: 12px; }
    .modal-input-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 14px; }
    .modal-input-row input { width: 100px; font-size: 16px; padding: 6px; text-align: center; border-radius: 6px; border: 1px solid #555; background: #1c1c1e; color: #fff; user-select: auto; -webkit-user-select: auto; }
    .modal-btn-row { display: flex; gap: 8px; }
    .modal-btn-row button { -webkit-appearance: none; appearance: none; flex: 1; padding: 8px 0; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; }
    #snapshot-img { max-width: 100%; max-height: 50vh; border-radius: 6px; border: 1px solid #555; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="header">
    <div class="header-top-row">
        <div class="btn-group-header">
            <button class="hdr-btn" onclick="triggerPickVideo(1)">動画①</button>
            <button class="hdr-btn secondary" id="btn-pick2" style="display:none;" onclick="triggerPickVideo(2)">動画②</button>
            <button class="hdr-btn secondary" id="btn-toggle-compare" onclick="toggleCompareMode()">1画面</button>
            <button class="hdr-btn fps-badge" id="btn-fps" onclick="toggleFPS()">30fps</button>
            <button class="hdr-btn" style="background:#5856d6;" onclick="captureSnapshot()">📸 保存</button>
        </div>
        <span id="scale-info-text">物差し: 未設定</span>
        <input type="file" id="file-input-1" accept="video/*" style="display:none">
        <input type="file" id="file-input-2" accept="video/*" style="display:none">
    </div>
    <div id="result-box">
        <div id="main-result">動画①を選択してください</div>
        <div id="sub-result"></div>
    </div>
</div>

<div id="stage">
    <div class="video-pane" id="pane1">
        <div class="zoom-target" id="zoom-target-1">
            <video id="video1" playsinline webkit-playsinline muted></video>
            <canvas id="canvas1"></canvas>
        </div>
    </div>
    <div class="video-pane" id="pane2">
        <div class="zoom-target" id="zoom-target-2">
            <video id="video2" playsinline webkit-playsinline muted></video>
            <canvas id="canvas2"></canvas>
        </div>
    </div>
</div>

<div id="controls">
    <div class="seek-container">
        <div class="seek-row">
            <span class="seek-label">①</span>
            <input type="range" id="seekbar1" min="0" max="100" value="0" step="0.001">
        </div>
        <div class="seek-row" id="seek-row-2" style="display:none;">
            <span class="seek-label v2">②</span>
            <input type="range" id="seekbar2" min="0" max="100" value="0" step="0.001">
        </div>
    </div>
    
    <div class="mode-grid">
        <button class="ctrl-btn mode-active" id="btn-mode-angle" onclick="setMode('angle')">角度(3点)</button>
        <button class="ctrl-btn" id="btn-mode-dist" onclick="setMode('distance')">速度(2点)</button>
        <button class="ctrl-btn" id="btn-mode-acc" onclick="setMode('accel')">加速(3点)</button>
        <button class="ctrl-btn" id="btn-mode-perp" onclick="setMode('perp')">垂直線</button>
        <button class="ctrl-btn" id="btn-mode-sim" onclick="setMode('sim')">🎯 予測(+10°)</button>
        <button class="ctrl-btn" id="btn-mode-cog" onclick="setMode('cog')">📍 重心移動</button>
        <button class="ctrl-btn" id="btn-mode-scale" onclick="setMode('scale')">📏 物差し</button>
        <button class="ctrl-btn" id="btn-mode-zoom" onclick="setMode('zoom')">🔍 ズーム</button>
        <button class="ctrl-btn" id="btn-mode-ai" onclick="setMode('ai')" style="grid-column: span 4; border: 1px solid #00ffcc; color: #00ffcc; background: rgba(0, 255, 204, 0.1);">🤖 AI全身骨格表示 (体幹傾斜 & 捻転差)</button>
    </div>
    
    <div id="zoom-controls" style="display:none; width:100%; align-items:center; gap:8px;">
        <span style="font-size:11px; font-weight:bold; color:#007aff;">倍率(画面<span id="zoom-target-label">①</span>)</span>
        <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1">
        <button class="ctrl-btn" style="width:auto; padding:4px 10px; background:#444;" onclick="resetZoom()">リセット</button>
    </div>

    <div id="perp-controls" style="display:none; width:100%; align-items:center; gap:8px;">
        <span style="font-size:11px; font-weight:bold; color:#ff2d55; white-space:nowrap;">垂直線移動</span>
        <input type="range" id="perp-slider" min="0" max="100" step="0.5" value="50">
    </div>

    <div id="sim-controls" style="display:none; width:100%; align-items:center; gap:8px;">
        <span style="font-size:11px; font-weight:bold; color:#30d158; white-space:nowrap;">角度: <span id="sim-deg-val">+10°</span></span>
        <input type="range" id="sim-slider" min="-30" max="30" step="1" value="10">
    </div>

    <div class="playback-row">
        <button class="ctrl-btn" onclick="stepFrame(-1)">◀ -1</button>
        <button class="ctrl-btn" id="btn-play" onclick="togglePlay()">▶ 再生</button>
        <button class="ctrl-btn" onclick="stepFrame(1)">+1 ▶</button>
        <button class="ctrl-btn" id="btn-speed" onclick="togglePlaybackRate()">1.0x</button>
        <button class="ctrl-btn" id="btn-clear" onclick="clearCurrentPoints()">クリア</button>
    </div>
</div>

<div id="scale-modal-overlay" class="modal-overlay">
    <div class="modal-card">
        <h3 id="scale-modal-title">物差しの長さ設定</h3>
        <p>指定した2点間の実際の長さを入力</p>
        <div class="modal-input-row">
            <input type="number" id="scale-input-value" inputmode="decimal" placeholder="100" value="100">
            <span style="font-weight:bold; font-size:15px;">cm</span>
        </div>
        <div class="modal-btn-row">
            <button style="background:#444; color:#fff;" onclick="cancelScaleModal()">キャンセル</button>
            <button style="background:#ff9500; color:#000;" onclick="submitScaleModal()">確定</button>
        </div>
    </div>
</div>

<div id="snapshot-modal-overlay" class="modal-overlay">
    <div class="modal-card" style="max-width:360px;">
        <h3 style="color:#5856d6;">📸 スクリーンショット</h3>
        <p style="font-size:11px; color:#aaa;">画像を長押しして「写真に追加」で保存できます</p>
        <img id="snapshot-img" src="" alt="Screenshot">
        <div class="modal-btn-row">
            <button style="background:#444; color:#fff;" onclick="closeSnapshotModal()">閉じる</button>
        </div>
    </div>
</div>

<script>
    const video1 = document.getElementById('video1');
    const canvas1 = document.getElementById('canvas1');
    const ctx1 = canvas1.getContext('2d');

    const video2 = document.getElementById('video2');
    const canvas2 = document.getElementById('canvas2');
    const ctx2 = canvas2.getContext('2d');

    const pane2 = document.getElementById('pane2');
    const btnPick2 = document.getElementById('btn-pick2');
    const btnToggleCompare = document.getElementById('btn-toggle-compare');
    const btnFps = document.getElementById('btn-fps');
    const seekbar1 = document.getElementById('seekbar1');
    const seekbar2 = document.getElementById('seekbar2');
    const seekRow2 = document.getElementById('seek-row-2');
    const mainResult = document.getElementById('main-result');
    const subResult = document.getElementById('sub-result');
    const scaleInfoText = document.getElementById('scale-info-text');
    const btnPlay = document.getElementById('btn-play');
    const btnSpeed = document.getElementById('btn-speed');

    const fileInput1 = document.getElementById('file-input-1');
    const fileInput2 = document.getElementById('file-input-2');

    const btnModeAngle = document.getElementById('btn-mode-angle');
    const btnModeDist = document.getElementById('btn-mode-dist');
    const btnModeAcc = document.getElementById('btn-mode-acc');
    const btnModeScale = document.getElementById('btn-mode-scale');
    const btnModeZoom = document.getElementById('btn-mode-zoom');
    const btnModePerp = document.getElementById('btn-mode-perp');
    const btnModeSim = document.getElementById('btn-mode-sim');
    const btnModeCog = document.getElementById('btn-mode-cog');
    const btnModeAi = document.getElementById('btn-mode-ai');
    
    const perpSlider = document.getElementById('perp-slider');
    const simSlider = document.getElementById('sim-slider');
    const simDegVal = document.getElementById('sim-deg-val');
    
    const scaleModalOverlay = document.getElementById('scale-modal-overlay');
    const scaleModalTitle = document.getElementById('scale-modal-title');
    const scaleInputValue = document.getElementById('scale-input-value');

    let compareMode = 0; 
    let currentMode = 'angle';
    let lastMeasureMode = 'angle';
    
    let currentFPS = 30.0;
    const fpsList = [30, 60, 120, 240];
    let fpsIdx = 0;

    let currentTorsionAngle = 0;

    // rawLandmarks: 全身33点の描画用データ
    const state = {
        1: { points: [], scalePoints: [], perpPoints: [], cogPoints: [], aiJoints: [], rawLandmarks: null, aiOverrides: {}, pxPerCm: null, resultMain: "", resultSub: "" },
        2: { points: [], scalePoints: [], perpPoints: [], cogPoints: [], aiJoints: [], rawLandmarks: null, aiOverrides: {}, pxPerCm: null, resultMain: "", resultSub: "" }
    };
    
    const viewState = {
        1: { scale: 1, x: 0, y: 0 },
        2: { scale: 1, x: 0, y: 0 }
    };

    let scaleTarget = 1;
    let lastActiveTarget = 1;
    let tempDistPx = 0;
    let historyData = []; 
    let draggingPoint = null;

    function toggleFPS() {
        fpsIdx = (fpsIdx + 1) % fpsList.length;
        currentFPS = fpsList[fpsIdx];
        btnFps.innerText = `${currentFPS}fps`;
        [1, 2].forEach(idx => {
            const s = state[idx];
            if (s.points.length > 0) {
                s.points.forEach(p => { if (p.frame !== undefined) p.time = p.frame / currentFPS; });
            }
            calcResults(s, lastMeasureMode, false, idx);
        });
        updateDisplayResult();
    }

    let isPlaying = false;
    let playbackRates = [1.0, 0.5, 0.25];
    let currentRateIdx = 0;

    function simulateJointAngle(p2, p3, deltaDeg) {
        const rad = deltaDeg * (Math.PI / 180);
        const dx = p3.x - p2.x;
        const dy = p3.y - p2.y;
        const rotatedX = dx * Math.cos(rad) - dy * Math.sin(rad);
        const rotatedY = dx * Math.sin(rad) + dy * Math.cos(rad);
        return { x: p2.x + rotatedX, y: p2.y + rotatedY };
    }

    function calcResults(s, mode, isNewPoint = false, targetIdx = 1) {
        if (mode === 'angle') {
            if (s.points.length === 3) {
                const p1 = s.points[0], p2 = s.points[1], p3 = s.points[2];
                const v1 = {x: p1.x - p2.x, y: p1.y - p2.y};
                const v2 = {x: p3.x - p2.x, y: p3.y - p2.y};
                const dot = v1.x * v2.x + v1.y * v2.y;
                const mag1 = Math.hypot(v1.x, v1.y), mag2 = Math.hypot(v2.x, v2.y);
                if (mag1 * mag2 !== 0) {
                    let cosVal = Math.max(-1.0, Math.min(1.0, dot / (mag1 * mag2)));
                    let angle = Math.acos(cosVal) * (180 / Math.PI);
                    s.resultMain = `関節角度: ${angle.toFixed(1)}°`;
                    s.resultSub = `頂点(2点目)を中心とした角度`;
                }
            } else {
                s.resultMain = s.points.length === 0 ? "角度モード: 3点をタップ" : `点 ${s.points.length}/3`;
                s.resultSub = s.points.length === 1 ? "2点目(頂点)をタップ" : "頂点(2点目)を中心とした角度を測定";
            }
        } else if (mode === 'sim') {
            if (s.points.length === 3) {
                const p1 = s.points[0], p2 = s.points[1], p3 = s.points[2];
                const v1 = {x: p1.x - p2.x, y: p1.y - p2.y};
                const v2 = {x: p3.x - p2.x, y: p3.y - p2.y};
                const dot = v1.x * v2.x + v1.y * v2.y;
                const mag1 = Math.hypot(v1.x, v1.y), mag2 = Math.hypot(v2.x, v2.y);
                let curAngle = 0;
                if (mag1 * mag2 !== 0) {
                    let cosVal = Math.max(-1.0, Math.min(1.0, dot / (mag1 * mag2)));
                    curAngle = Math.acos(cosVal) * (180 / Math.PI);
                }
                const deltaDeg = parseFloat(simSlider.value);
                const simPt = simulateJointAngle(p2, p3, deltaDeg);
                const diffPx = Math.hypot(simPt.x - p3.x, simPt.y - p3.y);
                const shiftText = s.pxPerCm ? `(先端移動: ${(diffPx / s.pxPerCm).toFixed(1)}cm)` : `(先端移動: ${diffPx.toFixed(1)}px)`;
                s.resultMain = `<span class="highlight-sim">可動域予測: ${curAngle.toFixed(1)}° → ${(curAngle + deltaDeg).toFixed(1)}° (${deltaDeg > 0 ? '+' : ''}${deltaDeg}°)</span>`;
                s.resultSub = `緑の破線が改善後の予測位置 ${shiftText}`;
            } else {
                s.resultMain = s.points.length === 0 ? "予測モード: 根元→関節中心→先端をタップ" : `点 ${s.points.length}/3`;
                s.resultSub = "3点打つと、下のスライダーで角度改善シミュレーションが動きます";
            }
        } else if (mode === 'cog') {
            if (s.perpPoints.length < 2) {
                s.resultMain = "📍 基準エラー: 先に「垂直線」を設定してください";
                s.resultSub = "垂直線モードで2点をタップし、基準線を引いてから測定します";
            } else if (s.cogPoints.length === 0) {
                s.resultMain = "基準線設定完了: 重心・頭の点をタップ";
                s.resultSub = "コマ送りしながら、追跡したい重心の点を何個でもタップできます";
            } else {
                const p1 = s.perpPoints[0], p2 = s.perpPoints[1];
                const t = perpSlider.value / 100;
                const pmX = p1.x + (p2.x - p1.x) * t;
                const pmY = p1.y + (p2.y - p1.y) * t;

                const bx = p2.x - p1.x, by = p2.y - p1.y;
                const bLen = Math.hypot(bx, by);
                const ux = bx / bLen, uy = by / bLen;
                const nx = -uy, ny = ux;

                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                s.cogPoints.forEach(p => {
                    const vx = p.x - pmX, vy = p.y - pmY;
                    p.par = vx * ux + vy * uy;   
                    p.per = -(vx * nx + vy * ny); 
                    if (p.par < minX) minX = p.par; if (p.par > maxX) maxX = p.par;
                    if (p.per < minY) minY = p.per; if (p.per > maxY) maxY = p.per;
                });
                const rangeX = maxX - minX, rangeY = maxY - minY;
                const lastPt = s.cogPoints[s.cogPoints.length - 1];
                s.resultMain = `<span class="highlight-cog">重心変位 [点${s.cogPoints.length}]: 左右 ${formatDelta(lastPt.par, s.pxPerCm)} ｜ 上下 ${formatDelta(lastPt.per, s.pxPerCm)}</span>`;
                s.resultSub = `最大移動幅: 左右ブレ ${formatDistance(rangeX, s.pxPerCm)} ｜ 上下ブレ ${formatDistance(rangeY, s.pxPerCm)}`;
            }
        } else if (mode === 'distance') {
            if (s.points.length === 2) {
                const p1 = s.points[0], p2 = s.points[1], dx = p2.x - p1.x, dy = -(p2.y - p1.y);
                const dist = Math.hypot(dx, dy), dt = Math.abs(p2.time - p1.time);
                s.resultMain = `距離: ${formatDistance(dist, s.pxPerCm)}`;
                if (dt > 0 && s.pxPerCm) {
                    const speedKMH = ((dist / s.pxPerCm) / 100) / dt * 3.6;
                    s.resultSub = `速度: <span class="highlight-speed">${speedKMH.toFixed(1)}km/h</span> (${currentFPS}fps)`;
                } else if (!s.pxPerCm) {
                    s.resultSub = "⚠️速度計算には「📏物差し」の設定が必要です";
                } else {
                    s.resultSub = "⚠️速度計算には動画のコマ送りが必要です";
                }
            } else {
                s.resultMain = s.points.length === 0 ? "速度モード: 始点→終点をタップ" : "始点を記録";
                s.resultSub = "1点目タップ後、コマ送りして2点目をタップ";
            }
        } else if (mode === 'accel') {
            if (s.points.length === 3) {
                const p1 = s.points[0], p2 = s.points[1], p3 = s.points[2];
                const dt1 = Math.abs(p2.time - p1.time), dt2 = Math.abs(p3.time - p2.time);
                const dist1 = Math.hypot(p2.x - p1.x, p2.y - p1.y), dist2 = Math.hypot(p3.x - p2.x, p3.y - p2.y);
                if (!s.pxPerCm) {
                    s.resultMain = `<span style="color:#ff9500;">⚠️物差し未設定</span>`;
                    s.resultSub = "先に「📏物差し」モードで長さを設定してください";
                } else if (dt1 === 0 || dt2 === 0) {
                    s.resultMain = `<span style="color:#ff9500;">⚠️時間が経過していません</span>`;
                    s.resultSub = "コマ送りをして、違う時間の3点をタップしてください";
                } else {
                    const v1 = ((dist1 / s.pxPerCm) / 100) / dt1, v2 = ((dist2 / s.pxPerCm) / 100) / dt2;
                    const accel = (v2 - v1) / ((dt1 + dt2) / 2), gForce = accel / 9.80665;
                    s.resultMain = `<span class="highlight-acc">加速度: ${accel > 0 ? '+' : ''}${accel.toFixed(2)}m/s² (${gForce > 0 ? '+' : ''}${gForce.toFixed(2)}G)</span>`;
                    s.resultSub = `①:${(v1 * 3.6).toFixed(1)}k → ②:${(v2 * 3.6).toFixed(1)}k (${currentFPS}fps)`;
                }
            } else {
                s.resultMain = s.points.length === 0 ? "加速度モード: 連続3点をタップ" : `点 ${s.points.length}/3`;
                s.resultSub = "コマ送りしながら 始点 → 中間 → 終点 をタップ";
            }
        } else if (mode === 'perp') {
            s.resultMain = `垂直線モード`; s.resultSub = `下のスライダーで垂直線を動かせます`;
        }
    }

    function calcAiResults(type = 'ai') {
        const s = state[1];
        if (s.aiJoints && s.aiJoints.length === 4) {
            const shoulderL = s.aiJoints[0];
            const shoulderR = s.aiJoints[1];
            const hipL = s.aiJoints[2];
            const hipR = s.aiJoints[3];

            const midThorax = { x: (shoulderL.x + shoulderR.x) / 2, y: (shoulderL.y + shoulderR.y) / 2 };
            const midHip = { x: (hipL.x + hipR.x) / 2, y: (hipL.y + hipR.y) / 2 };

            const dx = midThorax.x - midHip.x;
            const dy = midThorax.y - midHip.y;
            const angleDeg = Math.atan2(dx, -dy) * (180 / Math.PI);

            const dxPelvis = hipR.x - hipL.x;
            const dzPelvis = (hipR.z || 0) - (hipL.z || 0);
            const pelvisAngleDeg = Math.atan2(dzPelvis, dxPelvis) * (180 / Math.PI);

            const dxThorax = shoulderR.x - shoulderL.x;
            const dzThorax = (shoulderR.z || 0) - (shoulderL.z || 0);
            const thoraxAngleDeg = Math.atan2(dzThorax, dxThorax) * (180 / Math.PI);

            let torsionDiff = thoraxAngleDeg - pelvisAngleDeg;
            if (torsionDiff > 180) torsionDiff -= 360;
            if (torsionDiff < -180) torsionDiff += 360;
            currentTorsionAngle = torsionDiff;
            
            let typeLabel = "🤖 AI";
            let color = "#00ffcc";
            if (type === 'manual') { typeLabel = "✋ 手動"; color = "#ff9500"; }
            else if (type === 'interpolated') { typeLabel = "✨ 補間"; color = "#ffcc00"; }
            
            const torsionText = `<span class="highlight-speed" style="font-size:13px;">${Math.abs(currentTorsionAngle).toFixed(1)}°</span>`;

            mainResult.innerHTML = `${typeLabel} ｜ 体幹傾斜: <span style="color:${color}; font-size:13px;">${angleDeg.toFixed(1)}°</span> ｜ 捻転差(X-Factor): ${torsionText}`;
            subResult.innerHTML = `全33点骨格表示 ｜ 赤:胸郭 / 青:骨盤 / 緑:体幹軸（端点ドラッグで修正可能）`;
        }
    }

    function formatDistance(px, pxPerCm) {
        if (!pxPerCm) return `${px.toFixed(1)} px`; const cm = px / pxPerCm;
        if (cm >= 100) return `${(cm / 100).toFixed(2)} m (${cm.toFixed(1)} cm)`; return `${cm.toFixed(1)} cm`;
    }
    function formatDelta(px, pxPerCm) {
        if (!pxPerCm) return `${px > 0 ? '+' : ''}${px.toFixed(1)}px`; const cm = px / pxPerCm;
        return `${cm > 0 ? '+' : ''}${cm.toFixed(1)} cm`;
    }

    let isTouchPanning = false; let panStartX = 0, panStartY = 0, panStartOffsetX = 0, panStartOffsetY = 0, pinchInitialDist = 0, pinchInitialScale = 1, pinchTarget = 1;
    document.getElementById('stage').addEventListener('touchstart', e => {
        if (currentMode !== 'zoom') return;
        const targetIdx = e.target.closest('#pane2') ? 2 : 1; lastActiveTarget = targetIdx;
        document.getElementById('zoom-target-label').innerText = targetIdx === 1 ? '①' : '②'; document.getElementById('zoom-slider').value = viewState[targetIdx].scale;
        if (e.touches.length === 1) {
            isTouchPanning = true; panStartX = e.touches[0].clientX; panStartY = e.touches[0].clientY;
            panStartOffsetX = viewState[targetIdx].x; panStartOffsetY = viewState[targetIdx].y;
        } else if (e.touches.length === 2) {
            isTouchPanning = false; e.preventDefault(); pinchTarget = targetIdx;
            pinchInitialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            pinchInitialScale = viewState[targetIdx].scale;
        }
    }, {passive: false});

    document.getElementById('stage').addEventListener('touchmove', e => {

            viewState[lastActiveTarget].x = panStartOffsetX + (e.touches[0].clientX - panStartX) / scale;
            viewState[lastActiveTarget].y = panStartOffsetY + (e.touches[0].clientY - panStartY) / scale;
            applyZoom(lastActiveTarget);
        } else if (e.touches.length === 2) {
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            viewState[pinchTarget].scale = Math.max(1, Math.min(pinchInitialScale * (dist / pinchInitialDist), 5));
            applyZoom(pinchTarget); document.getElementById('zoom-slider').value = viewState[pinchTarget].scale;
        }
    }, {passive: false});
    document.getElementById('stage').addEventListener('touchend', e => { if (e.touches.length === 0) isTouchPanning = false; }, {passive: false});

    [ {c: canvas1, v: video1, idx: 1}, {c: canvas2, v: video2, idx: 2} ].forEach(item => {
        item.c.addEventListener('pointerdown', (e) => handlePointerDown(e, item.c, item.v, item.idx));

    });

    function getCanvasCoords(e, cvs) {
        const rect = cvs.getBoundingClientRect();
        if (cvs.width !== rect.width || cvs.height !== rect.height) { cvs.width = rect.width; cvs.height = rect.height; }
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function findHitPoint(s, pos, mode) {
        const HIT_RADIUS = 22; 
        if (mode === 'ai') {
            if (s.aiJoints && s.aiJoints.length === 4) {
                for (let i = 0; i < s.aiJoints.length; i++) {
                    if (Math.hypot(s.aiJoints[i].x - pos.x, s.aiJoints[i].y - pos.y) <= HIT_RADIUS) {
                        return { arrayName: 'aiJoints', index: i };
                    }
                }
            }
            return null;
        }
        if (mode === 'cog') {
            if (s.cogPoints.length > 0) {
                for (let i = s.cogPoints.length - 1; i >= 0; i--) {
                    if (Math.hypot(s.cogPoints[i].x - pos.x, s.cogPoints[i].y - pos.y) <= HIT_RADIUS) return { arrayName: 'cogPoints', index: i };
                }
            }
            if (s.perpPoints.length === 2) {
                for (let i = 0; i < s.perpPoints.length; i++) {
                    if (Math.hypot(s.perpPoints[i].x - pos.x, s.perpPoints[i].y - pos.y) <= HIT_RADIUS) return { arrayName: 'perpPoints', index: i };
                }
            }
            return null;
        }
        if (mode === 'scale') {
            for (let i = 0; i < s.scalePoints.length; i++) { if (Math.hypot(s.scalePoints[i].x - pos.x, s.scalePoints[i].y - pos.y) <= HIT_RADIUS) return { arrayName: 'scalePoints', index: i }; }
            return null;
        }
        if (mode === 'perp') {
            for (let i = 0; i < s.perpPoints.length; i++) { if (Math.hypot(s.perpPoints[i].x - pos.x, s.perpPoints[i].y - pos.y) <= HIT_RADIUS) return { arrayName: 'perpPoints', index: i }; }
            return null;
        }
        for (let i = 0; i < s.points.length; i++) { if (Math.hypot(s.points[i].x - pos.x, s.points[i].y - pos.y) <= HIT_RADIUS) return { arrayName: 'points', index: i }; }
        return null;
    }

    function handlePointerDown(e, cvs, vid, targetIdx) {
        if (currentMode === 'zoom') return; 
        lastActiveTarget = targetIdx;
        const s = state[targetIdx], pos = getCanvasCoords(e, cvs);
        const currentTime = vid.currentTime, currentFrame = Math.round(currentTime * currentFPS);
        const hit = findHitPoint(s, pos, currentMode);
        if (hit) { draggingPoint = { targetIdx, arrayName: hit.arrayName, index: hit.index }; try { cvs.setPointerCapture(e.pointerId); } catch(err){} return; }
        if (currentMode === 'ai') return; 
        
        if (currentMode === 'scale') {
            s.scalePoints.push({ x: pos.x, y: pos.y });
            if (s.scalePoints.length === 2) {
                tempDistPx = Math.hypot(s.scalePoints[1].x - s.scalePoints[0].x, s.scalePoints[1].y - s.scalePoints[0].y);
                scaleTarget = targetIdx; scaleModalTitle.innerText = `基準物の長さ設定 (動画${targetIdx === 1 ? '①' : '②'})`;
                scaleModalOverlay.style.display = 'flex'; scaleInputValue.focus(); scaleInputValue.select();
            }
            redraw(); return;
        }
        if (currentMode === 'perp') {
            if (s.perpPoints.length >= 2) s.perpPoints = [];
            s.perpPoints.push({ x: pos.x, y: pos.y }); calcResults(s, currentMode, true, targetIdx);
            if (s.perpPoints.length === 2) document.getElementById('perp-controls').style.display = 'flex';
            updateDisplayResult(); redraw(); return;
        }
        if (currentMode === 'cog') {
            if (s.perpPoints.length < 2) { alert("先に「垂直線」モードで2点をタップし、基準線を設定してください。"); return; }
            s.cogPoints.push({ x: pos.x, y: pos.y, time: currentTime, frame: currentFrame });
            calcResults(s, currentMode, true, targetIdx); updateDisplayResult(); redraw(); return;
        }
        const maxPoints = (currentMode === 'distance') ? 2 : 3;
        if (s.points.length >= maxPoints) s.points = [];
        s.points.push({ x: pos.x, y: pos.y, time: currentTime, frame: currentFrame });
        calcResults(s, currentMode, true, targetIdx); updateDisplayResult(); redraw();
    }

    function handlePointerMove(e, cvs, targetIdx) {
        if (!draggingPoint || draggingPoint.targetIdx !== targetIdx) return;
        const s = state[targetIdx], pos = getCanvasCoords(e, cvs);
        const pt = s[draggingPoint.arrayName][draggingPoint.index];
        if (pt) {
            pt.x = pos.x; pt.y = pos.y;
            if (currentMode === 'ai') {
                const currentFrame = Math.round(video1.currentTime * currentFPS);
                s.aiOverrides[currentFrame] = s.aiJoints.map(j => ({ x: j.x, y: j.y, z: j.z || 0 }));
                calcAiResults('manual');
            } else {
                calcResults(s, currentMode, false, targetIdx); updateDisplayResult();
            }
            redraw();
        }
    }

    function handlePointerUp(e, cvs, targetIdx) {
        if (draggingPoint) { try { cvs.releasePointerCapture(e.pointerId); } catch(err){} draggingPoint = null; }
    }

    function submitScaleModal() {
        const realCm = parseFloat(scaleInputValue.value);
        if (realCm && realCm > 0) { state[scaleTarget].pxPerCm = tempDistPx / realCm; updateScaleInfoText(); scaleModalOverlay.style.display = 'none'; setMode('distance'); } 
        else { alert("有効な数値を入力してください"); }
    }
    function cancelScaleModal() { state[scaleTarget].scalePoints = []; scaleModalOverlay.style.display = 'none'; setMode('scale'); }

    function getInterpolatedAiPoints(currentFrame) {
        const s = state[1];
        if (s.aiOverrides[currentFrame]) return { joints: s.aiOverrides[currentFrame], type: 'manual' };

        const frames = Object.keys(s.aiOverrides).map(Number).sort((a, b) => a - b);
        if (frames.length < 2) return null;

        let prev = -1, next = -1;
        for (let i = 0; i < frames.length; i++) {
            if (frames[i] < currentFrame) prev = frames[i];
            if (frames[i] > currentFrame && next === -1) next = frames[i];
        }

        if (prev !== -1 && next !== -1 && (next - prev) <= 120) {
            const ratio = (currentFrame - prev) / (next - prev);
            const joints = [];
            for (let j = 0; j < 4; j++) {
                joints.push({
                    x: s.aiOverrides[prev][j].x + (s.aiOverrides[next][j].x - s.aiOverrides[prev][j].x) * ratio,
                    y: s.aiOverrides[prev][j].y + (s.aiOverrides[next][j].y - s.aiOverrides[prev][j].y) * ratio,
                    z: (s.aiOverrides[prev][j].z || 0) + ((s.aiOverrides[next][j].z || 0) - (s.aiOverrides[prev][j].z || 0)) * ratio
                });
            }
            return { joints, type: 'interpolated' };
        }
        return null;
    }

    // ★修正: 全身33点の骨格ワイヤーフレーム ＋ 体幹中心軸・胸郭・骨盤バーを描画
    function redraw() {
        [ {idx: 1, c: canvas1, ctx: ctx1}, {idx: 2, c: canvas2, ctx: ctx2} ].forEach(item => {
            const s = state[item.idx];
            item.ctx.clearRect(0, 0, item.c.width, item.c.height);

            if (currentMode === 'ai') {
                if (item.idx === 1) {
                    // 1. 全身33箇所の骨格ワイヤーフレームを描画
                    if (s.rawLandmarks) {
                        item.ctx.save();
                        drawConnectors(item.ctx, s.rawLandmarks, POSE_CONNECTIONS, {
                            color: 'rgba(0, 255, 204, 0.45)', 
                            lineWidth: 2 
                        });
                        drawLandmarks(item.ctx, s.rawLandmarks, {
                            color: '#ff9500', 
                            fillColor: '#ffffff', 
                            lineWidth: 1.5, 
                            radius: 3 
                        });
                        item.ctx.restore();
                    }

                    // 2. 体幹傾斜・捻転差のバーと中心軸を描画
                    if (s.aiJoints && s.aiJoints.length === 4) {
                        const shoulderL = s.aiJoints[0];
                        const shoulderR = s.aiJoints[1];
                        const hipL = s.aiJoints[2];
                        const hipR = s.aiJoints[3];

                        const midThorax = { x: (shoulderL.x + shoulderR.x) / 2, y: (shoulderL.y + shoulderR.y) / 2 };
                        const midHip = { x: (hipL.x + hipR.x) / 2, y: (hipL.y + hipR.y) / 2 };

                        const currentFrame = Math.round(video1.currentTime * currentFPS);
                        const overrideData = getInterpolatedAiPoints(currentFrame);
                        
                        // 胸郭バー（赤色）
                        item.ctx.beginPath();
                        item.ctx.moveTo(shoulderL.x, shoulderL.y);
                        item.ctx.lineTo(shoulderR.x, shoulderR.y);
                        item.ctx.strokeStyle = '#ff375f';
                        item.ctx.lineWidth = 4;
                        item.ctx.stroke();

                        // 骨盤バー（青色）
                        item.ctx.beginPath();
                        item.ctx.moveTo(hipL.x, hipL.y);
                        item.ctx.lineTo(hipR.x, hipR.y);
                        item.ctx.strokeStyle = '#007aff';
                        item.ctx.lineWidth = 4;
                        item.ctx.stroke();

                        // 体幹の中心軸（緑色ライン）
                        let lineColor = '#00ffcc'; 
                        if (overrideData && overrideData.type === 'manual') lineColor = '#ff9500'; 
                        else if (overrideData && overrideData.type === 'interpolated') lineColor = '#ffcc00'; 

                        item.ctx.beginPath();
                        item.ctx.moveTo(midHip.x, midHip.y);
                        item.ctx.lineTo(midThorax.x, midThorax.y);
                        item.ctx.strokeStyle = lineColor;
                        item.ctx.lineWidth = 4;
                        item.ctx.stroke();

                        // 操作可能な4つの端点（大きめのオレンジ丸）
                        item.ctx.fillStyle = '#ff9500';
                        s.aiJoints.forEach(pt => {
                            item.ctx.beginPath(); item.ctx.arc(pt.x, pt.y, 8, 0, Math.PI * 2); item.ctx.fill();
                            item.ctx.strokeStyle = '#fff'; item.ctx.lineWidth = 2; item.ctx.stroke();
                        });
                    }
                }
                return; 
            }

            if (s.scalePoints.length === 2 && currentMode !== 'scale') {
                item.ctx.save(); item.ctx.strokeStyle = 'rgba(255, 149, 0, 0.4)'; item.ctx.lineWidth = 2; item.ctx.setLineDash([4, 4]);
                item.ctx.beginPath(); item.ctx.moveTo(s.scalePoints[0].x, s.scalePoints[0].y); item.ctx.lineTo(s.scalePoints[1].x, s.scalePoints[1].y); item.ctx.stroke(); item.ctx.restore();
            }
            if (currentMode === 'scale') {
                item.ctx.strokeStyle = '#ff9500'; item.ctx.fillStyle = '#ff9500'; item.ctx.lineWidth = 3; drawPointList(item.ctx, s.scalePoints, "基準"); return;
            }
            if (s.perpPoints.length > 0) {
                if (s.perpPoints.length === 1) {
                    item.ctx.fillStyle = '#ff2d55'; item.ctx.beginPath(); item.ctx.arc(s.perpPoints[0].x, s.perpPoints[0].y, 6, 0, Math.PI * 2); item.ctx.fill();
                } else if (s.perpPoints.length === 2) {
                    const p1 = s.perpPoints[0], p2 = s.perpPoints[1];
                    item.ctx.strokeStyle = '#00ffcc'; item.ctx.lineWidth = 2; item.ctx.beginPath(); item.ctx.moveTo(p1.x, p1.y); item.ctx.lineTo(p2.x, p2.y); item.ctx.stroke();
                    item.ctx.fillStyle = '#ff2d55'; item.ctx.beginPath(); item.ctx.arc(p2.x, p2.y, 6, 0, Math.PI * 2); item.ctx.fill();
                    const t = perpSlider.value / 100, pmX = p1.x + (p2.x - p1.x) * t, pmY = p1.y + (p2.y - p1.y) * t, dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy);
                    if (len > 0) {
                        const nx = -dy / len, ny = dx / len, perpLen = 2000;
                        item.ctx.strokeStyle = '#ff2d55'; item.ctx.lineWidth = 2; item.ctx.setLineDash([4, 4]);
                        item.ctx.beginPath(); item.ctx.moveTo(pmX - nx * perpLen, pmY - ny * perpLen); item.ctx.lineTo(pmX + nx * perpLen, pmY + ny * perpLen); item.ctx.stroke();
                        item.ctx.setLineDash([]);
                    }
                }
            }
            if (lastMeasureMode === 'cog' && s.cogPoints.length > 0) {
                item.ctx.save(); item.ctx.strokeStyle = 'rgba(255, 204, 0, 0.6)'; item.ctx.lineWidth = 2; item.ctx.beginPath();
                s.cogPoints.forEach((pt, i) => { if (i === 0) item.ctx.moveTo(pt.x, pt.y); else item.ctx.lineTo(pt.x, pt.y); }); item.ctx.stroke();
                s.cogPoints.forEach((pt, i) => {
                    const isLatest = (i === s.cogPoints.length - 1);
                    item.ctx.fillStyle = isLatest ? '#ff375f' : '#ffcc00'; item.ctx.beginPath(); item.ctx.arc(pt.x, pt.y, isLatest ? 7 : 5, 0, Math.PI * 2); item.ctx.fill();
                    item.ctx.fillStyle = '#fff'; item.ctx.font = isLatest ? 'bold 12px sans-serif' : '10px sans-serif'; item.ctx.fillText(`${i + 1}`, pt.x + 8, pt.y - 6);
                    if (pt.par !== undefined && pt.per !== undefined) {
                        const xVal = s.pxPerCm ? (pt.par / s.pxPerCm).toFixed(1) : pt.par.toFixed(1), yVal = s.pxPerCm ? (pt.per / s.pxPerCm).toFixed(1) : pt.per.toFixed(1);
                        item.ctx.fillStyle = '#00ffcc'; item.ctx.font = '9px sans-serif'; item.ctx.fillText(`左右 ${xVal > 0 ? '+' : ''}${xVal}`, pt.x + 8, pt.y + 6);
                        item.ctx.fillStyle = '#ff9500'; item.ctx.fillText(`上下 ${yVal > 0 ? '+' : ''}${yVal}`, pt.x + 8, pt.y + 16);
                    }
                });
                item.ctx.restore();
            }
            if (s.points.length > 0 && lastMeasureMode !== 'cog') {
                if (lastMeasureMode === 'angle') item.ctx.strokeStyle = item.ctx.fillStyle = '#00ffcc';
                else if (lastMeasureMode === 'distance') item.ctx.strokeStyle = item.ctx.fillStyle = '#ffcc00';
                else if (lastMeasureMode === 'accel') item.ctx.strokeStyle = item.ctx.fillStyle = '#ff375f';
                else if (lastMeasureMode === 'sim') item.ctx.strokeStyle = item.ctx.fillStyle = '#00ffcc';
                item.ctx.lineWidth = 3;
                let labels = lastMeasureMode === 'distance' ? ["始点", "終点"] : (lastMeasureMode === 'accel' ? ["点1", "点2", "点3"] : (lastMeasureMode === 'sim' ? ["根元", "関節", "先端"] : null));
                drawPointList(item.ctx, s.points, labels);
                if (lastMeasureMode === 'sim' && s.points.length === 3) {
                    const p2 = s.points[1], p3 = s.points[2], deltaDeg = parseFloat(simSlider.value), simP3 = simulateJointAngle(p2, p3, deltaDeg);
                    item.ctx.save(); item.ctx.strokeStyle = '#30d158'; item.ctx.fillStyle = '#30d158'; item.ctx.lineWidth = 3; item.ctx.setLineDash([5, 4]);
                    item.ctx.beginPath(); item.ctx.moveTo(p2.x, p2.y); item.ctx.lineTo(simP3.x, simP3.y); item.ctx.stroke(); item.ctx.setLineDash([]);
                    item.ctx.beginPath(); item.ctx.arc(simP3.x, simP3.y, 6, 0, Math.PI * 2); item.ctx.fill();
                    item.ctx.fillStyle = '#30d158'; item.ctx.font = 'bold 11px sans-serif'; item.ctx.fillText(`予測(${deltaDeg > 0 ? '+' : ''}${deltaDeg}°)`, simP3.x + 8, simP3.y - 4); item.ctx.restore();
                }
            }
        });
    }

    function drawPointList(cContext, ptList, labels) {
        if (ptList.length === 0) return;
        cContext.beginPath();
        for (let i = 0; i < ptList.length; i++) { if (i === 0) cContext.moveTo(ptList[i].x, ptList[i].y); else cContext.lineTo(ptList[i].x, ptList[i].y); }
        cContext.stroke();
        for (let i = 0; i < ptList.length; i++) {
            cContext.beginPath(); cContext.arc(ptList[i].x, ptList[i].y, 6, 0, Math.PI * 2); cContext.fill();
            if (labels) {
                const text = Array.isArray(labels) ? labels[i] : `${labels}${i + 1}`;
                if (text) { cContext.fillStyle = '#fff'; cContext.font = 'bold 10px sans-serif'; cContext.fillText(text, ptList[i].x + 7, ptList[i].y - 5); cContext.fillStyle = cContext.strokeStyle; }
            }
        }
    }

    function captureSnapshot() {
        if (!video1.videoWidth && !video2.videoWidth) { alert("動画が読み込まれていません"); return; }
        const snapCanvas = document.createElement('canvas'), snapCtx = snapCanvas.getContext('2d');
        const w = (compareMode === 1) ? canvas1.width * 2 : canvas1.width, h = canvas1.height;
        snapCanvas.width = w; snapCanvas.height = h + 60;
        snapCtx.fillStyle = '#000'; snapCtx.fillRect(0, 0, snapCanvas.width, snapCanvas.height);
        if (video1.videoWidth) { snapCtx.drawImage(video1, 0, 0, canvas1.width, h); snapCtx.drawImage(canvas1, 0, 0); }
        if (compareMode === 1 && video2.videoWidth) { snapCtx.drawImage(video2, canvas1.width, 0, canvas1.width, h); snapCtx.drawImage(canvas2, canvas1.width, 0); } 
        else if (compareMode === 2 && video2.videoWidth) { snapCtx.globalAlpha = 0.5; snapCtx.drawImage(video2, 0, 0, canvas1.width, h); snapCtx.drawImage(canvas2, 0, 0); snapCtx.globalAlpha = 1.0; }
        snapCtx.fillStyle = '#1c1c1e'; snapCtx.fillRect(0, h, snapCanvas.width, 60);
        snapCtx.fillStyle = '#00ffcc'; snapCtx.font = 'bold 14px -apple-system, sans-serif'; snapCtx.fillText(mainResult.innerText.replace(/<[^>]*>?/gm, ''), 15, h + 24);
        snapCtx.fillStyle = '#ccc'; snapCtx.font = '11px -apple-system, sans-serif'; snapCtx.fillText(subResult.innerText.replace(/<[^>]*>?/gm, ' '), 15, h + 46);
        document.getElementById('snapshot-img').src = snapCanvas.toDataURL('image/png'); document.getElementById('snapshot-modal-overlay').style.display = 'flex';
    }
    function closeSnapshotModal() { document.getElementById('snapshot-modal-overlay').style.display = 'none'; }

    // ==========================================
    // ▼ ここから MediaPipe (AI自動解析) のコード ▼
    // ==========================================

    const pose = new Pose({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }});
    
    pose.setOptions({
        modelComplexity: 2, 
        smoothLandmarks: true,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
    });

    pose.onResults((results) => {
        if (currentMode !== 'ai') return; 

        const currentFrame = Math.round(video1.currentTime * currentFPS);
        
        // 全身33点のランドマークデータを保持
        state[1].rawLandmarks = results.poseLandmarks || null;

        const overrideData = getInterpolatedAiPoints(currentFrame);
        if (overrideData) {
            state[1].aiJoints = overrideData.joints.map(j => ({ x: j.x, y: j.y, z: j.z || 0 }));
            calcAiResults(overrideData.type);
            redraw();
            return;
        }

        if (!results.poseLandmarks) {
            mainResult.innerHTML = `🤖 AI自動計測 ｜ 人物が検出できません`;
            return;
        }
        
        const landmarks = results.poseLandmarks;
        const getPos = (lm) => ({ x: lm.x * canvas1.width, y: lm.y * canvas1.height, z: lm.z || 0 });
        
        const shoulderL = getPos(landmarks[11]);
        const shoulderR = getPos(landmarks[12]);
        const hipL = getPos(landmarks[23]);
        const hipR = getPos(landmarks[24]);

        state[1].aiJoints = [shoulderL, shoulderR, hipL, hipR];
        calcAiResults('ai');
        redraw();
    });

    async function detectFrame() {
        if (currentMode === 'ai' && !video1.paused && !video1.ended && video1.readyState >= 2) {
            await pose.send({image: video1});
            requestAnimationFrame(detectFrame);
        }
    }

    video1.addEventListener('play', () => { 
        if (currentMode === 'ai') detectFrame(); 
    });
    
    video1.addEventListener('seeked', async () => { 
        if (currentMode === 'ai' && video1.readyState >= 2) {
            await pose.send({image: video1}); 
        }
    });

</script>
