<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="動作分析Pro">
<title>動作分析 Pro</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        width: 100%;
        height: 100dvh;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    
    #header {
        width: 100%;
        background: #1c1c1e;
        padding-top: calc(8px + env(safe-area-inset-top));
        padding-left: calc(10px + env(safe-area-inset-left));
        padding-right: calc(10px + env(safe-area-inset-right));
        padding-bottom: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        border-bottom: 1px solid #333;
        z-index: 10;
        flex-shrink: 0;
    }
    .header-top-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
    }
    .btn-group-header {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: nowrap;
    }
    .hdr-btn {
        -webkit-appearance: none;
        appearance: none;
        background: #007aff;
        color: white;
        border: none;
        padding: 6px 8px;
        border-radius: 6px;
        font-weight: bold;
        font-size: 11px;
        cursor: pointer;
        white-space: nowrap;
    }
    .hdr-btn.secondary { background: #3a3a3c; }
    .hdr-btn.compare-parallel { background: #af52de; color: #fff; }
    .hdr-btn.compare-overlay { background: #ff2d55; color: #fff; }
    .hdr-btn.fps-badge { background: #30d158; color: #000; font-size: 10px; }
    
    #scale-info-text { font-size: 10px; color: #ff9500; font-weight: 600; text-align: right; white-space: nowrap; }
    
    #result-box {
        width: 100%;
        background: #262629;
        border-radius: 6px;
        padding: 6px 8px;
        border: 1px solid #3a3a3c;
    }
    #main-result { color: #00ffcc; font-size: 13px; font-weight: bold; line-height: 1.2; }
    #sub-result { color: #aaa; font-size: 11px; margin-top: 2px; font-weight: 500; line-height: 1.2; }
    .highlight-acc { color: #ff375f; font-weight: bold; }
    .highlight-speed { color: #ffcc00; font-weight: bold; }

    #stage {
        width: 100%;
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        background: #000;
        overflow: hidden;
    }
    .video-pane {
        position: relative;
        flex: 1;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #000;
    }
    .zoom-target {
        width: 100%;
        height: 100%;
        position: relative;
        transform-origin: center center;
    }
    #pane2 { display: none; border-left: 2px solid #555; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; pointer-events: auto; }

    #controls {
        width: 100%;
        background: #1c1c1e;
        padding-top: 6px;
        padding-left: calc(10px + env(safe-area-inset-left));
        padding-right: calc(10px + env(safe-area-inset-right));
        padding-bottom: calc(8px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 6px;
        border-top: 1px solid #333;
        flex-shrink: 0;
    }
    
    .seek-container { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .seek-row { display: flex; align-items: center; gap: 6px; width: 100%; }
    .seek-label { font-size: 10px; font-weight: bold; color: #007aff; width: 16px; flex-shrink: 0; }
    .seek-label.v2 { color: #af52de; }
    input[type=range] { flex: 1; height: 20px; accent-color: #007aff; }
    #seekbar2 { accent-color: #af52de; }
    #perp-slider { accent-color: #ff2d55; }

    .mode-grid {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
    }
    button.ctrl-btn {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        padding: 7px 0;
        background: #2c2c2e;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
    }
    button.ctrl-btn:active { background: #444; }
    button.mode-active { background: #30d158; color: black; font-weight: bold; }
    #btn-mode-acc.mode-active { background: #ff375f; color: white; font-weight: bold; }
    #btn-mode-scale.mode-active { background: #ff9500; color: black; font-weight: bold; }
    #btn-mode-zoom.mode-active { background: #007aff; color: white; font-weight: bold; }
    #btn-mode-perp.mode-active { background: #ff2d55; color: white; font-weight: bold; }
    
    .playback-row {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1.3fr 1fr 0.9fr 1fr;
        gap: 5px;
    }
    #btn-play { background: #34c759; color: #000; font-weight: bold; }
    #btn-clear { background: #ff3b30; }

    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center;
        z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal-card {
        background: #2c2c2e; border: 1px solid #444; border-radius: 12px; width: 90%; max-width: 340px;
        padding: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .modal-card h3 { font-size: 15px; margin-bottom: 6px; color: #ff9500; }
    .modal-card p { font-size: 12px; color: #ccc; margin-bottom: 12px; }
    .modal-input-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 14px; }
    .modal-input-row input {
        width: 100px; font-size: 16px; padding: 6px; text-align: center;
        border-radius: 6px; border: 1px solid #555; background: #1c1c1e; color: #fff;
        user-select: auto; -webkit-user-select: auto;
    }
    .modal-btn-row { display: flex; gap: 8px; }
    .modal-btn-row button {
        -webkit-appearance: none; appearance: none;
        flex: 1; padding: 8px 0; border: none; border-radius: 6px; font-size: 13px; font-weight: bold;
    }
    #snapshot-img { max-width: 100%; max-height: 50vh; border-radius: 6px; border: 1px solid #555; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="header">
    <div class="header-top-row">
        <div class="btn-group-header">
            <button class="hdr-btn" onclick="triggerPickVideo(1)">動画①</button>
            <button class="hdr-btn secondary" id="btn-pick2" style="display:none;" onclick="triggerPickVideo(2)">動画②</button>
            <button class="hdr-btn secondary" id="btn-toggle-compare" onclick="toggleCompareMode()">1画面のみ</button>
            <button class="hdr-btn fps-badge" id="btn-fps" onclick="toggleFPS()">30fps</button>
            <button class="hdr-btn" style="background:#5856d6;" onclick="captureSnapshot()">📸 保存</button>
        </div>
        <span id="scale-info-text">物差し: 未設定</span>
        <input type="file" id="file-input-1" accept="video/*" style="display:none">
        <input type="file" id="file-input-2" accept="video/*" style="display:none">
    </div>
    <div id="result-box">
        <div id="main-result">動画①を選択してください</div>
        <div id="sub-result"></div>
    </div>
</div>

<div id="stage">
    <div class="video-pane" id="pane1">
        <div class="zoom-target" id="zoom-target-1">
            <video id="video1" playsinline webkit-playsinline muted></video>
            <canvas id="canvas1"></canvas>
        </div>
    </div>
    <div class="video-pane" id="pane2">
        <div class="zoom-target" id="zoom-target-2">
            <video id="video2" playsinline webkit-playsinline muted></video>
            <canvas id="canvas2"></canvas>
        </div>
    </div>
</div>

<div id="controls">
    <div class="seek-container">
        <div class="seek-row">
            <span class="seek-label">①</span>
            <input type="range" id="seekbar1" min="0" max="100" value="0" step="0.001">
        </div>
        <div class="seek-row" id="seek-row-2" style="display:none;">
            <span class="seek-label v2">②</span>
            <input type="range" id="seekbar2" min="0" max="100" value="0" step="0.001">
        </div>
    </div>
    
    <div class="mode-grid">
        <button class="ctrl-btn mode-active" id="btn-mode-angle" onclick="setMode('angle')">角度(3点)</button>
        <button class="ctrl-btn" id="btn-mode-dist" onclick="setMode('distance')">速度(2点)</button>
        <button class="ctrl-btn" id="btn-mode-acc" onclick="setMode('accel')">加速(3点)</button>
        <button class="ctrl-btn" id="btn-mode-perp" onclick="setMode('perp')">垂直線(2点)</button>
        <button class="ctrl-btn" id="btn-mode-scale" onclick="setMode('scale')">基準</button>
        <button class="ctrl-btn" id="btn-mode-zoom" onclick="setMode('zoom')">🔍移動</button>
    </div>
    
    <div id="zoom-controls" style="display:none; width:100%; align-items:center; gap:8px;">
        <span style="font-size:11px; font-weight:bold; color:#007aff;">倍率(画面<span id="zoom-target-label">①</span>)</span>
        <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1">
        <button class="ctrl-btn" style="width:auto; padding:5px 12px; background:#444;" onclick="resetZoom()">リセット</button>
    </div>

    <div id="perp-controls" style="display:none; width:100%; align-items:center; gap:8px;">
        <span style="font-size:11px; font-weight:bold; color:#ff2d55;">垂直線移動</span>
        <input type="range" id="perp-slider" min="0" max="100" step="0.5" value="50">
    </div>

    <div class="playback-row">
        <button class="ctrl-btn" onclick="stepFrame(-1)">◀ -1</button>
        <button class="ctrl-btn" id="btn-play" onclick="togglePlay()">▶ 再生</button>
        <button class="ctrl-btn" onclick="stepFrame(1)">+1 ▶</button>
        <button class="ctrl-btn" id="btn-speed" onclick="togglePlaybackRate()">1.0x</button>
        <button class="ctrl-btn" id="btn-clear" onclick="clearCurrentPoints()">クリア</button>
    </div>
</div>

<div id="scale-modal-overlay" class="modal-overlay">
    <div class="modal-card">
        <h3 id="scale-modal-title">基準物の長さ設定 (動画①)</h3>
        <p>指定した2点間の実際の長さを入力</p>
        <div class="modal-input-row">
            <input type="number" id="scale-input-value" inputmode="decimal" placeholder="100" value="100">
            <span style="font-weight:bold; font-size:15px;">cm</span>
        </div>
        <div class="modal-btn-row">
            <button style="background:#444; color:#fff;" onclick="cancelScaleModal()">キャンセル</button>
            <button style="background:#ff9500; color:#000;" onclick="submitScaleModal()">確定</button>
        </div>
    </div>
</div>

<div id="snapshot-modal-overlay" class="modal-overlay">
    <div class="modal-card" style="max-width:360px;">
        <h3 style="color:#5856d6;">📸 スクリーンショット</h3>
        <p style="font-size:11px; color:#aaa;">画像を長押しして「写真に追加」で保存できます</p>
        <img id="snapshot-img" src="" alt="Screenshot">
        <div class="modal-btn-row">
            <button style="background:#444; color:#fff;" onclick="closeSnapshotModal()">閉じる</button>
        </div>
    </div>
</div>

<script>
    const video1 = document.getElementById('video1');
    const canvas1 = document.getElementById('canvas1');
    const ctx1 = canvas1.getContext('2d');

    const video2 = document.getElementById('video2');
    const canvas2 = document.getElementById('canvas2');
    const ctx2 = canvas2.getContext('2d');

    const pane2 = document.getElementById('pane2');
    const btnPick2 = document.getElementById('btn-pick2');
    const btnToggleCompare = document.getElementById('btn-toggle-compare');
    const btnFps = document.getElementById('btn-fps');
    const seekbar1 = document.getElementById('seekbar1');
    const seekbar2 = document.getElementById('seekbar2');
    const seekRow2 = document.getElementById('seek-row-2');
    const mainResult = document.getElementById('main-result');
    const subResult = document.getElementById('sub-result');
    const scaleInfoText = document.getElementById('scale-info-text');
    const btnPlay = document.getElementById('btn-play');
    const btnSpeed = document.getElementById('btn-speed');

    const fileInput1 = document.getElementById('file-input-1');
    const fileInput2 = document.getElementById('file-input-2');

    const btnModeAngle = document.getElementById('btn-mode-angle');
    const btnModeDist = document.getElementById('btn-mode-dist');
    const btnModeAcc = document.getElementById('btn-mode-acc');
    const btnModeScale = document.getElementById('btn-mode-scale');
    const btnModeZoom = document.getElementById('btn-mode-zoom');
    const btnModePerp = document.getElementById('btn-mode-perp');
    const perpSlider = document.getElementById('perp-slider');
    
    const scaleModalOverlay = document.getElementById('scale-modal-overlay');
    const scaleModalTitle = document.getElementById('scale-modal-title');
    const scaleInputValue = document.getElementById('scale-input-value');

    let compareMode = 0; 
    let currentMode = 'angle';
    let lastMeasureMode = 'angle';
    
    let currentFPS = 30.0;
    const fpsList = [30, 60, 120, 240];
    let fpsIdx = 0;

    function toggleFPS() {
        fpsIdx = (fpsIdx + 1) % fpsList.length;
        currentFPS = fpsList[fpsIdx];
        btnFps.innerText = `${currentFPS}fps`;
        
        [1, 2].forEach(idx => {
            const s = state[idx];
            if (s.points.length > 0) {
                s.points.forEach(p => { if (p.frame !== undefined) p.time = p.frame / currentFPS; });
            }
            calcResults(s, lastMeasureMode, false, idx);
        });
        updateDisplayResult();
    }

    let isPlaying = false;
    let playbackRates = [1.0, 0.5, 0.25];
    let currentRateIdx = 0;

    const state = {
        1: { points: [], scalePoints: [], perpPoints: [], pxPerCm: null, resultMain: "", resultSub: "" },
        2: { points: [], scalePoints: [], perpPoints: [], pxPerCm: null, resultMain: "", resultSub: "" }
    };
    
    const viewState = {
        1: { scale: 1, x: 0, y: 0 },
        2: { scale: 1, x: 0, y: 0 }
    };

    let scaleTarget = 1;
    let lastActiveTarget = 1;
    let tempDistPx = 0;
    let historyData = []; 

    function calcResults(s, mode, isNewPoint = false, targetIdx = 1) {
        if (mode === 'angle') {
            if (s.points.length === 3) {
                const p1 = s.points[0], p2 = s.points[1], p3 = s.points[2];
                const v1 = {x: p1.x - p2.x, y: p1.y - p2.y};
                const v2 = {x: p3.x - p2.x, y: p3.y - p2.y};
                const dot = v1.x * v2.x + v1.y * v2.y;
                const mag1 = Math.hypot(v1.x, v1.y), mag2 = Math.hypot(v2.x, v2.y);
                if (mag1 * mag2 !== 0) {
                    let cosVal = Math.max(-1.0, Math.min(1.0, dot / (mag1 * mag2)));
                    let angle = Math.acos(cosVal) * (180 / Math.PI);
                    s.resultMain = `関節角度: ${angle.toFixed(1)}°`;
                    s.resultSub = `頂点(2点目)を中心とした角度`;
                }
            } else {
                s.resultMain = s.points.length === 0 ? "角度モード: 3点をタップ" : `点 ${s.points.length}/3`;
                s.resultSub = s.points.length === 1 ? "2点目(頂点)をタップ" : "頂点(2点目)を中心とした角度を測定";
            }
        } else if (mode === 'distance') {
            if (s.points.length === 2) {
                const p1 = s.points[0], p2 = s.points[1];
                const dx = p2.x - p1.x, dy = -(p2.y - p1.y);
                const dist = Math.hypot(dx, dy);
                const dt = Math.abs(p2.time - p1.time);
                s.resultMain = `距離: ${formatDistance(dist, s.pxPerCm)}`;
                if (dt > 0 && s.pxPerCm) {
                    const speedKMH = ((dist / s.pxPerCm) / 100) / dt * 3.6;
                    s.resultSub = `速度: <span class="highlight-speed">${speedKMH.toFixed(1)}km/h</span> (${currentFPS}fps)`;
                    if (isNewPoint) historyData.push({ target: targetIdx, time: p2.time, speedKMH, accelG: null });
                }
            } else {
                s.resultMain = s.points.length === 0 ? "速度モード: 始点→終点をタップ" : "始点を記録";
                s.resultSub = "1点目タップ後、コマ送りして2点目をタップ";
            }
        } else if (mode === 'accel') {
            if (s.points.length === 3) {
                const p1 = s.points[0], p2 = s.points[1], p3 = s.points[2];
                const dt1 = Math.abs(p2.time - p1.time), dt2 = Math.abs(p3.time - p2.time);
                const dist1 = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                const dist2 = Math.hypot(p3.x - p2.x, p3.y - p2.y);
                if (dt1 > 0 && dt2 > 0 && s.pxPerCm) {
                    const v1 = ((dist1 / s.pxPerCm) / 100) / dt1;
                    const v2 = ((dist2 / s.pxPerCm) / 100) / dt2;
                    const accel = (v2 - v1) / ((dt1 + dt2) / 2);
                    const gForce = accel / 9.80665;
                    s.resultMain = `<span class="highlight-acc">加速度: ${accel > 0 ? '+' : ''}${accel.toFixed(2)}m/s² (${gForce > 0 ? '+' : ''}${gForce.toFixed(2)}G)</span>`;
                    s.resultSub = `①:${(v1 * 3.6).toFixed(1)}k → ②:${(v2 * 3.6).toFixed(1)}k (${currentFPS}fps)`;
                    if (isNewPoint) historyData.push({ target: targetIdx, time: p3.time, speedKMH: v2 * 3.6, accelG: gForce });
                }
            } else {
                s.resultMain = s.points.length === 0 ? "加速度モード: 連続3点をタップ" : `点 ${s.points.length}/3`;
                s.resultSub = "コマ送りしながら 始点 → 中間 → 終点 をタップ";
            }
        } else if (mode === 'perp') {
            s.resultMain = `垂直線モード`;
            s.resultSub = `下のスライダーで垂直線を動かせます`;
        }
    }

    function applyZoom(idx) {
        const target = document.getElementById(`zoom-target-${idx}`);
        target.style.transform = `translate(${viewState[idx].x}px, ${viewState[idx].y}px) scale(${viewState[idx].scale})`;
    }

    function resetZoom() {
        viewState[lastActiveTarget] = { scale: 1, x: 0, y: 0 };
        document.getElementById('zoom-slider').value = 1;
        applyZoom(lastActiveTarget);
    }

    document.getElementById('zoom-slider').addEventListener('input', e => {
        viewState[lastActiveTarget].scale = parseFloat(e.target.value);
        applyZoom(lastActiveTarget);
    });
    
    perpSlider.addEventListener('input', redraw);

    function fitCanvases() {
        [ {c: canvas1, v: video1}, {c: canvas2, v: video2} ].forEach(item => {
            item.c.width = item.c.parentElement.clientWidth;
            item.c.height = item.c.parentElement.clientHeight;
        });
        redraw();
    }
    window.addEventListener('resize', fitCanvases);

    function triggerPickVideo(idx) {
        if (idx === 1) fileInput1.click();
        else fileInput2.click();
    }

    fileInput1.addEventListener('change', e => loadVideoFile(e.target.files[0], video1));
    fileInput2.addEventListener('change', e => loadVideoFile(e.target.files[0], video2));

    function loadVideoFile(file, vidElem) {
        if (file) {
            vidElem.muted = true;
            vidElem.src = URL.createObjectURL(file);
            vidElem.load();
        }
    }

    video1.addEventListener('loadedmetadata', () => {
        fitCanvases();
        seekbar1.max = video1.duration;
        seekbar1.value = 0;
        setMode(currentMode);
    });

    video2.addEventListener('loadedmetadata', () => {
        fitCanvases();
        seekbar2.max = video2.duration;
        seekbar2.value = 0;
    });

    video1.addEventListener('timeupdate', () => { if (!seeking1) seekbar1.value = video1.currentTime; });
    video2.addEventListener('timeupdate', () => { if (!seeking2) seekbar2.value = video2.currentTime; });

    function toggleCompareMode() {
        compareMode = (compareMode + 1) % 3;
        btnToggleCompare.classList.remove('compare-parallel', 'compare-overlay');

        if (compareMode === 1) {
            pane2.style.display = 'flex';
            pane2.style.position = 'relative';
            pane2.style.opacity = '1';
            pane2.style.borderLeft = '2px solid #555';
            pane2.style.pointerEvents = 'auto'; 
            btnPick2.style.display = 'inline-block';
            seekRow2.style.display = 'flex';
            btnToggleCompare.classList.add('compare-parallel');
            btnToggleCompare.innerText = '並列表示';
        } else if (compareMode === 2) {
            pane2.style.display = 'flex';
            pane2.style.position = 'absolute';
            pane2.style.top = '0';
            pane2.style.left = '0';
            pane2.style.width = '100%';
            pane2.style.height = '100%';
            pane2.style.opacity = '0.5'; 
            pane2.style.borderLeft = 'none';
            pane2.style.pointerEvents = 'none'; 
            btnPick2.style.display = 'inline-block';
            seekRow2.style.display = 'flex';
            btnToggleCompare.classList.add('compare-overlay');
            btnToggleCompare.innerText = '重ね透かし';
        } else {
            pane2.style.display = 'none';
            pane2.style.position = 'relative';
            pane2.style.opacity = '1';
            pane2.style.borderLeft = '2px solid #555';
            pane2.style.pointerEvents = 'auto';
            btnPick2.style.display = 'none';
            seekRow2.style.display = 'none';
            btnToggleCompare.innerText = '1画面のみ';
            if (video2) video2.pause();
        }
        updateScaleInfoText();
        updateDisplayResult();
        setTimeout(fitCanvases, 50);
    }

    async function togglePlay() {
        if (!video1.duration && !video2.duration) return;
        isPlaying = !isPlaying;
        if (isPlaying) {
            video1.muted = true;
            video2.muted = true;
            try {
                const playPromises = [];
                if (video1.duration) playPromises.push(video1.play());
                if (compareMode > 0 && video2.duration) playPromises.push(video2.play());
                await Promise.all(playPromises);
            } catch (err) {}
            btnPlay.innerText = '⏸ 停止';
            btnPlay.style.background = '#ff9500';
        } else {
            if (video1.duration) video1.pause();
            if (compareMode > 0 && video2.duration) video2.pause();
            btnPlay.innerText = '▶ 再生';
            btnPlay.style.background = '#34c759';
        }
    }

    function togglePlaybackRate() {
        currentRateIdx = (currentRateIdx + 1) % playbackRates.length;
        const rate = playbackRates[currentRateIdx];
        video1.playbackRate = rate;
        video2.playbackRate = rate;
        btnSpeed.innerText = `${rate}x`;
    }

    let seeking1 = false;
    seekbar1.addEventListener('input', () => { seeking1 = true; video1.currentTime = seekbar1.value; });
    seekbar1.addEventListener('change', () => { seeking1 = false; });

    let seeking2 = false;
    seekbar2.addEventListener('input', () => { seeking2 = true; video2.currentTime = seekbar2.value; });
    seekbar2.addEventListener('change', () => { seeking2 = false; });

    function stepFrame(dir) {
        const stepSec = dir / currentFPS;
        if (video1.duration) video1.currentTime = Math.max(0, Math.min(video1.duration, video1.currentTime + stepSec));
        if (compareMode > 0 && video2.duration) video2.currentTime = Math.max(0, Math.min(video2.duration, video2.currentTime + stepSec));
    }

    function updateDisplayResult() {
        if (currentMode === 'zoom') return; 
        if (compareMode === 0) {
            mainResult.innerHTML = state[1].resultMain || "測定したい点をタップしてください";
            subResult.innerHTML = state[1].resultSub || "";
        } else {
            const r1 = state[1].resultMain ? `① ${state[1].resultMain}` : "① 未測定";
            const r2 = state[2].resultMain ? `② ${state[2].resultMain}` : "② 未測定";
            mainResult.innerHTML = `${r1} ｜ ${r2}`;
            const sub1 = state[1].resultSub ? `①: ${state[1].resultSub}` : "";
            const sub2 = state[2].resultSub ? `②: ${state[2].resultSub}` : "";
            subResult.innerHTML = [sub1, sub2].filter(Boolean).join("<br>");
        }
    }

    function updateScaleInfoText() {
        const s1 = state[1].pxPerCm ? `①${(state[1].pxPerCm).toFixed(1)}px/cm` : "①未設定";
        const s2 = state[2].pxPerCm ? `②${(state[2].pxPerCm).toFixed(1)}px/cm` : "②未設定";
        scaleInfoText.innerText = (compareMode > 0) ? `物差し: ${s1} | ${s2}` : `物差し: ${s1}`;
    }

    function setMode(mode) {
        const mainModes = ['angle', 'distance', 'accel'];
        if (mainModes.includes(mode) && mode !== lastMeasureMode) {
            state[1].points = [];
            state[2].points = [];
        }
        
        if (mode !== 'zoom') {
            if (mainModes.includes(mode)) lastMeasureMode = mode;
            currentMode = mode;
        } else {
            currentMode = mode; 
        }
        
        [btnModeAngle, btnModeDist, btnModeAcc, btnModeScale, btnModeZoom, btnModePerp].forEach(b => b.classList.remove('mode-active'));

        document.getElementById('zoom-controls').style.display = (mode === 'zoom') ? 'flex' : 'none';
        const showPerp = (mode === 'perp' || state[1].perpPoints.length === 2 || state[2].perpPoints.length === 2);
        document.getElementById('perp-controls').style.display = showPerp ? 'flex' : 'none';

        if (mode === 'zoom') {
            btnModeZoom.classList.add('mode-active');
            document.getElementById('zoom-target-label').innerText = lastActiveTarget === 1 ? '①' : '②';
            document.getElementById('zoom-slider').value = viewState[lastActiveTarget].scale;
        } else {
            if (mode === 'angle') btnModeAngle.classList.add('mode-active');
            else if (mode === 'distance') btnModeDist.classList.add('mode-active');
            else if (mode === 'accel') btnModeAcc.classList.add('mode-active');
            else if (mode === 'scale') btnModeScale.classList.add('mode-active');
            else if (mode === 'perp') btnModePerp.classList.add('mode-active');
        }
        
        if (mode === 'scale') {
            state[1].scalePoints = [];
            state[2].scalePoints = [];
            updateScaleInfoText();
            state[1].resultMain = "物差し設定: 基準物の両端（2点）をタップ";
            state[1].resultSub = "長さを設定したい画面で2箇所タップ";
            state[2].resultMain = "";
            state[2].resultSub = "";
        } else if (mode !== 'zoom') {
            [1, 2].forEach(idx => calcResults(state[idx], mode, false, idx));
        }
        
        updateDisplayResult();
        redraw();
    }

    function clearCurrentPoints() {
        if (currentMode === 'perp') {
            state[1].perpPoints = [];
            state[2].perpPoints = [];
            perpSlider.value = 50;
            document.getElementById('perp-controls').style.display = 'none';
        } else {
            state[1].points = [];
            state[2].points = [];
        }
        [1, 2].forEach(idx => calcResults(state[idx], currentMode, false, idx));
        updateDisplayResult();
        redraw();
    }

    function formatDistance(px, pxPerCm) {
        if (!pxPerCm) return `${px.toFixed(1)} px`;
        const cm = px / pxPerCm;
        if (cm >= 100) return `${(cm / 100).toFixed(2)} m (${cm.toFixed(1)} cm)`;
        return `${cm.toFixed(1)} cm`;
    }

    let isTouchPanning = false;
    let panStartX = 0, panStartY = 0;
    let panStartOffsetX = 0, panStartOffsetY = 0;
    let pinchInitialDist = 0;
    let pinchInitialScale = 1;
    let pinchTarget = 1;

    document.getElementById('stage').addEventListener('touchstart', e => {
        if (currentMode !== 'zoom') return;
        const targetIdx = e.target.closest('#pane2') ? 2 : 1;
        lastActiveTarget = targetIdx;
        document.getElementById('zoom-target-label').innerText = targetIdx === 1 ? '①' : '②';
        document.getElementById('zoom-slider').value = viewState[targetIdx].scale;

        if (e.touches.length === 1) {
            isTouchPanning = true;
            panStartX = e.touches[0].clientX;
            panStartY = e.touches[0].clientY;
            panStartOffsetX = viewState[targetIdx].x;
            panStartOffsetY = viewState[targetIdx].y;
        } else if (e.touches.length === 2) {
            isTouchPanning = false;
            e.preventDefault();
            pinchTarget = targetIdx;
            pinchInitialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            pinchInitialScale = viewState[targetIdx].scale;
        }
    }, {passive: false});

    document.getElementById('stage').addEventListener('touchmove', e => {
        if (currentMode !== 'zoom') return;
        e.preventDefault(); 
        if (isTouchPanning && e.touches.length === 1) {
            const scale = viewState[lastActiveTarget].scale;
            const dx = (e.touches[0].clientX - panStartX) / scale;
            const dy = (e.touches[0].clientY - panStartY) / scale;
            viewState[lastActiveTarget].x = panStartOffsetX + dx;
            viewState[lastActiveTarget].y = panStartOffsetY + dy;
            applyZoom(lastActiveTarget);
        } else if (e.touches.length === 2) {
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            let newScale = pinchInitialScale * (dist / pinchInitialDist);
            newScale = Math.max(1, Math.min(newScale, 5));
            viewState[pinchTarget].scale = newScale;
            applyZoom(pinchTarget);
            document.getElementById('zoom-slider').value = newScale;
        }
    }, {passive: false});

    document.getElementById('stage').addEventListener('touchend', e => {
        if (e.touches.length === 0) isTouchPanning = false;
    }, {passive: false});

    canvas1.addEventListener('pointerdown', (e) => { if (currentMode !== 'zoom') handleCanvasTap(e, canvas1, video1, 1); });
    canvas2.addEventListener('pointerdown', (e) => { if (currentMode !== 'zoom') handleCanvasTap(e, canvas2, video2, 2); });

    function handleCanvasTap(e, cvs, vid, targetIdx) {
        lastActiveTarget = targetIdx;
        const s = state[targetIdx];
        
        const rect = cvs.getBoundingClientRect();
        const scaleX = cvs.width / rect.width;
        const scaleY = cvs.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        const currentTime = vid.currentTime;
        const currentFrame = Math.round(currentTime * currentFPS);

        if (currentMode === 'scale') {
            s.scalePoints.push({x, y});
            if (s.scalePoints.length === 2) {
                const p1 = s.scalePoints[0], p2 = s.scalePoints[1];
                tempDistPx = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                scaleTarget = targetIdx;
                scaleModalTitle.innerText = `基準物の長さ設定 (動画${targetIdx === 1 ? '①' : '②'})`;
                scaleModalOverlay.style.display = 'flex';
                scaleInputValue.focus();
                scaleInputValue.select();
            }
            redraw();
            return;
        }

        if (currentMode === 'perp') {
            if (s.perpPoints.length >= 2) s.perpPoints = [];
            s.perpPoints.push({x, y});
            calcResults(s, currentMode, true, targetIdx);
            if (s.perpPoints.length === 2) {
                document.getElementById('perp-controls').style.display = 'flex';
            }
            updateDisplayResult();
            redraw();
            return;
        }

        const maxPoints = (currentMode === 'distance') ? 2 : 3;
        if (s.points.length >= maxPoints) s.points = [];
        s.points.push({x, y, time: currentTime, frame: currentFrame});

        calcResults(s, currentMode, true, targetIdx);
        updateDisplayResult();
        redraw();
    }

    function submitScaleModal() {
        const realCm = parseFloat(scaleInputValue.value);
        if (realCm && realCm > 0) {
            state[scaleTarget].pxPerCm = tempDistPx / realCm;
            updateScaleInfoText();
            scaleModalOverlay.style.display = 'none';
            setMode('distance');
        } else {
            alert("有効な数値を入力してください");
        }
    }
    function cancelScaleModal() {
        state[scaleTarget].scalePoints = [];
        scaleModalOverlay.style.display = 'none';
        setMode('scale');
    }

    function redraw() {
        [ {idx: 1, c: canvas1, ctx: ctx1}, {idx: 2, c: canvas2, ctx: ctx2} ].forEach(item => {
            const s = state[item.idx];
            item.ctx.clearRect(0, 0, item.c.width, item.c.height);

            if (s.scalePoints.length === 2 && currentMode !== 'scale') {
                item.ctx.save();
                item.ctx.strokeStyle = 'rgba(255, 149, 0, 0.4)';
                item.ctx.lineWidth = 2; item.ctx.setLineDash([4, 4]);
                item.ctx.beginPath();
                item.ctx.moveTo(s.scalePoints[0].x, s.scalePoints[0].y);
                item.ctx.lineTo(s.scalePoints[1].x, s.scalePoints[1].y);
                item.ctx.stroke();
                item.ctx.restore();
            }

            if (currentMode === 'scale') {
                item.ctx.strokeStyle = '#ff9500'; item.ctx.fillStyle = '#ff9500'; item.ctx.lineWidth = 3;
                drawPointList(item.ctx, s.scalePoints, "基準");
                return;
            }

            if (s.perpPoints.length > 0) {
                if (s.perpPoints.length === 1) {
                    item.ctx.fillStyle = '#ff2d55';
                    item.ctx.beginPath();
                    item.ctx.arc(s.perpPoints[0].x, s.perpPoints[0].y, 5, 0, Math.PI * 2);
                    item.ctx.fill();
                } else if (s.perpPoints.length === 2) {
                    const p1 = s.perpPoints[0], p2 = s.perpPoints[1];
                    item.ctx.strokeStyle = '#00ffcc';
                    item.ctx.lineWidth = 2;
                    item.ctx.beginPath();
                    item.ctx.moveTo(p1.x, p1.y);
                    item.ctx.lineTo(p2.x, p2.y);
                    item.ctx.stroke();

                    item.ctx.fillStyle = '#ff2d55';
                    item.ctx.beginPath();
                    item.ctx.arc(p2.x, p2.y, 5, 0, Math.PI * 2);
                    item.ctx.fill();

                    const t = perpSlider.value / 100;
                    const pmX = p1.x + (p2.x - p1.x) * t;
                    const pmY = p1.y + (p2.y - p1.y) * t;
                    
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const len = Math.hypot(dx, dy);
                    
                    if (len > 0) {
                        const nx = -dy / len;
                        const ny = dx / len;
                        const perpLen = 2000;
                        
                        item.ctx.strokeStyle = '#ff2d55';
                        item.ctx.lineWidth = 2;
                        item.ctx.setLineDash([4, 4]);
                        item.ctx.beginPath();
                        item.ctx.moveTo(pmX - nx * perpLen, pmY - ny * perpLen);
                        item.ctx.lineTo(pmX + nx * perpLen, pmY + ny * perpLen);
                        item.ctx.stroke();
                        item.ctx.setLineDash([]);
                    }
                }
            }

            if (s.points.length > 0) {
                if (lastMeasureMode === 'angle') item.ctx.strokeStyle = item.ctx.fillStyle = '#00ffcc';
                else if (lastMeasureMode === 'distance') item.ctx.strokeStyle = item.ctx.fillStyle = '#ffcc00';
                else if (lastMeasureMode === 'accel') item.ctx.strokeStyle = item.ctx.fillStyle = '#ff375f';
                item.ctx.lineWidth = 3;

                let labels = lastMeasureMode === 'distance' ? ["始点", "終点"] : (lastMeasureMode === 'accel' ? ["点1", "点2", "点3"] : null);
                drawPointList(item.ctx, s.points, labels);
            }
        });
    }

    function drawPointList(cContext, ptList, labels) {
        if (ptList.length === 0) return;
        cContext.beginPath();
        for (let i = 0; i < ptList.length; i++) {
            if (i === 0) cContext.moveTo(ptList[i].x, ptList[i].y);
            else cContext.lineTo(ptList[i].x, ptList[i].y);
        }
        cContext.stroke();

        for (let i = 0; i < ptList.length; i++) {
            cContext.beginPath();
            cContext.arc(ptList[i].x, ptList[i].y, 5, 0, Math.PI * 2);
            cContext.fill();
            if (labels) {
                const text = Array.isArray(labels) ? labels[i] : `${labels}${i + 1}`;
                if (text) {
                    cContext.fillStyle = '#fff'; cContext.font = 'bold 10px sans-serif';
                    cContext.fillText(text, ptList[i].x + 7, ptList[i].y - 5);
                    cContext.fillStyle = cContext.strokeStyle;
                }
            }
        }
    }

    function captureSnapshot() {
        if (!video1.videoWidth && !video2.videoWidth) {
            alert("動画が読み込まれていません");
            return;
        }
        const snapCanvas = document.createElement('canvas');
        const snapCtx = snapCanvas.getContext('2d');
        
        const w = (compareMode === 1) ? canvas1.width * 2 : canvas1.width;
        const h = canvas1.height;
        snapCanvas.width = w;
        snapCanvas.height = h + 60;

        snapCtx.fillStyle = '#000';
        snapCtx.fillRect(0, 0, snapCanvas.width, snapCanvas.height);

        if (video1.videoWidth) {
            snapCtx.drawImage(video1, 0, 0, canvas1.width, h);
            snapCtx.drawImage(canvas1, 0, 0);
        }

        if (compareMode === 1 && video2.videoWidth) {
            snapCtx.drawImage(video2, canvas1.width, 0, canvas1.width, h);
            snapCtx.drawImage(canvas2, canvas1.width, 0);
        } else if (compareMode === 2 && video2.videoWidth) {
            snapCtx.globalAlpha = 0.5;
            snapCtx.drawImage(video2, 0, 0, canvas1.width, h);
            snapCtx.drawImage(canvas2, 0, 0);
            snapCtx.globalAlpha = 1.0;
        }

        snapCtx.fillStyle = '#1c1c1e';
        snapCtx.fillRect(0, h, snapCanvas.width, 60);
        snapCtx.fillStyle = '#00ffcc';
        snapCtx.font = 'bold 14px -apple-system, sans-serif';
        snapCtx.fillText(mainResult.innerText, 15, h + 24);

        snapCtx.fillStyle = '#ccc';
        snapCtx.font = '11px -apple-system, sans-serif';
        const cleanSubText = subResult.innerText.replace(/<[^>]*>?/gm, ' ');
        snapCtx.fillText(cleanSubText, 15, h + 46);

        document.getElementById('snapshot-img').src = snapCanvas.toDataURL('image/png');
        document.getElementById('snapshot-modal-overlay').style.display = 'flex';
    }
    function closeSnapshotModal() { document.getElementById('snapshot-modal-overlay').style.display = 'none'; }
</script>
